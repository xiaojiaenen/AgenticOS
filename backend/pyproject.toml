[project]
name = "agenticos"
# 版本号以仓库根目录 VERSION 为唯一来源，本处与 frontend/package.json 保持同步
version = "3.2.0"
description = "FastAPI scaffold for AgenticOS"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "pymysql>=1.1.1,<2.0.0",
    "python-multipart>=0.0.20,<1.0.0",
    "pydantic-settings>=2.10.0,<3.0.0",
    "sqlalchemy>=2.0.44,<3.0.0",
    "uvicorn[standard]>=0.35.0,<1.0.0",
    # 3.3.1 起上游改了 AgentRunner 的内部签名（去掉了 `task` 参数）并在
    # `_generate_stream` 收尾时统一把异常翻成 LLMError。`app/services/agent/
    # wuwei_patches.py` 与 `llm_providers/adapter.py` 已按 3.3.1 对齐。
    # 3.3.2 官方修复了 checkpoint 还原后 metadata["action_log"] 是 dict、
    # get_or_create_log() 只认 None 导致 `.append()` 崩溃（工具执行后无最终回复）
    # —— 新增 coerce_action_log() 统一收敛带标记/裸 dict 两种历史形态，
    # 内网那处改 site-packages 的临时补丁不再需要。
    # 3.3.3 修了两处本项目报过的上游缺陷：
    #   - structured-output 不再 insert(0, SystemMessage) 造成相邻两条 system
    #     （OpenAI 兼容端 400 "System message must be at the beginning"），
    #     改为并入首条 system 且幂等；适配器边界也补了 _coalesce_system_messages。
    #   - LLMResponse 新增 steps_used / max_steps，调用方可程序化判断「被
    #     max_steps 截断」而不是靠匹配文案。
    # 因此下限提到 3.3.3。本项目 adapter.py 里的 normalize_system_messages
    # 保留为下游兜底（幂等、无害），上游生效后自然不再触发。
    # 3.4.1 的实测核对（2026-11-12 升级）：
    #   - ``_as_llm_error`` 升级为 classmethod 并新增 ``provider`` 位置参数
    #     （``_raise_translated`` 以 ``cls._as_llm_error(exc, provider)`` 调用），
    #     本项目 RetryingGateway 的覆写已对齐该签名（升级时实测踩到 TypeError）。
    #   - R-6 已修：unknown 判定不再做内容子串匹配，改读结构化
    #     ``tool_outcome.status``；本项目 PatchedAgentRunner 的「委托+纠正」
    #     补丁成为空转安全网（回归测试不冲突，按纪律保留待清理）。
    #   - R-8 已修：并发批次异常判定放宽到 ``BaseException``。
    #   - R-7 未修：``can_batch`` 仍要求中间件栈无工具钩子（新增了静默降级
    #     的 warning），``BatchSafeMiddlewareProxy`` 仍然必要。
    #   - executor 已原生具备 _execute_batched / serialize_output 骨架。
    "wuwei>=3.4.1",
    # 下面两个是**直接依赖**，必须显式声明，不能靠传递依赖侥幸拿到：
    # - httpx：app/ 下 14 个文件直接 import（外部系统、图像工具、鉴权代理等）。
    #   openai 3.x 起不再自动安装 httpx（改用 httpx2），只靠别人传递是定时炸弹。
    # - openai：llm_providers 的适配器与错误分类直接 import。
    #   版本下限与 wuwei 3.3.1 的要求保持一致（>=3.40.0）。
    "httpx>=0.28.0,<1.0.0",
    "openai>=3.40.0,<4.0.0",
    # - mcp：MCP 官方 SDK。wuwei 把 MCP 放在 optional extra 里（`wuwei[mcp]`），
    #   本项目**在管理后台直接暴露「MCP 服务器」接入能力**（mcp_service.py
    #   直接 import wuwei.mcp 的 HTTPMCPClient / StdioMCPClient），
    #   所以它是生产依赖而不是可选 extra —— 不声明会导致管理面板能配服务器、
    #   但实际连接时 ModuleNotFoundError，通道形同虚设。
    "mcp>=2.2,<3",
    "python-pptx>=1.0.2",
    "pillow>=12.2.0",
    "markitdown[all]>=0.1.6",
    # Redis 客户端。taskiq-redis 要求 >=8.0，所以下限提到 8 —— 项目只在
    # core/redis.py 用 from_url / pubsub / aclose / RedisCluster，这些 API
    # 5→8 之间未变，已实测通过。
    "redis>=8.0.0,<9.0.0",
    "cryptography>=44.0.0,<45.0.0",
    "cachetools>=5.0.0,<6.0.0",
    "alembic>=1.14.0,<2.0.0",
    "playwright>=1.49.0",
    "pyyaml>=6.0.0",
    "pandas>=2.0.0",
    "numpy>=2.0.0",
    # 任务队列：arq 在 Redis Cluster 上无解（普通客户端 MOVED、
    # RedisCluster 拒绝 arq 依赖的事务），改用 taskiq + taskiq-redis，
    # 后者提供原生 cluster broker/backend/schedule source（全单 key 操作）。
    "taskiq>=0.13.0",
    "taskiq-redis>=1.2.4",
    "jieba>=0.42.1",
    "casbin>=1.43.0",
    "authlib>=1.6.12",
    "ldap3>=2.9.1,<3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0,<9.0.0",
    # tests/ 下 30+ 个用例用 @pytest.mark.asyncio 驱动 async 测试；
    # 不声明的话 uv sync 出的干净环境里它们全部以
    # "async def functions are not natively supported" 失败（本地能跑只是因为
    # 开发机全局装过，属于环境漂移）。
    "pytest-asyncio>=1.2.0,<2.0.0",
    "ruff>=0.16.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
# 与 CI 一致：默认只跑正式测试。examples/ 是实验性用例，需要显式
# `pytest examples` 才会执行（且依赖 node / office-runtime 等本地环境）。
testpaths = ["tests"]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["examples", "scripts"]

[tool.ruff.lint]
# 起步规则集：错误级 + pyflakes；后续可逐步加 E501/isort/B 等
select = ["E7", "E9", "F"]
ignore = [
  # conftest/agent_service 等存在"先注入环境变量再 import"的刻意模式，属代码库约定
  "E402",
  # 存量风格问题，待专项清理后再纳入门禁
  "E701", "E702", "E741", "F841",
]
