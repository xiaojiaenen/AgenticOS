[project]
name = "agenticos"
# 版本号以仓库根目录 VERSION 为唯一来源，本处与 frontend/package.json 保持同步
version = "3.2.0"
description = "FastAPI scaffold for AgenticOS"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "pymysql>=1.1.1,<2.0.0",
    "python-multipart>=0.0.20,<1.0.0",
    "pydantic-settings>=2.10.0,<3.0.0",
    "sqlalchemy>=2.0.44,<3.0.0",
    "uvicorn[standard]>=0.35.0,<1.0.0",
    "wuwei>=3.2.2",
    # 下面两个是**直接依赖**，必须显式声明，不能靠传递依赖侥幸拿到：
    # - httpx：app/ 下 14 个文件直接 import（外部系统、图像工具、鉴权代理等）。
    #   openai 3.x 起不再自动安装 httpx（改用 httpx2），只靠别人传递是定时炸弹。
    # - openai：llm_providers 的适配器与错误分类直接 import。
    #   版本下限与 wuwei 3.2.2 的要求保持一致（>=3.23.0）。
    "httpx>=0.28.0,<1.0.0",
    "openai>=3.23.0,<4.0.0",
    "python-pptx>=1.0.2",
    "pillow>=12.2.0",
    "markitdown[all]>=0.1.6",
    "redis>=5.0.0,<6.0.0",
    "cryptography>=44.0.0,<45.0.0",
    "cachetools>=5.0.0,<6.0.0",
    "alembic>=1.14.0,<2.0.0",
    "playwright>=1.49.0",
    "pyyaml>=6.0.0",
    "pandas>=2.0.0",
    "numpy>=2.0.0",
    "arq>=0.28.0",
    "jieba>=0.42.1",
    "casbin>=1.43.0",
    "authlib>=1.6.12",
    "ldap3>=2.9.1,<3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0,<9.0.0",
    "ruff>=0.16.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
# 与 CI 一致：默认只跑正式测试。examples/ 是实验性用例，需要显式
# `pytest examples` 才会执行（且依赖 node / office-runtime 等本地环境）。
testpaths = ["tests"]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["examples", "scripts"]

[tool.ruff.lint]
# 起步规则集：错误级 + pyflakes；后续可逐步加 E501/isort/B 等
select = ["E7", "E9", "F"]
ignore = [
  # conftest/agent_service 等存在"先注入环境变量再 import"的刻意模式，属代码库约定
  "E402",
  # 存量风格问题，待专项清理后再纳入门禁
  "E701", "E702", "E741", "F841",
]
