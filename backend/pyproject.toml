[project]
name = "agenticos"
version = "0.1.0"
description = "FastAPI scaffold for AgenticOS"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "pymysql>=1.1.1,<2.0.0",
    "python-multipart>=0.0.20,<1.0.0",
    "pydantic-settings>=2.10.0,<3.0.0",
    "sqlalchemy>=2.0.44,<3.0.0",
    "uvicorn[standard]>=0.35.0,<1.0.0",
    "wuwei>=3.0.2",
    "python-pptx>=1.0.2",
    "pillow>=12.2.0",
    "markitdown[all]>=0.1.6",
    "redis>=5.0.0,<6.0.0",
    "cryptography>=44.0.0,<45.0.0",
    "cachetools>=5.0.0,<6.0.0",
    "alembic>=1.14.0,<2.0.0",
    "playwright>=1.49.0",
    "pyyaml>=6.0.0",
    "pandas>=2.0.0",
    "numpy>=2.0.0",
    "arq>=0.28.0",
    "jieba>=0.42.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0,<1.0.0",
    "pytest>=8.4.0,<9.0.0",
    "ruff>=0.16.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["examples", "scripts"]

[tool.ruff.lint]
# 起步规则集：错误级 + pyflakes；后续可逐步加 E501/isort/B 等
select = ["E7", "E9", "F"]
ignore = [
  # conftest/agent_service 等存在"先注入环境变量再 import"的刻意模式，属代码库约定
  "E402",
  # 存量风格问题，待专项清理后再纳入门禁
  "E701", "E702", "E741", "F841",
]
