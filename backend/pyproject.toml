[project]
name = "agenticos"
# 版本号以仓库根目录 VERSION 为唯一来源，本处与 frontend/package.json 保持同步
version = "3.2.0"
description = "FastAPI scaffold for AgenticOS"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "pymysql>=1.1.1,<2.0.0",
    "python-multipart>=0.0.20,<1.0.0",
    "pydantic-settings>=2.10.0,<3.0.0",
    "sqlalchemy>=2.0.44,<3.0.0",
    "uvicorn[standard]>=0.35.0,<1.0.0",
    # （wuwei 框架已按迁移方案完全退役，见 docs/design/wuwei迁移LangChain方案.md）
    # 下面两个是**直接依赖**，必须显式声明，不能靠传递依赖侥幸拿到：
    # - httpx：app/ 下 14 个文件直接 import（外部系统、图像工具、鉴权代理等）。
    #   openai 3.x 起不再自动安装 httpx（改用 httpx2），只靠别人传递是定时炸弹。
    # - openai：llm_providers 原生网关与错误分类直接 import。
    "httpx>=0.28.0,<1.0.0",
    "openai>=3.40.0,<4.0.0",
    # - mcp：MCP 官方 SDK（mcp_service / mcp_native 的客户端与工具适配基于它）。
    "mcp>=2.2,<3",
    "python-pptx>=1.0.2",
    "pillow>=12.2.0",
    "markitdown[all]>=0.1.6",
    # Redis 客户端。taskiq-redis 要求 >=8.0，所以下限提到 8 —— 项目只在
    # core/redis.py 用 from_url / pubsub / aclose / RedisCluster，这些 API
    # 5→8 之间未变，已实测通过。
    "redis>=8.0.0,<9.0.0",
    "cryptography>=44.0.0,<45.0.0",
    "cachetools>=5.0.0,<6.0.0",
    "alembic>=1.14.0,<2.0.0",
    "playwright>=1.49.0",
    "pyyaml>=6.0.0",
    "pandas>=2.0.0",
    "numpy>=2.0.0",
    # 本地知识库向量（ONNX，零 API 成本、无需 torch）：fastembed 优先，
    # 加载模块时才 import，未配本地模型时零开销；sentence-transformers 为可选回退。
    "fastembed>=0.7.0,<1.0.0",
    # 任务队列：arq 在 Redis Cluster 上无解（普通客户端 MOVED、
    # RedisCluster 拒绝 arq 依赖的事务），改用 taskiq + taskiq-redis，
    # 后者提供原生 cluster broker/backend/schedule source（全单 key 操作）。
    "taskiq>=0.13.0",
    "taskiq-redis>=1.2.4",
    "jieba>=0.42.1",
    "casbin>=1.43.0",
    "authlib>=1.6.12",
    "ldap3>=2.9.1,<3.0.0",
    # ── 自研归位（docs/design/系统改造总方案.md 战线 B）──────────────────
    # JWT：手写 base64+HMAC → PyJWT（标准实现，算法白名单）。不用
    # python-jose（CVE 前科）。签名/载荷格式保持兼容（HS256）。
    "pyjwt>=2.15.1,<3.0.0",
    # 密码哈希：PBKDF2 → Argon2id（OWASP 首选）。存量 pbkdf2 哈希在登录时
    # 双验过渡并无缝升级（见 core/security.py）。passlib 已停维护，不用。
    "argon2-cffi>=25.1.0,<26.0.0",
    # 内存 Redis fallback → fakeredis（redis-py 的 drop-in 替身，语义保真）。
    # 仅开发/测试 fallback；生产仍应配真实 Redis（见 core/redis.py）。
    "fakeredis>=2.40.0,<3.0.0",
    # 检索重排：启发式四信号 → FlashRank（本地 ONNX cross-encoder，
    # Apache-2.0）。接口 score_result 已预留；不可用（无模型/离线）时
    # 自动降级回启发式实现（见 knowledge/rerank.py）。
    "flashrank>=0.2.10,<0.3.0",
    # ── 框架底座（DeepAgents harness + LangGraph）────────────────────────
    # 唯一引擎：create_deep_agent（内置 filesystem/skills/subagents/summarization）。
    # wuwei 已整体退役，AGENT_ENGINE 特性开关已移除；升级须跑契约回归。
    "langgraph>=1.2.24,<2.0.0",
    "langgraph-checkpoint-sqlite>=3.1.0,<4.0.0",
    "aiosqlite>=0.20.0",
    "langchain>=1.5.2,<2.0.0",
    "langchain-openai>=1.0.0,<2.0.0",
    # 可观测（战线 D，3F.0 纯库红线）：OpenTelemetry SDK 埋点写自家 DB，
    # 沿用现有 traces 展示；不接 Langfuse（外部系统）/ 不部署 collector。
    "opentelemetry-api>=1.29.0,<2.0.0",
    "opentelemetry-sdk>=1.29.0,<2.0.0",
    "llama-index-core>=0.12.0,<0.13.0",
    "llama-index-retrievers-bm25>=0.5.2",
    "deepagents==0.7.41",
]

# 可选 extra：生产推荐 PostgreSQL（docs/design/数据库选型评估-MySQL到PostgreSQL.md）
[project.optional-dependencies]
pg = ["psycopg[binary]>=3.2.0,<4.0.0"]
# LiteLLM Python SDK 旁路 PoC（3B.2）：纯库统一调用多 provider；Proxy 形态按红线排除
litellm = ["litellm>=1.80.0"]
# RAGAS 评估（旁路 PoC，eval_ragas_poc.py）：**不能进 pyproject 依赖/extra** ——
# uv lock 会解析全环境，ragas→instructor 钉 openai<3.0 与本项目 openai>=3.40
# 硬冲突（实测 No solution）。真实联网评估请在独立 venv 里
# `pip install ragas`（代码契约已由 test_eval_ragas_poc.py 用 fake-module 锁定）。

[dependency-groups]
dev = [
    "pytest>=8.4.0,<9.0.0",
    # tests/ 下 30+ 个用例用 @pytest.mark.asyncio 驱动 async 测试；
    # 不声明的话 uv sync 出的干净环境里它们全部以
    # "async def functions are not natively supported" 失败（本地能跑只是因为
    # 开发机全局装过，属于环境漂移）。
    "pytest-asyncio>=1.2.0,<2.0.0",
    "ruff>=0.16.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
# 与 CI 一致：默认只跑正式测试。examples/ 是实验性用例，需要显式
# `pytest examples` 才会执行（且依赖 node / office-runtime 等本地环境）。
testpaths = ["tests"]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["examples", "scripts"]

[tool.ruff.lint]
# 起步规则集：错误级 + pyflakes；后续可逐步加 E501/isort/B 等
select = ["E7", "E9", "F"]
ignore = [
  # conftest/agent_service 等存在"先注入环境变量再 import"的刻意模式，属代码库约定
  "E402",
  # 存量风格问题，待专项清理后再纳入门禁
  "E701", "E702", "E741", "F841",
]
