# AgenticOS 权限模型（Casbin）
#
# 设计要点（M6-C / docs/design/m6-design.md 第四节）：
#
# - r = sub, dom, obj, act
#     sub : 主体，统一为 `user:<users.id>`（如 user:7）
#     dom : 域。`dept:<departments.id>` 表示部门域，`global` 表示不属于任何部门的全局域
#     obj : 资源串，`<resource_type>:<resource_id>`，如 `kb:3`；无 id 时退化为 `<resource_type>`
#     act : 动作，read / write / delete / admin
#
# - 部门隔离由 **g 关系的域** 承载，而不是 p 关系的域：
#   `g, user:7, dept_admin, dept:2` 只在 dom=dept:2 下生效，
#   因此 `p, dept_admin, *, *, read` 里的 `*` 只会被该用户在自己的部门域内命中。
#   这正是设计稿 `g, alice, dept_admin, dept:finance` 的语义。
#
# - 匹配器里的三段 or 分别覆盖：
#     g(r.sub, p.sub, r.dom)  → 角色在当前域生效（如 dept_admin 限本部门）
#     g(r.sub, p.sub, "*")    → 全局域角色（admin），不受部门影响
#     r.sub == p.sub          → 直接授权（个人资源，如知识库 owner）
#
# - 为什么用 keyMatch 而不是 keyMatch2
#   keyMatch2 会把模式里的 ``:xxx`` 当通配参数：``keyMatch2("kb:4", "kb:3")`` 返回
#   True（``kb:3`` 被编译成 ``kb[^/]+``）。本模型的 obj 恰好是 ``<type>:<id>``，
#   用 keyMatch2 会让「授权 kb:3」意外放行 kb:4 —— 行级越权。
#   keyMatch 只在模式含 ``*`` 时做前缀匹配，``kb:*`` / ``*`` 通配照常可用，
#   资源 id 则是精确匹配。
#
# 策略示例（app/services/permission_service.py::ensure_default_policies 幂等写入）：
#   p, admin,     *, *,    *
#   p, dept_admin, *, kb:*, read
#   p, dept_admin, *, kb:*, write
#   p, dept_admin, *, kb:*, delete
#   g, user:1, admin, *
#   g, user:7, dept_admin, dept:2
#   p, user:9, *, kb:12, write          # 知识库 owner 的直接授权

[request_definition]
r = sub, dom, obj, act

[policy_definition]
p = sub, dom, obj, act

[role_definition]
g = _, _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = (g(r.sub, p.sub, r.dom) || g(r.sub, p.sub, "*") || r.sub == p.sub) && (p.dom == "*" || r.dom == p.dom) && keyMatch(r.obj, p.obj) && (p.act == "*" || r.act == p.act)
