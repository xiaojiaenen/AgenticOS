<!--
  Tailwind CSS content safelist for PPT slide rendering.
  Every class used by ppt_artifact_service.py must appear here
  so the Tailwind CLI includes it in the compiled CSS.
-->

<!-- ===== Cover Slide ===== -->
<div class="
  agenticos-ppt-page relative w-[1000px] h-[562.5px] overflow-hidden rounded-[20px] border border-black/[0.06]
  bg-[var(--ppt-bg)] text-[var(--ppt-text)]
  shadow-[0_24px_70px_rgba(15,23,42,0.12)]
"></div>
<div class="absolute inset-0 opacity-[0.42]
  bg-[linear-gradient(90deg,rgba(15,23,42,0.045)_1px,transparent_1px),linear-gradient(0deg,rgba(15,23,42,0.045)_1px,transparent_1px)]
  bg-[length:48px_48px]"></div>
<div class="absolute -right-20 -top-24 w-72 h-72 rounded-full bg-white/50"></div>
<div class="absolute left-16 -bottom-24 w-64 h-64 rounded-full bg-[var(--ppt-accent-soft)] opacity-45"></div>
<div class="absolute left-14 top-12 flex items-center gap-3 text-white/60 text-[13px] font-black uppercase tracking-[0.24em]"></div>
<div class="block h-2 w-16 rounded-full bg-[var(--ppt-accent)]"></div>
<div class="absolute left-14 top-[158px] w-[660px]"></div>
<h1 class="text-[62px] leading-[0.96] font-black text-white"></h1>
<p class="mt-7 max-w-[540px] text-white/70 text-[22px] leading-[1.35] font-semibold"></p>
<div class="absolute right-14 bottom-16 w-40 h-40 rounded-[34px] bg-[var(--ppt-accent)]"></div>
<div class="absolute right-10 bottom-8 text-xs font-extrabold tracking-[0.18em] text-white/40"></div>

<!-- Dark grid variant -->
<div class="absolute inset-0 opacity-[0.42]
  bg-[linear-gradient(90deg,rgba(255,255,255,0.055)_1px,transparent_1px),linear-gradient(0deg,rgba(255,255,255,0.055)_1px,transparent_1px)]
  bg-[length:48px_48px]"></div>

<!-- ===== Section Slide ===== -->
<div class="absolute left-0 top-0 w-3 h-full bg-[var(--ppt-accent)]"></div>
<div class="absolute left-20 top-28 w-[760px]"></div>
<h2 class="mt-7 text-[56px] leading-[1.02] font-black text-white"></h2>
<p class="mt-6 max-w-[620px] text-white/60 text-[22px] leading-[1.35]"></p>
<div class="absolute left-14 top-12 text-[13px] font-black uppercase tracking-[0.2em] text-[var(--ppt-accent-text)]"></div>

<!-- ===== Bullets Slide ===== -->
<div class="absolute left-12 top-12 right-12"></div>
<h2 class="max-w-[650px] text-[42px] leading-[1.04] font-black text-[var(--ppt-text)]"></h2>
<p class="mt-4 max-w-[540px] text-[var(--ppt-muted)] text-[17px] leading-[1.45]"></p>
<div class="absolute right-12 top-[132px] w-[460px] grid gap-4"></div>
<div class="flex gap-4 items-start rounded-[22px] bg-white p-4 pl-5 shadow-[0_18px_40px_rgba(15,23,42,0.08)] text-[#1e293b]"></div>
<div class="flex-shrink-0 flex items-center justify-center w-9 h-9 rounded-full bg-[var(--ppt-accent)] text-white text-[13px] font-black"></div>
<p class="text-[20px] leading-[1.28] font-extrabold"></p>

<!-- ===== Comparison Slide ===== -->
<div class="absolute left-12 top-10 right-12 flex items-end justify-between"></div>
<h2 class="w-[580px] text-[40px] leading-[1.04] font-black"></h2>
<div class="absolute left-12 right-12 top-[146px] grid grid-cols-2 gap-6"></div>
<div class="h-[330px] rounded-[28px] bg-white p-8 shadow-[0_18px_50px_rgba(15,23,42,0.08)]"></div>
<div class="h-[330px] rounded-[28px] bg-[var(--ppt-dark)] p-8 shadow-[0_18px_50px_rgba(15,23,42,0.08)] text-white"></div>
<h3 class="mb-6 text-[var(--ppt-muted)] text-[15px] font-black uppercase tracking-[0.18em]"></h3>
<h3 class="mb-6 text-white/55 text-[15px] font-black uppercase tracking-[0.18em]"></h3>
<div class="flex gap-4 items-start mb-4"></div>
<div class="w-[10px] h-[10px] mt-2 flex-shrink-0 rounded-full bg-[var(--ppt-accent)]"></div>
<p class="text-[18px] leading-[1.28] font-extrabold"></p>

<!-- ===== Stats Slide ===== -->
<div class="absolute left-12 top-12 right-12"></div>
<div class="absolute left-12 right-12 bottom-[88px] grid grid-cols-3 gap-5"></div>
<div class="h-[210px] rounded-[30px] bg-white p-7 shadow-[0_18px_50px_rgba(15,23,42,0.08)]"></div>
<div class="h-[210px] rounded-[30px] bg-[var(--ppt-dark)] p-7 shadow-[0_18px_50px_rgba(15,23,42,0.08)] text-white"></div>
<strong class="block text-[60px] leading-none font-black"></strong>
<h3 class="mt-7 text-[20px] leading-[1.15] font-black"></h3>
<p class="mt-3 text-[var(--ppt-muted)] text-[13px] leading-[1.35]"></p>
<p class="mt-3 text-white/50 text-[13px] leading-[1.35]"></p>

<!-- ===== Timeline Slide ===== -->
<div class="absolute left-14 right-14 top-[178px] grid grid-cols-5 gap-4"></div>
<div class="relative z-[1] flex flex-col items-center"></div>
<span class="flex items-center justify-center w-12 h-12 rounded-full bg-[var(--ppt-accent)] text-white text-[13px] font-black"></span>
<h3 class="mt-5 text-[#0f172a] text-[19px] leading-[1.12] font-black"></h3>
<p class="mt-3 text-[var(--ppt-muted)] text-[13px] leading-[1.35]"></p>

<!-- ===== Chart Slide ===== -->
<div class="absolute left-12 right-12 top-10 flex items-start justify-between"></div>
<span class="rounded-full bg-[var(--ppt-accent-soft)] text-[var(--ppt-accent-text)] px-4 py-2 text-xs font-black uppercase tracking-[0.18em]"></span>
<div class="absolute left-12 right-12 top-[184px] grid grid-cols-[1fr_300px] gap-7"></div>
<div class="h-[300px] rounded-[32px] bg-white p-7 flex items-end gap-5 shadow-[0_22px_56px_rgba(15,23,42,0.1)]"></div>
<div class="flex-1 flex flex-col items-center gap-3"></div>
<div class="w-full rounded-t-[18px] bg-[var(--ppt-accent)] text-center text-white text-[15px] font-black pt-3"></div>
<div class="h-[300px] rounded-[32px] bg-[var(--ppt-dark)] p-7 shadow-[0_22px_56px_rgba(15,23,42,0.16)] text-white"></div>
<strong class="block mt-7 text-[52px] leading-none font-black"></strong>
<p class="mt-6 text-white/80 text-[18px] leading-[1.32] font-extrabold"></p>

<!-- ===== Quote Slide ===== -->
<div class="absolute left-14 top-[88px] w-[760px]"></div>
<span class="text-white/15 text-[82px] font-black leading-none"></span>
<h2 class="text-[38px] leading-[1.16] font-black text-white"></h2>
<p class="mt-8 text-white/45 text-[16px] font-black uppercase tracking-[0.2em]"></p>

<!-- ===== ImageText Slide ===== -->
<div class="absolute left-0 top-0 w-[390px] h-full bg-[var(--ppt-dark)]"></div>
<div class="absolute left-[176px] top-[92px] w-[380px] h-[380px] overflow-hidden rounded-[34px] bg-[var(--ppt-accent)] shadow-[0_20px_60px_rgba(15,23,42,0.2)]"></div>
<div class="absolute right-14 top-[94px] w-[450px]"></div>
<h2 class="text-[40px] leading-[1.05] font-black"></h2>
<p class="mt-5 text-[var(--ppt-muted)] text-[19px] leading-[1.45] font-semibold"></p>
<div class="flex gap-4 items-start mt-3"></div>
<p class="text-[17px] leading-[1.28] font-extrabold"></p>

<!-- ===== Closing Slide ===== -->
<div class="absolute inset-0 flex flex-col items-center justify-center text-center"></div>
<span class="block h-2 w-16 rounded-full bg-[var(--ppt-accent)]"></span>
<h2 class="mt-9 max-w-[760px] text-[56px] leading-[1.02] font-black text-white"></h2>
<p class="mt-6 max-w-[620px] text-white/60 text-[21px] leading-[1.38]"></p>

<!-- ===== Common ===== -->
<div class="ppt-preview-card w-[720px] h-[405px] mb-8 origin-top-left"></div>
<div class="scale-[0.72] origin-top-left"></div>
<span class="text-white/45 text-[13px] font-black uppercase tracking-[0.18em]"></span>
