[alembic]
# Alembic config: sqlalchemy.url is intentionally left empty; env.py falls back
# to the application settings (DATABASE_URL env var / .env). Fill it in to
# override explicitly (env.py prefers this value when non-empty).
script_location = alembic
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s

# empty = use app settings database_url (DATABASE_URL)
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
