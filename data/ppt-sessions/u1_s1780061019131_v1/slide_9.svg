<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1280 720' data-theme='nike'>
  <rect width='1280' height='720' fill='var(--bg-soft)'/>
  <g id='section-decor'>
    <rect x='0' y='0' width='1280' height='5' fill='var(--accent)'/>
    <rect x='900' y='100' width='500' height='500' rx='250' fill='var(--accent)' fill-opacity='0.04'/>
    <rect x='960' y='160' width='380' height='380' rx='190' fill='var(--accent)' fill-opacity='0.06'/>
    <rect x='1020' y='220' width='260' height='260' rx='130' fill='var(--accent)' fill-opacity='0.08'/>
  </g>
  <g id='section-content'>
    <text x='120' y='260' font-size='150' font-weight='900' fill='var(--accent)' fill-opacity='0.10' font-family='Inter,Noto Sans SC,sans-serif'>03</text>
    <text x='120' y='320' font-size='20' fill='var(--accent)' font-weight='700' font-family='Inter,Noto Sans SC,sans-serif' letter-spacing='5'>SECTION 03</text>
    <text x='120' y='400' font-size='52' font-weight='800' fill='var(--text-1)' font-family='Inter,Noto Sans SC,sans-serif'>选择格力的理由</text>
    <text x='120' y='460' font-size='22' fill='var(--text-2)' font-family='Inter,Noto Sans SC,sans-serif'>不只是买一台空调，更是选择一种品质生活方式</text>
  </g>
  <g id='section-footer'>
    <text x='1180' y='680' text-anchor='end' font-size='13' fill='var(--text-3)' font-family='Inter,Noto Sans SC,sans-serif'>9 / 10</text>
  </g>
  <!-- notes: 第三章节——选择格力的理由。前面讲了技术和产品，现在要回到消费者视角：为什么要选格力？不只是参数好，更是品质生活的选择。这页停顿一下，让观众带着期待往下看。 -->
</svg>