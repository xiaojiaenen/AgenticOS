<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1280 720' data-theme='nike'>
  <rect width='1280' height='720' fill='var(--bg)'/>
  <g id='page-header'>
    <text x='80' y='65' font-size='18' fill='var(--accent)' font-weight='700' font-family='Inter,Noto Sans SC,sans-serif' letter-spacing='2'>CORE TECHNOLOGY</text>
    <text x='80' y='115' font-size='38' font-weight='700' fill='var(--text-1)' font-family='Inter,Noto Sans SC,sans-serif'>三大核心技术，引领行业标准</text>
  </g>
  <!-- 卡片1：压缩机技术 -->
  <g id='tech-card-1'>
    <rect x='60' y='170' width='370' height='440' rx='20' fill='var(--surface)'/>
    <rect x='60' y='170' width='370' height='6' rx='3' fill='var(--accent)'/>
    <circle cx='245' cy='250' r='36' fill='var(--accent)' fill-opacity='0.12'/>
    <use data-icon='chunk-filled/lightning' x='221' y='226' width='48' height='48' fill='var(--accent)'/>
    <text x='245' y='330' font-size='26' font-weight='800' fill='var(--text-1)' text-anchor='middle' font-family='Inter,Noto Sans SC,sans-serif'>凌达压缩机</text>
    <text x='100' y='375' font-size='15' fill='var(--text-2)' font-family='Inter,Noto Sans SC,sans-serif'>
      <tspan x='100' dy='0'>自主研发生产，年产超 6000 万台</tspan>
      <tspan x='100' dy='28'>COP 值高达 4.8，远超国家一级能效</tspan>
      <tspan x='100' dy='28'>-35℃~54℃ 极端环境稳定运行</tspan>
      <tspan x='100' dy='28'>10 年质保承诺，行业最长</tspan>
    </text>
    <rect x='100' y='510' width='90' height='32' rx='16' fill='var(--accent)' fill-opacity='0.12'/>
    <text x='145' y='531' font-size='13' fill='var(--accent)' font-weight='700' text-anchor='middle' font-family='Inter,Noto Sans SC,sans-serif'>自主研发</text>
  </g>
  <!-- 卡片2：变频技术 -->
  <g id='tech-card-2'>
    <rect x='455' y='170' width='370' height='440' rx='20' fill='var(--surface)'/>
    <rect x='455' y='170' width='370' height='6' rx='3' fill='var(--accent-2)'/>
    <circle cx='640' cy='250' r='36' fill='var(--accent-2)' fill-opacity='0.12'/>
    <use data-icon='chunk-filled/chart' x='616' y='226' width='48' height='48' fill='var(--accent-2)'/>
    <text x='640' y='330' font-size='26' font-weight='800' fill='var(--text-1)' text-anchor='middle' font-family='Inter,Noto Sans SC,sans-serif'>变频节能技术</text>
    <text x='495' y='375' font-size='15' fill='var(--text-2)' font-family='Inter,Noto Sans SC,sans-serif'>
      <tspan x='495' dy='0'>1Hz 超低频运行，精确控温 ±0.5℃</tspan>
      <tspan x='495' dy='28'>全直流变频，省电高达 40%</tspan>
      <tspan x='495' dy='28'>启动电流仅为定频空调的 1/3</tspan>
      <tspan x='495' dy='28'>噪音低至 18dB，安静如图书馆</tspan>
    </text>
    <rect x='495' y='510' width='90' height='32' rx='16' fill='var(--accent-2)' fill-opacity='0.12'/>
    <text x='540' y='531' font-size='13' fill='var(--accent-2)' font-weight='700' text-anchor='middle' font-family='Inter,Noto Sans SC,sans-serif'>节能 40%</text>
  </g>
  <!-- 卡片3：智能控制 -->
  <g id='tech-card-3'>
    <rect x='850' y='170' width='370' height='440' rx='20' fill='var(--surface)'/>
    <rect x='850' y='170' width='370' height='6' rx='3' fill='var(--good)'/>
    <circle cx='1035' cy='250' r='36' fill='var(--good)' fill-opacity='0.12'/>
    <use data-icon='chunk-filled/cube' x='1011' y='226' width='48' height='48' fill='var(--good)'/>
    <text x='1035' y='330' font-size='26' font-weight='800' fill='var(--text-1)' text-anchor='middle' font-family='Inter,Noto Sans SC,sans-serif'>智能物联控制</text>
    <text x='890' y='375' font-size='15' fill='var(--text-2)' font-family='Inter,Noto Sans SC,sans-serif'>
      <tspan x='890' dy='0'>格力+ APP 远程操控，随时随地</tspan>
      <tspan x='890' dy='28'>AI 语音交互，说句话就能调温度</tspan>
      <tspan x='890' dy='28'>智能学习用户习惯，自动调节</tspan>
      <tspan x='890' dy='28'>全屋智能联动，打造智慧家庭</tspan>
    </text>
    <rect x='890' y='510' width='90' height='32' rx='16' fill='var(--good)' fill-opacity='0.12'/>
    <text x='935' y='531' font-size='13' fill='var(--good)' font-weight='700' text-anchor='middle' font-family='Inter,Noto Sans SC,sans-serif'>智慧生活</text>
  </g>
  <!-- 页脚 -->
  <g id='page-footer'>
    <text x='1180' y='680' text-anchor='end' font-size='13' fill='var(--text-3)' font-family='Inter,Noto Sans SC,sans-serif'>3 / 10</text>
  </g>
  <!-- notes: 三大核心技术是格力的护城河。讲这页的时候，重点讲"自主研发"——格力是行业唯一自己做压缩机的品牌，凌达压缩机年产6000万台，这个数字要强调。变频技术的1Hz超低频运行和18dB静音，都是消费者能直接感知的卖点。智能物联是面向未来的布局，年轻消费者会很感兴趣。每张卡片可以各讲1分钟。 -->
</svg>