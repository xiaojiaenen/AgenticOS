<svg xmlns='http://www.w3.org/2000/svg' viewBox="0 0 1280 720" data-theme='openai'>
  <g id='bg-layer'>
    <rect width='1280' height='720' fill='var(--bg)'/>
    <rect x='0' y='0' width='1280' height='4' fill='var(--accent)'/>
  </g>
  <g id='section-decor'>
    <text x='120' y='260' font-size='220' font-weight='900' fill='var(--accent)' fill-opacity='0.06' font-family='Inter,Noto Sans SC,sans-serif'>01</text>
  </g>
  <g id='section-content' font-family='Inter,Noto Sans SC,sans-serif'>
    <rect x='120' y='300' width='60' height='4' fill='var(--accent)'/>
    <text x='120' y='360' font-size='16' fill='var(--accent)' font-weight='600' letter-spacing='3'>CHAPTER 01</text>
    <text x='120' y='440' font-size='64' font-weight='800' fill='var(--text-1)'>使命与愿景</text>
    <text x='120' y='510' font-size='24' fill='var(--text-2)' font-weight='400'>从非营利实验室到全球 AI 领导者</text>
  </g>
  <g id='footer' text-anchor='end' font-family='Inter,Noto Sans SC,sans-serif'>
    <text x='1240' y='690' font-size='14' fill='var(--text-3)'>2 / 11</text>
  </g>
  <!-- notes: 章节分隔页，进入第一章"使命与愿景"。用超大淡出数字 01 做视觉符号，左侧对齐营造叙事节奏。建议简要回顾 OpenAI 2015 年创立时的初心："确保 AGI 惠及全人类"。 -->
</svg>