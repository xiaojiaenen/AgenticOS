<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1280 720' data-theme='cosmic'>
  <g id='bg-layer'>
    <rect width='1280' height='720' fill='var(--bg)'/>
    <circle cx='200' cy='100' r='1.5' fill='var(--text-3)' fill-opacity='0.5'/>
    <circle cx='1000' cy='50' r='1' fill='var(--text-3)' fill-opacity='0.4'/>
    <circle cx='150' cy='600' r='1.5' fill='var(--text-3)' fill-opacity='0.3'/>
    <circle cx='1150' cy='650' r='1' fill='var(--text-3)' fill-opacity='0.5'/>
  </g>
  <g id='page-header'>
    <rect x='0' y='0' width='1280' height='3' fill='var(--accent)'/>
    <text x='80' y='100' font-family='Inter,Noto Sans SC,sans-serif' font-size='42' font-weight='800' fill='var(--text-1)'>目 录</text>
    <text x='80' y='135' font-family='Inter,Noto Sans SC,sans-serif' font-size='18' fill='var(--text-3)'>CONTENTS</text>
    <rect x='80' y='152' width='60' height='3' fill='var(--accent)'/>
  </g>
  <g id='toc-chapter1'>
    <rect x='80' y='230' width='520' height='100' rx='12' fill='var(--surface)'/>
    <text x='120' y='275' font-family='Inter,Noto Sans SC,sans-serif' font-size='14' fill='var(--accent)' font-weight='600'>01</text>
    <text x='120' y='305' font-family='Inter,Noto Sans SC,sans-serif' font-size='24' font-weight='700' fill='var(--text-1)'>太阳系概况</text>
    <text x='380' y='305' font-family='Inter,Noto Sans SC,sans-serif' font-size='16' fill='var(--text-3)'>太阳系的诞生与整体结构</text>
  </g>
  <g id='toc-chapter2'>
    <rect x='80' y='350' width='520' height='100' rx='12' fill='var(--surface)'/>
    <text x='120' y='395' font-family='Inter,Noto Sans SC,sans-serif' font-size='14' fill='var(--accent)' font-weight='600'>02</text>
    <text x='120' y='425' font-family='Inter,Noto Sans SC,sans-serif' font-size='24' font-weight='700' fill='var(--text-1)'>类地行星</text>
    <text x='380' y='425' font-family='Inter,Noto Sans SC,sans-serif' font-size='16' fill='var(--text-3)'>水星 · 金星 · 地球 · 火星</text>
  </g>
  <g id='toc-chapter3'>
    <rect x='80' y='470' width='520' height='100' rx='12' fill='var(--surface)'/>
    <text x='120' y='515' font-family='Inter,Noto Sans SC,sans-serif' font-size='14' fill='var(--accent)' font-weight='600'>03</text>
    <text x='120' y='545' font-family='Inter,Noto Sans SC,sans-serif' font-size='24' font-weight='700' fill='var(--text-1)'>气态巨行星</text>
    <text x='380' y='545' font-family='Inter,Noto Sans SC,sans-serif' font-size='16' fill='var(--text-3)'>木星 · 土星 · 天王星 · 海王星</text>
  </g>
  <g id='toc-chapter4'>
    <rect x='80' y='590' width='520' height='100' rx='12' fill='var(--surface)'/>
    <text x='120' y='635' font-family='Inter,Noto Sans SC,sans-serif' font-size='14' fill='var(--accent)' font-weight='600'>04</text>
    <text x='120' y='665' font-family='Inter,Noto Sans SC,sans-serif' font-size='24' font-weight='700' fill='var(--text-1)'>从九到八</text>
    <text x='380' y='665' font-family='Inter,Noto Sans SC,sans-serif' font-size='16' fill='var(--text-3)'>冥王星降级与行星定义之争</text>
  </g>
  <g id='toc-right-decor'>
    <circle cx='950' cy='360' r='120' fill='none' stroke='var(--accent)' stroke-width='0.5' stroke-opacity='0.15'/>
    <circle cx='950' cy='360' r='80' fill='none' stroke='var(--accent)' stroke-width='0.5' stroke-opacity='0.1'/>
    <circle cx='950' cy='360' r='40' fill='none' stroke='var(--accent)' stroke-width='0.5' stroke-opacity='0.15'/>
    <circle cx='950' cy='360' r='6' fill='var(--accent)' fill-opacity='0.3'/>
  </g>
  <g id='footer'>
    <rect x='80' y='698' width='40' height='2' fill='var(--accent)'/>
    <text x='135' y='708' font-family='Inter,Noto Sans SC,sans-serif' font-size='12' fill='var(--text-3)'>02 / 12</text>
  </g>
  <!-- notes: 目录页——四大章节清晰划分：从整体概况到行星分类再到科学争议。右侧轨道图案呼应宇宙主题。引导观众进入"一次从近到远的星际旅程"。 -->
</svg>