<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1280 720' data-theme='cosmic'>
  <g id='bg-layer'>
    <rect width='1280' height='720' fill='var(--bg)'/>
    <!-- 星空 -->
    <circle cx='150' cy='80' r='1.5' fill='var(--text-3)' fill-opacity='0.6'/>
    <circle cx='400' cy='120' r='1' fill='var(--text-3)' fill-opacity='0.4'/>
    <circle cx='900' cy='60' r='2' fill='var(--text-3)' fill-opacity='0.5'/>
    <circle cx='1150' cy='150' r='1' fill='var(--text-3)' fill-opacity='0.3'/>
    <circle cx='100' cy='500' r='1.5' fill='var(--text-3)' fill-opacity='0.4'/>
    <circle cx='1200' cy='550' r='1' fill='var(--text-3)' fill-opacity='0.5'/>
    <circle cx='600' cy='650' r='1.5' fill='var(--text-3)' fill-opacity='0.3'/>
    <circle cx='300' cy='600' r='1' fill='var(--text-3)' fill-opacity='0.4'/>
    <circle cx='1050' cy='650' r='1.5' fill='var(--text-3)' fill-opacity='0.3'/>
  </g>
  <g id='decor-rings'>
    <ellipse cx='640' cy='400' rx='350' ry='60' fill='none' stroke='var(--accent)' stroke-width='0.8' stroke-opacity='0.12'/>
    <ellipse cx='640' cy='400' rx='280' ry='45' fill='none' stroke='var(--accent)' stroke-width='0.5' stroke-opacity='0.08'/>
    <circle cx='640' cy='400' r='20' fill='var(--accent)' fill-opacity='0.08'/>
  </g>
  <g id='thanks-text'>
    <text x='640' y='280' text-anchor='middle' font-family='Playfair Display,Noto Serif SC,serif' font-size='72' font-weight='700' fill='var(--text-1)'>感谢聆听</text>
    <text x='640' y='350' text-anchor='middle' font-family='Inter,Noto Sans SC,sans-serif' font-size='22' fill='var(--text-3)'>THANK YOU FOR EXPLORING</text>
    <text x='640' y='400' text-anchor='middle' font-family='Inter,Noto Sans SC,sans-serif' font-size='16' fill='var(--text-2)'>宇宙的浩瀚远超我们的想象，探索才刚刚开始</text>
  </g>
  <g id='contact-info'>
    <rect x='490' y='470' width='300' height='70' rx='35' fill='var(--surface)' stroke='var(--border)' stroke-width='1'/>
    <text x='640' y='515' text-anchor='middle' font-family='Inter,Noto Sans SC,sans-serif' font-size='16' font-weight='600' fill='var(--accent)'>天文科普 · 探索无止境</text>
  </g>
  <!-- notes: 结尾页——用"感谢聆听"和轨道环装饰收束。卡尔·萨根的"宇宙浩瀚"作为最后一句话留给观众回味。 -->
</svg>