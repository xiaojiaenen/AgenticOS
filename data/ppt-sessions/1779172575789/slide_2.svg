<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1280 720' data-theme='dramatic'>
  <defs>
    <linearGradient id='tocAccent' x1='0' y1='0' x2='1' y2='1'>
      <stop offset='0%' stop-color='var(--accent)' stop-opacity='0.15'/>
      <stop offset='100%' stop-color='var(--accent-2)' stop-opacity='0.05'/>
    </linearGradient>
  </defs>
  <!-- notes: 目录页——每个章节用大数字+斜杠分隔，营造电影章节的感觉，让观众对旅程充满期待 -->
  <g id='bg-layer'>
    <rect width='1280' height='720' fill='var(--bg)'/>
  </g>
  <g id='stars-decor'>
    <circle cx='60' cy='80' r='1.2' fill='var(--text-3)' fill-opacity='0.5'/>
    <circle cx='1220' cy='60' r='1.5' fill='var(--text-3)' fill-opacity='0.6'/>
    <circle cx='180' cy='600' r='1' fill='var(--text-3)' fill-opacity='0.4'/>
    <circle cx='1100' cy='550' r='1.3' fill='var(--text-3)' fill-opacity='0.5'/>
    <circle cx='50' cy='350' r='1' fill='var(--text-3)' fill-opacity='0.4'/>
    <circle cx='1230' cy='280' r='1.5' fill='var(--text-3)' fill-opacity='0.6'/>
  </g>
  <g id='page-header'>
    <text x='80' y='90' font-size='42' font-weight='900' fill='var(--text-1)' font-family='Inter,Noto Sans SC,sans-serif'>剧 目</text>
    <rect x='80' y='105' width='70' height='4' fill='var(--accent)'/>
    <text x='80' y='140' font-size='16' fill='var(--text-3)' font-family='Inter,Noto Sans SC,sans-serif' letter-spacing='4'>CHAPTERS</text>
  </g>
  <g id='toc-item-1'>
    <rect x='60' y='180' width='365' height='105' rx='14' fill='var(--surface)' stroke='var(--border)' stroke-width='0.5'/>
    <text x='95' y='230' font-size='42' font-weight='900' fill='var(--accent)' font-family='Inter,Noto Sans SC,sans-serif'>01</text>
    <text x='160' y='228' font-size='20' font-weight='bold' fill='var(--text-1)' font-family='Inter,Noto Sans SC,sans-serif'>太阳系大家庭</text>
    <text x='160' y='255' font-size='14' fill='var(--text-2)' font-family='Inter,Noto Sans SC,sans-serif'>从太阳出发 · 认识我们的恒星系统</text>
  </g>
  <g id='toc-item-2'>
    <rect x='455' y='180' width='365' height='105' rx='14' fill='var(--surface)' stroke='var(--border)' stroke-width='0.5'/>
    <text x='490' y='230' font-size='42' font-weight='900' fill='var(--accent)' font-family='Inter,Noto Sans SC,sans-serif'>02</text>
    <text x='555' y='228' font-size='20' font-weight='bold' fill='var(--text-1)' font-family='Inter,Noto Sans SC,sans-serif'>八大行星巡礼</text>
    <text x='555' y='255' font-size='14' fill='var(--text-2)' font-family='Inter,Noto Sans SC,sans-serif'>内行星 · 外行星 · 各具风采</text>
  </g>
  <g id='toc-item-3'>
    <rect x='850' y='180' width='365' height='105' rx='14' fill='var(--surface)' stroke='var(--border)' stroke-width='0.5'/>
    <text x='885' y='230' font-size='42' font-weight='900' fill='var(--accent)' font-family='Inter,Noto Sans SC,sans-serif'>03</text>
    <text x='950' y='228' font-size='20' font-weight='bold' fill='var(--text-1)' font-family='Inter,Noto Sans SC,sans-serif'>从九大到八大</text>
    <text x='950' y='255' font-size='14' fill='var(--text-2)' font-family='Inter,Noto Sans SC,sans-serif'>冥王星降级 · 矮行星诞生</text>
  </g>
  <g id='toc-item-4'>
    <rect x='60' y='315' width='365' height='105' rx='14' fill='var(--surface)' stroke='var(--border)' stroke-width='0.5'/>
    <text x='95' y='365' font-size='42' font-weight='900' fill='var(--accent)' font-family='Inter,Noto Sans SC,sans-serif'>04</text>
    <text x='160' y='363' font-size='20' font-weight='bold' fill='var(--text-1)' font-family='Inter,Noto Sans SC,sans-serif'>行星大比拼</text>
    <text x='160' y='390' font-size='14' fill='var(--text-2)' font-family='Inter,Noto Sans SC,sans-serif'>数据对比 · 谁最大？谁最快？</text>
  </g>
  <g id='toc-item-5'>
    <rect x='455' y='315' width='365' height='105' rx='14' fill='var(--surface)' stroke='var(--border)' stroke-width='0.5'/>
    <text x='490' y='365' font-size='42' font-weight='900' fill='var(--accent)' font-family='Inter,Noto Sans SC,sans-serif'>05</text>
    <text x='555' y='363' font-size='20' font-weight='bold' fill='var(--text-1)' font-family='Inter,Noto Sans SC,sans-serif'>探索与未来</text>
    <text x='555' y='390' font-size='14' fill='var(--text-2)' font-family='Inter,Noto Sans SC,sans-serif'>人类探索史 · 下一站星辰大海</text>
  </g>
  <g id='toc-divider'>
    <line x1='60' y1='450' x2='1215' y2='450' stroke='var(--accent)' stroke-opacity='0.08' stroke-width='1'/>
  </g>
  <g id='toc-quote'>
    <text x='640' y='510' font-size='18' fill='var(--text-2)' text-anchor='middle' font-family='Inter,Noto Sans SC,sans-serif' font-style='italic'>"宇宙最令人震撼的，不是它的浩瀚，而是我们竟然能够理解它。"</text>
    <text x='640' y='540' font-size='14' fill='var(--text-3)' text-anchor='middle' font-family='Inter,Noto Sans SC,sans-serif'>—— 卡尔·萨根</text>
  </g>
  <g id='footer' chrome='true'>
    <text x='640' y='690' font-size='14' fill='var(--text-3)' text-anchor='middle' font-family='Inter,Noto Sans SC,sans-serif'>2 / 12</text>
  </g>
</svg>