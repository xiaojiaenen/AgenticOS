<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1280 720' data-theme='duolingo'>
  <!-- notes: 游戏时间到！现在我们玩一个"看图猜动物"的游戏。老师展示图片，你们用英语说出动物名。答对的同学可以得一颗星星⭐！准备好了吗？Let's play! -->
  <rect width='1280' height='720' fill='var(--bg)'/>
  <rect x='0' y='0' width='1280' height='720' fill='var(--accent-3)' fill-opacity='0.05'/>
  <rect x='880' y='0' width='400' height='720' fill='var(--accent-3)' fill-opacity='0.06'/>
  <circle cx='1080' cy='360' r='150' fill='var(--accent-3)' fill-opacity='0.06'/>
  <circle cx='1080' cy='360' r='80' fill='var(--accent-3)' fill-opacity='0.08'/>
  <g id='section2-badge'>
    <rect x='80' y='80' width='100' height='36' rx='18' fill='var(--accent-3)' fill-opacity='0.15'/>
    <text x='130' y='104' text-anchor='middle' font-size='14' font-weight='700' fill='var(--accent-3)' font-family='Inter,Noto Sans SC,sans-serif'>PART 03</text>
  </g>
  <g id='section2-title' font-family='Inter,Noto Sans SC,sans-serif'>
    <text x='640' y='280' text-anchor='middle' font-size='56' font-weight='900' fill='var(--text-1)'>玩一玩</text>
    <text x='640' y='350' text-anchor='middle' font-size='28' font-weight='600' fill='var(--accent-3)'>Let's Play!</text>
    <text x='640' y='420' text-anchor='middle' font-size='18' fill='var(--text-2)'>看图猜动物 · 说出英语赢星星</text>
    <text x='640' y='455' text-anchor='middle' font-size='18' fill='var(--text-2)'>Guess the animal and win a star!</text>
  </g>
  <g id='section2-decor'>
    <text x='1080' y='330' text-anchor='middle' font-size='80'>🎮</text>
    <text x='180' y='520' font-size='42'>⭐</text>
    <text x='280' y='560' font-size='30'>🌟</text>
    <text x='1100' y='560' font-size='36'>🏆</text>
  </g>
  <g id='section2-footer' font-family='Inter,Noto Sans SC,sans-serif'>
    <text x='1200' y='690' text-anchor='end' font-size='13' fill='var(--text-3)'>7 / 10</text>
  </g>
</svg>