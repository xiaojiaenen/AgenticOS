<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1280 720' data-theme='duolingo'>
  <!-- notes: 开场——同学们好！今天我们要一起认识六位动物朋友。谁能告诉老师，你最喜欢什么动物？（等学生举手回答）好，那我们来看看今天要学的动物吧！ -->
  <rect width='1280' height='720' fill='var(--bg)'/>
  <rect x='0' y='0' width='1280' height='6' fill='var(--accent)'/>
  <!-- 装饰圆形 -->
  <circle cx='200' cy='180' r='120' fill='var(--accent)' fill-opacity='0.06'/>
  <circle cx='1080' cy='540' r='160' fill='var(--accent-2)' fill-opacity='0.05'/>
  <circle cx='100' cy='600' r='60' fill='var(--accent-3)' fill-opacity='0.06'/>
  <g id='cover-decor'>
    <!-- 小动物剪影装饰 -->
    <circle cx='180' cy='160' r='30' fill='var(--accent)' fill-opacity='0.12'/>
    <circle cx='1100' cy='520' r='40' fill='var(--accent-2)' fill-opacity='0.1'/>
    <circle cx='90' cy='580' r='20' fill='var(--accent-3)' fill-opacity='0.1'/>
  </g>
  <g id='cover-header' text-anchor='middle' font-family='Inter,Noto Sans SC,sans-serif'>
    <text x='640' y='170' font-size='20' fill='var(--accent)' font-weight='700' letter-spacing='3'>PRIMARY SCHOOL ENGLISH</text>
    <text x='640' y='220' font-size='16' fill='var(--text-3)' font-weight='500'>趣味英语课堂 · 三年级上册</text>
  </g>
  <g id='cover-title' text-anchor='middle' font-family='Inter,Noto Sans SC,sans-serif'>
    <text x='640' y='340' font-size='72' font-weight='900' fill='var(--text-1)' font-family='Inter,Noto Sans SC,sans-serif'>
      <tspan x='640' dy='0'>My Animal</tspan>
      <tspan x='640' dy='86' fill='var(--accent)'>Friends</tspan>
    </text>
    <text x='640' y='480' font-size='32' fill='var(--text-2)' font-weight='600'>我 的 动 物 朋 友</text>
  </g>
  <g id='cover-animals' font-family='Inter,Noto Sans SC,sans-serif'>
    <!-- 6个小动物 emoji 装饰 -->
    <text x='260' y='570' font-size='48' text-anchor='middle'>🐱</text>
    <text x='400' y='555' font-size='52' text-anchor='middle'>🐶</text>
    <text x='540' y='570' font-size='48' text-anchor='middle'>🐦</text>
    <text x='680' y='555' font-size='52' text-anchor='middle'>🐟</text>
    <text x='820' y='570' font-size='48' text-anchor='middle'>🐰</text>
    <text x='960' y='555' font-size='52' text-anchor='middle'>🐒</text>
  </g>
  <g id='cover-footer' font-family='Inter,Noto Sans SC,sans-serif'>
    <text x='80' y='690' font-size='13' fill='var(--text-3)'>English Class · 2025</text>
    <text x='1200' y='690' text-anchor='end' font-size='13' fill='var(--text-3)'>1 / 10</text>
  </g>
</svg>