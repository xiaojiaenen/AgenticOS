<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-theme="apple">
  <!-- notes: 章节分隔页——品牌实力章节开始，用超大数字01建立章节感 -->
  <g id="bg-layer">
    <rect width="1280" height="720" fill="var(--bg)"/>
  </g>
  <g id="section-number">
    <text x="200" y="350" font-size="180" font-weight="800" fill="var(--surface-2)" opacity="0.5">01</text>
  </g>
  <g id="section-title">
    <text x="200" y="420" font-size="64" font-weight="800" fill="var(--text-1)">品牌实力</text>
    <text x="200" y="470" font-size="22" fill="var(--text-3)">Brand Strength</text>
  </g>
  <g id="section-desc">
    <text x="200" y="530" font-size="18" fill="var(--text-2)">连续28年空调销量领先 · 行业标杆</text>
  </g>
  <g id="footer-pagenum">
    <text x="1220" y="690" font-size="14" fill="var(--text-3)" text-anchor="end">03 / 10</text>
  </g>
</svg>