<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1280 720' data-theme='neon'>
  <defs>
    <linearGradient id='lineNeon' x1='0' y1='0' x2='0' y2='1'>
      <stop offset='0%' stop-color='var(--accent)'/>
      <stop offset='50%' stop-color='var(--accent-2)'/>
      <stop offset='100%' stop-color='var(--accent)'/>
    </linearGradient>
    <filter id='glowDot7' x='-50%' y='-50%' width='200%' height='200%'>
      <feGaussianBlur in='SourceGraphic' stdDeviation='4'/>
    </filter>
  </defs>
  <g id='bg-layer'>
    <rect width='1280' height='720' fill='var(--bg)'/>
    <line x1='0' y1='360' x2='1280' y2='360' stroke='var(--accent)' stroke-opacity='0.03' stroke-width='1'/>
    <circle cx='0' cy='720' r='350' fill='var(--accent)' fill-opacity='0.03'/>
  </g>
  <g id='decor-dots'>
    <circle cx='200' cy='80' r='2' fill='var(--accent)' fill-opacity='0.2' filter='url(#glowDot7)'/>
    <circle cx='1100' cy='100' r='1.5' fill='var(--accent-2)' fill-opacity='0.2'/>
  </g>
  <g id='page-header'>
    <text x='80' y='80' font-size='13' fill='var(--text-3)' font-family='Inter,Noto Sans SC,sans-serif' letter-spacing='3'>活动日程</text>
    <rect x='80' y='95' width='40' height='2' rx='1' fill='var(--accent)'/>
  </g>
  <g id='section-title'>
    <text x='80' y='165' font-size='38' font-weight='800' fill='var(--text-1)' font-family='Inter,Noto Sans SC,sans-serif'>
      三日狂欢日程
    </text>
    <text x='80' y='200' font-size='15' fill='var(--text-2)' font-family='Inter,Noto Sans SC,sans-serif'>三天三主题，天天都有重头戏</text>
  </g>
  <!-- 时间轴 -->
  <g id='timeline' font-family='Inter,Noto Sans SC,sans-serif'>
    <line x1='120' y1='260' x2='120' y2='660' stroke='url(#lineNeon)' stroke-width='2' stroke-opacity='0.3' stroke-linecap='round'/>
    
    <!-- Day 1 -->
    <circle cx='120' cy='300' r='10' fill='var(--bg)' stroke='var(--accent)' stroke-width='2.5'/>
    <circle cx='120' cy='300' r='4' fill='var(--accent)' filter='url(#glowDot7)'/>
    <text x='155' y='300' font-size='20' font-weight='700' fill='var(--text-1)'>8月15日 · 经典日</text>
    <text x='155' y='328' font-size='13' fill='var(--text-2)'>09:00 开幕仪式 · 主舞台</text>
    <text x='155' y='352' font-size='13' fill='var(--text-2)'>10:30 宫崎骏动画回顾展 · 吉卜力区</text>
    <text x='155' y='376' font-size='13' fill='var(--text-2)'>14:00 《龙猫》主题交响音乐会 · 演艺厅</text>
    <text x='155' y='400' font-size='13' fill='var(--text-2)'>19:00 经典动画放映夜 · 露天影院</text>

    <!-- Day 2 -->
    <circle cx='120' cy='450' r='10' fill='var(--bg)' stroke='var(--accent-2)' stroke-width='2.5'/>
    <circle cx='120' cy='450' r='4' fill='var(--accent-2)' filter='url(#glowDot7)'/>
    <text x='155' y='450' font-size='20' font-weight='700' fill='var(--text-1)'>8月16日 · 潮流日</text>
    <text x='155' y='478' font-size='13' fill='var(--text-2)'>10:00 Cosplay 大赛海选 · 新浪潮舞台</text>
    <text x='155' y='502' font-size='13' fill='var(--text-2)'>13:00 人气声优见面会 · 主舞台</text>
    <text x='155' y='526' font-size='13' fill='var(--text-2)'>15:30 同人画师签售会 · 创作交流区</text>
    <text x='155' y='550' font-size='13' fill='var(--text-2)'>20:00 动漫电音派对 · 户外广场</text>

    <!-- Day 3 -->
    <circle cx='120' cy='600' r='10' fill='var(--bg)' stroke='var(--accent)' stroke-width='2.5' stroke-opacity='0.6'/>
    <circle cx='120' cy='600' r='4' fill='var(--accent)' fill-opacity='0.6'/>
    <text x='155' y='600' font-size='20' font-weight='700' fill='var(--text-1)'>8月17日 · 创作日</text>
    <text x='155' y='628' font-size='13' fill='var(--text-2)'>10:00 动画制作公开课 · 工作坊区</text>
    <text x='155' y='652' font-size='13' fill='var(--text-2)'>14:00 原创 IP 路演决赛 · 主舞台</text>
    <text x='155' y='676' font-size='13' fill='var(--text-2)'>17:00 闭幕颁奖典礼 · 主舞台</text>
    
    <!-- 右侧亮点 -->
    <g transform='translate(800, 260)'>
      <rect width='400' height='410' rx='12' fill='var(--surface)' stroke='var(--border)' stroke-width='1'/>
      <rect x='0' y='0' width='400' height='3' rx='1.5' fill='var(--accent)'/>
      <text x='25' y='40' font-size='16' font-weight='700' fill='var(--text-1)'>🌟 每日亮点</text>
      <line x1='25' y1='55' x2='375' y2='55' stroke='var(--border)' stroke-width='1'/>
      <text x='25' y='85' font-size='13' fill='var(--accent)' font-weight='700'>Day 1 经典日</text>
      <text x='25' y='108' font-size='13' fill='var(--text-2)'>《龙猫》交响音乐会 · 限量版海报赠送</text>
      <text x='25' y='145' font-size='13' fill='var(--accent-2)' font-weight='700'>Day 2 潮流日</text>
      <text x='25' y='168' font-size='13' fill='var(--text-2)'>Cosplay 大赛冠军<tspan font-weight='bold'>奖金 3 万元</tspan></text>
      <text x='25' y='205' font-size='13' fill='var(--accent)' fill-opacity='0.6' font-weight='700'>Day 3 创作日</text>
      <text x='25' y='228' font-size='13' fill='var(--text-2)'>得奖 IP 可获投资孵化机会</text>
      <line x1='25' y1='260' x2='375' y2='260' stroke='var(--border)' stroke-width='1' stroke-dasharray='4,4'/>
      <text x='25' y='295' font-size='15' font-weight='600' fill='var(--text-1)'>通票福利</text>
      <line x1='25' y1='312' x2='375' y2='312' stroke='var(--border)' stroke-width='1'/>
      <text x='25' y='340' font-size='13' fill='var(--text-2)'>🎫 三日通票含全部主题活动</text>
      <text x='25' y='368' font-size='13' fill='var(--text-2)'>🎁 限量版纪念周边礼包</text>
    </g>
  </g>
  <g id='footer' font-family='Inter,Noto Sans SC,sans-serif'>
    <text x='1240' y='690' font-size='12' fill='var(--text-3)' text-anchor='end'>07 / 11</text>
  </g>
  <!-- notes: 日程页——"三天安排，经典日、潮流日、创作日，每天一个主题。" -->
</svg>