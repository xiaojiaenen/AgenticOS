<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1280 720' data-theme='neon'>
  <defs>
    <linearGradient id='neonGlow' x1='0' y1='0' x2='1' y2='0'>
      <stop offset='0%' stop-color='var(--accent)'/>
      <stop offset='50%' stop-color='var(--accent-2)'/>
      <stop offset='100%' stop-color='var(--accent)'/>
    </linearGradient>
    <filter id='neonGlow' x='-40%' y='-40%' width='180%' height='180%'>
      <feGaussianBlur in='SourceGraphic' stdDeviation='6'/>
    </filter>
    <filter id='strongGlow' x='-50%' y='-50%' width='200%' height='200%'>
      <feGaussianBlur in='SourceGraphic' stdDeviation='12'/>
    </filter>
  </defs>
  <g id='bg-layer'>
    <rect width='1280' height='720' fill='var(--bg)'/>
    <!-- 霓虹网格背景 -->
    <line x1='0' y1='180' x2='1280' y2='180' stroke='var(--accent)' stroke-opacity='0.04' stroke-width='1'/>
    <line x1='0' y1='360' x2='1280' y2='360' stroke='var(--accent)' stroke-opacity='0.04' stroke-width='1'/>
    <line x1='0' y1='540' x2='1280' y2='540' stroke='var(--accent)' stroke-opacity='0.04' stroke-width='1'/>
    <line x1='320' y1='0' x2='320' y2='720' stroke='var(--accent-2)' stroke-opacity='0.04' stroke-width='1'/>
    <line x1='640' y1='0' x2='640' y2='720' stroke='var(--accent-2)' stroke-opacity='0.04' stroke-width='1'/>
    <line x1='960' y1='0' x2='960' y2='720' stroke='var(--accent-2)' stroke-opacity='0.04' stroke-width='1'/>
  </g>
  <!-- 霓虹光晕圈 -->
  <g id='decor-neon'>
    <circle cx='640' cy='320' r='250' fill='none' stroke='var(--accent)' stroke-opacity='0.06' stroke-width='2'/>
    <circle cx='640' cy='320' r='200' fill='none' stroke='var(--accent-2)' stroke-opacity='0.04' stroke-width='1' stroke-dasharray='4,8'/>
    <!-- 发光粒子 -->
    <circle cx='180' cy='150' r='3' fill='var(--accent)' fill-opacity='0.3' filter='url(#neonGlow)'/>
    <circle cx='1100' cy='200' r='2.5' fill='var(--accent-2)' fill-opacity='0.3' filter='url(#neonGlow)'/>
    <circle cx='200' cy='500' r='2' fill='var(--accent)' fill-opacity='0.2' filter='url(#neonGlow)'/>
    <circle cx='1050' cy='480' r='3' fill='var(--accent-2)' fill-opacity='0.25' filter='url(#neonGlow)'/>
    <circle cx='400' cy='100' r='2' fill='var(--accent)' fill-opacity='0.2'/>
    <circle cx='900' cy='550' r='2' fill='var(--accent-2)' fill-opacity='0.2'/>
  </g>
  <!-- 主标题 -->
  <g id='cover-main' text-anchor='middle' font-family='Inter,Noto Sans SC,sans-serif'>
    <text x='640' y='220' font-size='15' fill='var(--accent)' font-weight='600' letter-spacing='8'>SUMMER ANIME FESTIVAL 2025</text>
    <text x='640' y='320' font-size='80' font-weight='900' fill='var(--text-1)' letter-spacing='6' filter='url(#strongGlow)'>
      夏日动漫嘉年华
    </text>
    <!-- 霓虹装饰线 -->
    <rect x='540' y='350' width='200' height='2' rx='1' fill='url(#neonGlow)'/>
    <rect x='540' y='353' width='200' height='2' rx='1' fill='var(--accent)' fill-opacity='0.3' filter='url(#neonGlow)'/>
    <text x='640' y='415' font-size='20' fill='var(--text-2)' font-weight='300' letter-spacing='4'>
      宫崎骏主题特展 · 二次元文化盛会
    </text>
    <text x='640' y='465' font-size='14' fill='var(--text-3)' letter-spacing='2'>2025.08.15 — 08.17 · 国家会展中心</text>
    <!-- 霓虹按钮 -->
    <rect x='580' y='500' width='120' height='38' rx='19' fill='none' stroke='var(--accent)' stroke-width='1.5'/>
    <rect x='580' y='500' width='120' height='38' rx='19' fill='var(--accent)' fill-opacity='0.08'/>
    <text x='640' y='525' font-size='13' fill='var(--accent)' font-weight='600'>立即购票</text>
  </g>
  <!-- 底部霓虹线 -->
  <g id='decor-bottom'>
    <rect x='0' y='710' width='1280' height='1' fill='var(--accent)' fill-opacity='0.15'/>
    <rect x='0' y='712' width='1280' height='1' fill='var(--accent-2)' fill-opacity='0.08'/>
  </g>
  <g id='footer' text-anchor='end' font-family='Inter,Noto Sans SC,sans-serif'>
    <text x='1240' y='690' font-size='12' fill='var(--text-3)'>01 / 11</text>
  </g>
  <!-- notes: 封面——霓虹开场，灯光暗下来，正文案从屏幕中间浮现。先念标题，停顿，再念日期。 -->
</svg>