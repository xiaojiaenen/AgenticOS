  <g id='bg-layer'>
    <rect width='1280' height='720' fill='var(--bg)'/>
  </g>
  <g id='section-number' text-anchor='middle' font-family='Inter,Noto Sans SC,sans-serif'>
    <text x='640' y='340' font-size='200' font-weight='900' fill='var(--accent)' fill-opacity='0.08'>03</text>
    <text x='640' y='320' font-size='18' fill='var(--accent)' font-weight='600' letter-spacing='6'>CHAPTER THREE</text>
