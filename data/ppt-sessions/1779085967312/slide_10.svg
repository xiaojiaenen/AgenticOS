    <line x1='540' y1='480' x2='740' y2='480' stroke='var(--accent)' stroke-width='2'/>
    <text x='640' y='530' font-size='20' fill='var(--text-2)'>从战略规划到组织变革，构建企业 AI 核心能力</text>
