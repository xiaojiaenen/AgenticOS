  <g id='bg-layer'>
    <rect width='1280' height='720' fill='var(--bg)'/>
  </g>
  <g id='section-number' text-anchor='middle' font-family='Inter,Noto Sans SC,sans-serif'>
    <text x='640' y='340' font-size='200' font-weight='900' fill='var(--accent)' fill-opacity='0.08'>02</text>
    <text x='640' y='320' font-size='18' fill='var(--accent)' font-weight='600' letter-spacing='6'>CHAPTER TWO</text>
    <text x='640' y='430' font-size='56' font-weight='800' fill='var(--text-1)'>
      <tspan x='640' dy='0'>应用场景</tspan>
    </text>
    <line x1='540' y1='480' x2='740' y2='480' stroke='var(--accent)' stroke-width='2'/>
    <text x='640' y='530' font-size='20' fill='var(--text-2)'>从对话助手到行业智能体，大模型正在重塑每一个行业</text>
