<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1280 720' data-theme='openai'>
  <g id='bg-layer'>
    <rect width='1280' height='720' fill='var(--bg)'/>
  </g>
  <g id='page-header' font-family='Inter,Noto Sans SC,sans-serif'>
    <text x='80' y='100' font-size='36' font-weight='800' fill='var(--text-1)'>企业 AI 落地路线图</text>
    <text x='80' y='140' font-size='18' fill='var(--text-2)'>Roadmap: 4 Phases to AI Maturity</text>
    <line x1='80' y1='162' x2='280' y2='162' stroke='var(--accent)' stroke-width='3'/>
  </g>
  <g id='timeline' font-family='Inter,Noto Sans SC,sans-serif'>
    <!-- 时间轴线 -->
    <line x1='120' y1='360' x2='1160' y2='360' stroke='var(--border)' stroke-width='2'/>
    <!-- 阶段1 -->
    <circle cx='240' cy='360' r='18' fill='var(--accent)' stroke='var(--bg)' stroke-width='4'/>
    <rect x='140' y='210' width='200' height='110' rx='14' fill='var(--surface)' stroke='var(--border)' stroke-width='1'/>
    <text x='240' y='255' font-size='20' font-weight='bold' text-anchor='middle' fill='var(--text-1)'>Phase 1</text>
    <text x='240' y='285' font-size='14' text-anchor='middle' fill='var(--accent)' font-weight='600'>试点验证</text>
    <text x='240' y='310' font-size='13' text-anchor='middle' fill='var(--text-2)'>1-3 个月</text>
    <text x='240' y='420' font-size='14' text-anchor='middle' fill='var(--text-3)'>选场景·测效果</text>

    <!-- 阶段2 -->
    <circle cx='500' cy='360' r='18' fill='var(--surface)' stroke='var(--accent)' stroke-width='3'/>
    <rect x='400' y='210' width='200' height='110' rx='14' fill='var(--surface)' stroke='var(--border)' stroke-width='1'/>
    <text x='500' y='255' font-size='20' font-weight='bold' text-anchor='middle' fill='var(--text-1)'>Phase 2</text>
    <text x='500' y='285' font-size='14' text-anchor='middle' fill='var(--accent)' font-weight='600'>规模化落地</text>
    <text x='500' y='310' font-size='13' text-anchor='middle' fill='var(--text-2)'>3-6 个月</text>
    <text x='500' y='420' font-size='14' text-anchor='middle' fill='var(--text-3)'>建平台·扩覆盖</text>

    <!-- 阶段3 -->
    <circle cx='760' cy='360' r='18' fill='var(--surface)' stroke='var(--accent)' stroke-width='3'/>
    <rect x='660' y='210' width='200' height='110' rx='14' fill='var(--surface)' stroke='var(--border)' stroke-width='1'/>
    <text x='760' y='255' font-size='20' font-weight='bold' text-anchor='middle' fill='var(--text-1)'>Phase 3</text>
    <text x='760' y='285' font-size='14' text-anchor='middle' fill='var(--accent)' font-weight='600'>能力内化</text>
    <text x='760' y='310' font-size='13' text-anchor='middle' fill='var(--text-2)'>6-12 个月</text>
    <text x='760' y='420' font-size='14' text-anchor='middle' fill='var(--text-3)'>训模型·建壁垒</text>

    <!-- 阶段4 -->
    <circle cx='1020' cy='360' r='18' fill='var(--surface)' stroke='var(--accent)' stroke-width='3'/>
    <rect x='920' y='210' width='200' height='110' rx='14' fill='var(--surface)' stroke='var(--border)' stroke-width='1'/>
    <text x='1020' y='255' font-size='20' font-weight='bold' text-anchor='middle' fill='var(--text-1)'>Phase 4</text>
    <text x='1020' y='285' font-size='14' text-anchor='middle' fill='var(--accent)' font-weight='600'>AI 原生</text>
    <text x='1020' y='310' font-size='13' text-anchor='middle' fill='var(--text-2)'>12-18 个月</text>
    <text x='1020' y='420' font-size='14' text-anchor='middle' fill='var(--text-3)'>重构业务·创新</text>

    <!-- 连接箭头 -->
    <polygon points='370,354 390,360 370,366' fill='var(--border)'/>
    <polygon points='630,354 650,360 630,366' fill='var(--border)'/>
    <polygon points='890,354 910,360 890,366' fill='var(--border)'/>
  </g>
  <g id='bottom-summary' font-family='Inter,Noto Sans SC,sans-serif'>
    <rect x='300' y='510' width='680' height='50' rx='25' fill='var(--accent)' fill-opacity='0.08'/>
    <text x='640' y='541' font-size='15' text-anchor='middle' fill='var(--accent)'>💡 建议：6 个月内完成 Phase 1-2，12 个月内启动 Phase 3</text>
  </g>
  <!-- notes: 四阶段路线图，从试点到AI原生。核心建议：不要贪大求全，先在一个场景跑通。每阶段都标了时间建议。演讲节奏：用手指着从左到右依次讲解，最后落在建议时间线上 -->
</svg>