<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-theme="airbnb">
  <g id="bg-layer">
    <rect width="1280" height="720" fill="var(--bg)"/>
  </g>
  <g id="section-decoration">
    <rect x="0" y="280" width="1280" height="160" fill="var(--accent)" fill-opacity="0.08"/>
    <circle cx="200" cy="600" r="180" fill="var(--accent)" fill-opacity="0.04"/>
    <circle cx="1080" cy="120" r="140" fill="var(--accent)" fill-opacity="0.04"/>
  </g>
  <g id="section-number" text-anchor="middle" font-family="Inter,Noto Sans SC,sans-serif">
    <text x="640" y="300" font-size="180" font-weight="900" fill="var(--accent)" fill-opacity="0.15">01</text>
  </g>
  <g id="section-title" text-anchor="middle" font-family="Inter,Noto Sans SC,sans-serif">
    <rect x="540" y="360" width="200" height="3" rx="1.5" fill="var(--accent)"/>
    <text x="640" y="430" font-size="16" fill="var(--accent)" font-weight="600" letter-spacing="4">CHAPTER ONE</text>
    <text x="640" y="500" font-size="56" font-weight="800" fill="var(--text-1)">我们的回忆</text>
    <text x="640" y="560" font-size="20" fill="var(--text-2)">每一段时光都值得被铭记</text>
  </g>
  <!-- notes: 章节分隔页——第一章「我们的回忆」，用大号数字营造视觉冲击 -->
</svg>