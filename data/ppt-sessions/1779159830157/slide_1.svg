<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-theme="airbnb">
  <g id="bg-layer">
    <rect width="1280" height="720" fill="var(--bg)"/>
    <rect x="0" y="0" width="1280" height="6" fill="var(--accent)"/>
  </g>
  <!-- 装饰性圆点/彩带 -->
  <g id="decoration-confetti">
    <circle cx="120" cy="100" r="6" fill="var(--accent)" fill-opacity="0.6"/>
    <circle cx="280" cy="60" r="4" fill="var(--accent)" fill-opacity="0.4"/>
    <circle cx="1000" cy="90" r="8" fill="var(--accent)" fill-opacity="0.3"/>
    <circle cx="1150" cy="150" r="5" fill="var(--accent)" fill-opacity="0.5"/>
    <circle cx="80" cy="600" r="7" fill="var(--accent)" fill-opacity="0.4"/>
    <circle cx="1180" cy="550" r="6" fill="var(--accent)" fill-opacity="0.5"/>
    <circle cx="200" cy="650" r="4" fill="var(--accent)" fill-opacity="0.3"/>
    <circle cx="1100" cy="650" r="5" fill="var(--accent)" fill-opacity="0.4"/>
  </g>
  <!-- 装饰性星星 -->
  <g id="decoration-stars" text-anchor="middle" font-size="24" fill="var(--accent)" fill-opacity="0.5">
    <text x="150" y="140">✦</text>
    <text x="1130" y="120">✦</text>
    <text x="80" y="350">✦</text>
    <text x="1200" y="380">✦</text>
  </g>
  <g id="cover-header" text-anchor="middle" font-family="Inter,Noto Sans SC,sans-serif">
    <text x="640" y="160" font-size="20" fill="var(--accent)" font-weight="600" letter-spacing="4">HAPPY BIRTHDAY</text>
  </g>
  <g id="cover-title" text-anchor="middle" font-family="Inter,Noto Sans SC,sans-serif">
    <text x="640" y="280" font-size="76" font-weight="800" fill="var(--text-1)">
      <tspan x="640" dy="0">🎂 生日快乐</tspan>
    </text>
    <text x="640" y="380" font-size="32" fill="var(--text-2)" font-weight="400">愿你眼里是阳光，笑里是坦荡</text>
    <text x="640" y="430" font-size="22" fill="var(--text-3)" font-weight="300">愿每一岁都奔走在自己的热爱里</text>
  </g>
  <g id="cover-footer" text-anchor="middle" font-family="Inter,Noto Sans SC,sans-serif">
    <rect x="540" y="520" width="200" height="50" rx="25" fill="var(--accent)"/>
    <text x="640" y="552" font-size="18" fill="#ffffff" font-weight="600">邀请你一起庆祝</text>
    <text x="640" y="640" font-size="16" fill="var(--text-3)">2025 · 美好时光</text>
  </g>
  <!-- notes: 封面——大气简洁的生日快乐主题，暖色点缀传递温暖氛围 -->
</svg>