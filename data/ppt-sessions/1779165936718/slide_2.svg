<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1280 720' data-theme='stripe'>
  <!-- notes: 目录页——用编号列出三个章节，让观众对整场演讲有清晰预期 -->
  <g id="bg-layer">
    <rect width='1280' height='720' fill='var(--bg)'/>
  </g>
  <g id="page-header">
    <text x='100' y='100' font-size='14' fill='var(--accent)' font-weight='600' letter-spacing='3'>AGENDA</text>
    <text x='100' y='150' font-size='44' font-weight='700' fill='var(--text-1)'>目录</text>
    <rect x='100' y='172' width='60' height='4' rx='2' fill='var(--accent)'/>
  </g>
  <g id="toc-list">
    <rect x='100' y='240' width='340' height='100' rx='12' fill='var(--surface)'/>
    <text x='130' y='280' font-size='36' font-weight='700' fill='var(--accent)' font-family='Inter,Noto Sans SC,sans-serif'>01</text>
    <text x='130' y='316' font-size='22' font-weight='600' fill='var(--text-1)'>认识 DeepSeek</text>
    <text x='280' y='316' font-size='16' fill='var(--text-3)'>背景 · 发展历程</text>

    <rect x='470' y='240' width='340' height='100' rx='12' fill='var(--surface)'/>
    <text x='500' y='280' font-size='36' font-weight='700' fill='var(--accent)' font-family='Inter,Noto Sans SC,sans-serif'>02</text>
    <text x='500' y='316' font-size='22' font-weight='600' fill='var(--text-1)'>核心能力</text>
    <text x='650' y='316' font-size='16' fill='var(--text-3)'>数据 · 特色 · 使用</text>

    <rect x='840' y='240' width='340' height='100' rx='12' fill='var(--surface)'/>
    <text x='870' y='280' font-size='36' font-weight='700' fill='var(--accent)' font-family='Inter,Noto Sans SC,sans-serif'>03</text>
    <text x='870' y='316' font-size='22' font-weight='600' fill='var(--text-1)'>未来方向</text>
    <text x='1020' y='316' font-size='16' fill='var(--text-3)'>愿景 · 行动号召</text>
  </g>
  <g id="toc-detail-items">
    <circle cx='130' cy='420' r='5' fill='var(--accent)'/>
    <text x='150' y='426' font-size='18' fill='var(--text-2)'>从深度求索实验室到开源社区</text>
    <circle cx='130' cy='470' r='5' fill='var(--accent)'/>
    <text x='150' y='476' font-size='18' fill='var(--text-2)'>MoE 架构引领行业变革</text>
    <circle cx='130' cy='520' r='5' fill='var(--accent)'/>
    <text x='150' y='526' font-size='18' fill='var(--text-2)'>数学推理到代码生成的全能表现</text>
    <circle cx='130' cy='570' r='5' fill='var(--accent)'/>
    <text x='150' y='576' font-size='18' fill='var(--text-2)'>让 AI 真正普惠每个人</text>
  </g>
  <g id="footer">
    <rect x='100' y='660' width='1080' height='1' fill='var(--border)'/>
    <text x='100' y='690' font-size='14' fill='var(--text-3)'>02 / 11 · 目录</text>
  </g>
</svg>