<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Noto+Sans+SC:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1920px; height: 1080px;
  overflow: hidden;
  background: #EFEAE0;
  font-family: 'Manrope', 'Noto Sans SC', sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  padding: 80px 120px;
}
.bg-wash {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: radial-gradient(ellipse at 50% 40%, rgba(122,158,127,0.08) 0%, transparent 70%);
  pointer-events: none;
}
.eyebrow {
  font-size: 16px;
  font-weight: 600;
  color: #7A9E7F;
  letter-spacing: 5px;
  text-transform: uppercase;
  margin-bottom: 12px;
  opacity: 0;
  transform: translateY(12px);
  position: relative;
  z-index: 2;
}
.section-title {
  font-size: 52px;
  font-weight: 700;
  color: #2C2A24;
  margin-bottom: 50px;
  opacity: 0;
  transform: translateY(12px);
  position: relative;
  z-index: 2;
}
.section-title .accent { color: #C98A5E; }

/* App grid */
.app-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 30px;
  max-width: 1500px;
  width: 100%;
  position: relative;
  z-index: 2;
}
.app-card {
  background: rgba(255,253,248,0.66);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border-radius: 32px;
  padding: 36px 28px;
  text-align: center;
  box-shadow: 0 8px 30px rgba(0,0,0,0.03);
  border: 1px solid rgba(255,253,248,0.4);
  opacity: 0;
  transform: translateY(30px);
}
.app-icon {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  margin: 0 auto 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
}
.app-icon-1 { background: rgba(201,138,94,0.15); color: #C98A5E; }
.app-icon-2 { background: rgba(122,158,127,0.15); color: #7A9E7F; }
.app-icon-3 { background: rgba(184,201,186,0.25); color: #5A7A5F; }
.app-icon-4 { background: rgba(201,138,94,0.12); color: #C98A5E; }
.app-card-title {
  font-size: 22px;
  font-weight: 700;
  color: #2C2A24;
  margin-bottom: 8px;
}
.app-desc {
  font-size: 16px;
  color: #8A867C;
  line-height: 1.6;
  font-weight: 400;
}

/* Decorative */
.deco { 
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
}
.deco-a { width: 80px; height: 80px; background: rgba(184,201,186,0.1); top: 12%; right: 10%; }
.deco-b { width: 50px; height: 50px; background: rgba(201,138,94,0.07); bottom: 10%; left: 8%; }
</style>
</head>
<body>
<div class="bg-wash"></div>
<div class="deco deco-a"></div>
<div class="deco deco-b"></div>

<div class="eyebrow">Applications</div>
<h2 class="section-title"><span class="accent">应用场景</span> 覆盖千行百业</h2>

<div class="app-grid">
  <div class="app-card">
    <div class="app-icon app-icon-1">💬</div>
    <div class="app-card-title">智能客服</div>
    <div class="app-desc">7×24 小时<br>多语言精准服务</div>
  </div>
  <div class="app-card">
    <div class="app-icon app-icon-2">🏥</div>
    <div class="app-card-title">医疗健康</div>
    <div class="app-desc">辅助诊断<br>药物研发加速</div>
  </div>
  <div class="app-card">
    <div class="app-icon app-icon-3">🎓</div>
    <div class="app-card-title">教育学习</div>
    <div class="app-desc">个性化辅导<br>知识图谱构建</div>
  </div>
  <div class="app-card">
    <div class="app-icon app-icon-4">🎨</div>
    <div class="app-card-title">内容创作</div>
    <div class="app-desc">AI 写作绘画<br>视频音乐生成</div>
  </div>
</div>

<script>
const tl = gsap.timeline({ defaults: { ease: 'power3.out' } });

tl.to('.eyebrow', { opacity: 1, y: 0, duration: 0.5 })
  .to('.section-title', { opacity: 1, y: 0, duration: 0.6 }, '-=0.2')
  .to('.app-card', { opacity: 1, y: 0, duration: 0.6, stagger: 0.12, ease: 'back.out(1.5)' }, '-=0.2')
  .to('.deco-a', { scale: 1.15, opacity: 0.2, duration: 3, ease: 'sine.inOut' }, '-=0.5')
  .to('.deco-b', { scale: 0.85, opacity: 0.12, duration: 3.5, ease: 'sine.inOut' }, '-=1');
</script>
</body>
</html>
