<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Noto+Sans+SC:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1920px; height: 1080px;
  overflow: hidden;
  background: #EFEAE0;
  font-family: 'Manrope', 'Noto Sans SC', sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
}
.bg-wash {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: radial-gradient(ellipse at 50% 50%, rgba(122,158,127,0.10) 0%, transparent 70%);
  pointer-events: none;
}

/* Decorative ring */
.ring-container {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 500px;
  height: 500px;
  z-index: 1;
}
.ring {
  position: absolute;
  top: 50%; left: 50%;
  border-radius: 50%;
  border: 2px solid #B8C9BA;
  transform: translate(-50%, -50%);
}
.ring-1 { width: 360px; height: 360px; opacity: 0; }
.ring-2 { width: 280px; height: 280px; border-color: rgba(184,201,186,0.4); opacity: 0; }
.ring-3 { width: 200px; height: 200px; border-color: rgba(201,138,94,0.2); opacity: 0; }
.ring-dot {
  position: absolute;
  width: 12px; height: 12px;
  border-radius: 50%;
  background: #C98A5E;
  opacity: 0.6;
}

/* Content */
.content {
  position: relative;
  z-index: 2;
  text-align: center;
}
.eyebrow {
  font-size: 16px;
  font-weight: 600;
  color: #7A9E7F;
  letter-spacing: 5px;
  text-transform: uppercase;
  margin-bottom: 16px;
  opacity: 0;
  transform: translateY(15px);
}
.title {
  font-size: 80px;
  font-weight: 800;
  color: #2C2A24;
  line-height: 1.1;
  opacity: 0;
  transform: translateY(15px);
}
.title .accent { color: #C98A5E; }
.sub {
  margin-top: 24px;
  font-size: 24px;
  font-weight: 400;
  color: #8A867C;
  opacity: 0;
  transform: translateY(15px);
}
.tagline {
  margin-top: 50px;
  font-size: 18px;
  font-weight: 600;
  color: #7A9E7F;
  letter-spacing: 3px;
  text-transform: uppercase;
  opacity: 0;
}

/* Small floating particles */
.particle {
  position: absolute;
  border-radius: 50%;
  background: #B8C9BA;
  pointer-events: none;
}
.p-1 { width: 8px; height: 8px; top: 30%; left: 25%; opacity: 0; }
.p-2 { width: 5px; height: 5px; top: 60%; left: 20%; opacity: 0; }
.p-3 { width: 6px; height: 6px; top: 25%; right: 30%; opacity: 0; }
.p-4 { width: 10px; height: 10px; bottom: 35%; right: 22%; opacity: 0; }
.p-5 { width: 4px; height: 4px; bottom: 40%; left: 70%; opacity: 0; }
</style>
</head>
<body>
<div class="bg-wash"></div>

<div class="ring-container">
  <div class="ring ring-1"></div>
  <div class="ring ring-2"></div>
  <div class="ring ring-3"></div>
</div>

<div class="particle p-1"></div>
<div class="particle p-2"></div>
<div class="particle p-3"></div>
<div class="particle p-4"></div>
<div class="particle p-5"></div>

<div class="content">
  <div class="eyebrow">The Future</div>
  <h1 class="title"><span class="accent">未来</span> 已来</h1>
  <p class="sub">AI 大模型正在重塑世界 · 让我们拥抱智能新时代</p>
  <div class="tagline">— 感谢观看 —</div>
</div>

<script>
const tl = gsap.timeline({ defaults: { ease: 'power3.out' } });

// Rings expand
tl.to('.ring-1', { opacity: 0.2, scale: 1, duration: 1.2, ease: 'power2.out' })
  .to('.ring-2', { opacity: 0.15, scale: 1, duration: 1.0, ease: 'power2.out' }, '-=0.8')
  .to('.ring-3', { opacity: 0.1, scale: 1, duration: 0.8, ease: 'power2.out' }, '-=0.6')

// Particles
  .to('.p-1', { opacity: 0.4, y: -20, x: 10, duration: 1.5, ease: 'sine.out' }, '-=1')
  .to('.p-2', { opacity: 0.3, y: -15, x: -8, duration: 1.8, ease: 'sine.out' }, '-=1.2')
  .to('.p-3', { opacity: 0.35, y: -18, x: 12, duration: 1.6, ease: 'sine.out' }, '-=1.3')
  .to('.p-4', { opacity: 0.3, y: -12, x: -10, duration: 1.4, ease: 'sine.out' }, '-=1.1')
  .to('.p-5', { opacity: 0.25, y: -22, x: 15, duration: 1.7, ease: 'sine.out' }, '-=1.4')

// Text
  .to('.eyebrow', { opacity: 1, y: 0, duration: 0.5 }, '-=0.8')
  .to('.title', { opacity: 1, y: 0, duration: 0.7 }, '-=0.3')
  .to('.sub', { opacity: 1, y: 0, duration: 0.6 }, '-=0.3')
  .to('.tagline', { opacity: 1, y: 0, duration: 0.5 }, '-=0.2')

// Ring slow rotation + particles float
  .to('.ring-1', { rotation: 15, duration: 4, ease: 'sine.inOut' }, '-=0.5')
  .to('.ring-2', { rotation: -10, duration: 5, ease: 'sine.inOut' }, '-=1')
  .to('.p-1', { y: -30, x: 15, opacity: 0.1, duration: 3, ease: 'sine.inOut', yoyo: true, repeat: -1 }, '-=2')
  .to('.p-3', { y: -25, x: -18, opacity: 0.15, duration: 3.5, ease: 'sine.inOut', yoyo: true, repeat: -1 }, '-=3');
</script>
</body>
</html>
