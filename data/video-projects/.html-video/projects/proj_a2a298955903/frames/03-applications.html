<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>应用场景</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      width: 1920px; height: 1080px; overflow: hidden;
      background: #EFEAE0;
      font-family: 'Noto Sans SC', 'Manrope', sans-serif;
      position: relative;
    }
    .bg-wash {
      position: absolute; top: 0; right: 0; width: 60%; height: 100%;
      background: radial-gradient(ellipse at 70% 50%, rgba(122,158,127,0.10) 0%, transparent 70%);
      pointer-events: none;
    }
    .glass-card {
      position: absolute;
      left: 80px; top: 50%; transform: translateY(-50%);
      width: 760px; padding: 60px 64px;
      background: rgba(255,253,248,0.66);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 40px;
      box-shadow: 0 12px 48px rgba(0,0,0,0.04);
      opacity: 0;
      transform: translateY(26px) scale(0.985);
      animation: cardRise 0.8s cubic-bezier(0.16,1,0.3,1) 0.2s forwards;
    }
    @keyframes cardRise {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .eyebrow {
      font-size: 18px; font-weight: 600; letter-spacing: 4px; text-transform: uppercase;
      color: #7A9E7F; margin-bottom: 20px;
      opacity: 0; transform: translateY(14px);
      animation: fadeUp 0.5s ease 0.7s forwards;
    }
    .title {
      font-size: 74px; font-weight: 700; line-height: 1.2;
      color: #2D2A24; margin-bottom: 16px;
      opacity: 0; transform: translateY(14px);
      animation: fadeUp 0.5s ease 0.9s forwards;
    }
    .title .accent { color: #C98A5E; }
    .caption {
      font-size: 21px; font-weight: 400; line-height: 1.8;
      color: #8A867C;
      opacity: 0; transform: translateY(14px);
      animation: fadeUp 0.5s ease 1.2s forwards;
    }
    .caption strong { color: #5A5650; font-weight: 600; }
    .use-grid {
      display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px 20px; margin-top: 22px;
      opacity: 0;
      animation: fadeUp 0.6s ease 1.5s forwards;
    }
    .use-item {
      background: rgba(184,201,186,0.12);
      border-radius: 16px; padding: 14px 16px; text-align: center;
      font-size: 16px; color: #5A5650; line-height: 1.4;
    }
    .use-item .emoji { font-size: 24px; display: block; margin-bottom: 4px; }
    .use-item strong { font-weight: 600; color: #2D2A24; display: block; }
    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    .radial-container {
      position: absolute;
      right: 60px; top: 50%; transform: translateY(-50%);
      width: 720px; height: 720px;
    }
    .radial-svg { width: 100%; height: 100%; }

    .core-circle {
      fill: #C98A5E;
      opacity: 0;
      animation: corePop 0.6s cubic-bezier(0.34,1.56,0.64,1) 1.3s forwards;
    }
    @keyframes corePop {
      0% { opacity: 0; r: 0; }
      60% { opacity: 1; r: 48; }
      100% { opacity: 1; r: 42; }
    }
    .core-label {
      font-family: 'Noto Sans SC', sans-serif;
      font-size: 13px; font-weight: 700; fill: #fff; text-anchor: middle; dominant-baseline: central;
      opacity: 0;
      animation: labelFade 0.4s ease 1.8s forwards;
    }
    @keyframes labelFade { to { opacity: 1; } }

    .link { fill: none; stroke: #B8C9BA; stroke-width: 2.5; stroke-dasharray: 320; stroke-dashoffset: 320; }
    .link-draw { animation: linkDraw 0.8s ease-in-out forwards; }
    @keyframes linkDraw { to { stroke-dashoffset: 0; } }

    .node-group { opacity: 0; transform: scale(0); }
    .node-pop { animation: nodePop 0.5s cubic-bezier(0.34,1.56,0.64,1) forwards; }
    @keyframes nodePop {
      0% { opacity: 0; transform: scale(0); }
      60% { opacity: 1; transform: scale(1.25); }
      100% { opacity: 1; transform: scale(1); }
    }
    .node-circle { fill: #7A9E7F; }
    .node-text {
      font-family: 'Noto Sans SC', sans-serif;
      font-size: 12px; font-weight: 600; fill: #2D2A24; text-anchor: middle; dominant-baseline: central;
    }

    .float-group { animation: float 7s ease-in-out infinite; }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .footer-line {
      position: absolute; bottom: 40px; left: 80px; right: 80px;
      height: 1px; background: rgba(184,201,186,0.3);
      opacity: 0;
      animation: fadeUp 0.6s ease 5s forwards;
    }
    .footer-text {
      position: absolute; bottom: 48px; right: 80px;
      font-size: 13px; color: #B8C9BA; letter-spacing: 2px; font-weight: 400;
      opacity: 0;
      animation: fadeUp 0.6s ease 5.3s forwards;
    }
  </style>
</head>
<body>
  <div class="bg-wash"></div>

  <div class="glass-card">
    <div class="eyebrow">Applications</div>
    <div class="title"><span class="accent">应用</span>场景</div>
    <div class="caption">
      大模型正在渗透到<strong>各行各业</strong>，成为新一代生产力工具
    </div>
    <div class="use-grid">
      <div class="use-item"><span class="emoji">💼</span><strong>办公助手</strong>文档撰写·会议纪要</div>
      <div class="use-item"><span class="emoji">💻</span><strong>编程开发</strong>代码生成·自动化测试</div>
      <div class="use-item"><span class="emoji">🎨</span><strong>内容创作</strong>文案撰写·视频生成</div>
      <div class="use-item"><span class="emoji">📚</span><strong>教育学习</strong>智能辅导·个性化教学</div>
      <div class="use-item"><span class="emoji">🏥</span><strong>医疗健康</strong>辅助诊断·药物研发</div>
      <div class="use-item"><span class="emoji">🔬</span><strong>科学研究</strong>文献分析·实验设计</div>
    </div>
  </div>

  <div class="radial-container">
    <svg class="radial-svg" viewBox="0 0 720 720">
      <defs>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="2" stdDeviation="6" flood-opacity="0.08"/>
        </filter>
      </defs>

      <g class="float-group">
        <circle class="core-circle" cx="360" cy="360" r="42" filter="url(#shadow)"/>
        <text class="core-label" x="360" y="360">大模型</text>

        <!-- 6条线 -->
        <path class="link link-draw" d="M400,360 Q560,300 600,180" style="animation-delay:1.4s"/>
        <path class="link link-draw" d="M395,330 Q540,200 540,100" style="animation-delay:1.5s"/>
        <path class="link link-draw" d="M360,320 Q440,120 380,50" style="animation-delay:1.6s"/>
        <path class="link link-draw" d="M325,330 Q180,200 180,100" style="animation-delay:1.5s"/>
        <path class="link link-draw" d="M320,360 Q160,300 120,180" style="animation-delay:1.4s"/>
        <path class="link link-draw" d="M325,390 Q180,520 180,620" style="animation-delay:1.55s"/>

        <!-- 节点 -->
        <g class="node-group node-pop" style="animation-delay:1.9s; transform-origin:600px 180px">
          <circle class="node-circle" cx="600" cy="180" r="34" filter="url(#shadow)"/>
          <text class="node-text" x="600" y="180">办公</text>
        </g>
        <g class="node-group node-pop" style="animation-delay:2.0s; transform-origin:540px 100px">
          <circle class="node-circle" cx="540" cy="100" r="34" filter="url(#shadow)"/>
          <text class="node-text" x="540" y="100">编程</text>
        </g>
        <g class="node-group node-pop" style="animation-delay:2.1s; transform-origin:380px 50px">
          <circle class="node-circle" cx="380" cy="50" r="34" filter="url(#shadow)"/>
          <text class="node-text" x="380" y="50">内容</text>
        </g>
        <g class="node-group node-pop" style="animation-delay:2.0s; transform-origin:180px 100px">
          <circle class="node-circle" cx="180" cy="100" r="34" filter="url(#shadow)"/>
          <text class="node-text" x="180" y="100">教育</text>
        </g>
        <g class="node-group node-pop" style="animation-delay:1.9s; transform-origin:120px 180px">
          <circle class="node-circle" cx="120" cy="180" r="34" filter="url(#shadow)"/>
          <text class="node-text" x="120" y="180">医疗</text>
        </g>
        <g class="node-group node-pop" style="animation-delay:2.05s; transform-origin:180px 620px">
          <circle class="node-circle" cx="180" cy="620" r="34" filter="url(#shadow)"/>
          <text class="node-text" x="180" y="620">科研</text>
        </g>
      </g>
    </svg>
  </div>

  <div class="footer-line"></div>
  <div class="footer-text">办公 · 编程 · 内容 · 教育 · 医疗 · 科研</div>
</body>
</html>
