<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 大模型时代 — 开场</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      width: 1920px; height: 1080px; overflow: hidden;
      background: #EFEAE0;
      font-family: 'Noto Sans SC', 'Manrope', sans-serif;
      position: relative;
    }
    /* 右侧径向渐变 wash */
    .bg-wash {
      position: absolute; top: 0; right: 0; width: 60%; height: 100%;
      background: radial-gradient(ellipse at 70% 50%, rgba(122,158,127,0.10) 0%, transparent 70%);
      pointer-events: none;
    }
    /* 左侧毛玻璃卡片 */
    .glass-card {
      position: absolute;
      left: 80px; top: 50%; transform: translateY(-50%);
      width: 760px; padding: 60px 64px;
      background: rgba(255,253,248,0.66);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 40px;
      box-shadow: 0 12px 48px rgba(0,0,0,0.04);
      opacity: 0;
      transform: translateY(26px) scale(0.985);
      animation: cardRise 0.8s cubic-bezier(0.16,1,0.3,1) 0.2s forwards;
    }
    @keyframes cardRise {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .eyebrow {
      font-size: 18px; font-weight: 600; letter-spacing: 4px; text-transform: uppercase;
      color: #7A9E7F; margin-bottom: 20px;
      opacity: 0; transform: translateY(14px);
      animation: fadeUp 0.5s ease 0.7s forwards;
    }
    .title {
      font-size: 92px; font-weight: 700; line-height: 1.15;
      color: #2D2A24; margin-bottom: 16px;
      opacity: 0; transform: translateY(14px);
      animation: fadeUp 0.5s ease 0.9s forwards;
    }
    .title .accent {
      color: #C98A5E;
    }
    .caption {
      font-size: 22px; font-weight: 400; line-height: 1.8;
      color: #8A867C;
      opacity: 0; transform: translateY(14px);
      animation: fadeUp 0.5s ease 1.2s forwards;
    }
    .caption strong { color: #5A5650; font-weight: 600; }
    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    /* 右侧节点图 */
    .radial-container {
      position: absolute;
      right: 80px; top: 50%; transform: translateY(-50%);
      width: 680px; height: 680px;
    }
    .radial-svg {
      width: 100%; height: 100%;
    }
    /* 中心核心节点 */
    .core-circle {
      fill: #C98A5E;
      opacity: 0; transform-origin: center;
      animation: corePop 0.6s cubic-bezier(0.34,1.56,0.64,1) 1.3s forwards;
    }
    @keyframes corePop {
      0% { opacity: 0; r: 0; }
      60% { opacity: 1; r: 48; }
      100% { opacity: 1; r: 42; }
    }
    .core-label {
      font-family: 'Noto Sans SC', sans-serif;
      font-size: 14px; font-weight: 700; fill: #fff; text-anchor: middle; dominant-baseline: central;
      opacity: 0;
      animation: labelFade 0.4s ease 1.8s forwards;
    }
    @keyframes labelFade { to { opacity: 1; } }

    /* 连接线 */
    .link { fill: none; stroke: #B8C9BA; stroke-width: 2; stroke-dasharray: 300; stroke-dashoffset: 300; }
    .link-draw { animation: linkDraw 0.8s ease-in-out forwards; }
    @keyframes linkDraw { to { stroke-dashoffset: 0; } }

    /* 外围节点 */
    .node-group { opacity: 0; transform: scale(0); }
    .node-pop { animation: nodePop 0.5s cubic-bezier(0.34,1.56,0.64,1) forwards; }
    @keyframes nodePop {
      0% { opacity: 0; transform: scale(0); }
      60% { opacity: 1; transform: scale(1.25); }
      100% { opacity: 1; transform: scale(1); }
    }
    .node-circle { fill: #7A9E7F; }
    .node-text {
      font-family: 'Noto Sans SC', sans-serif;
      font-size: 13px; font-weight: 600; fill: #2D2A24; text-anchor: middle; dominant-baseline: central;
    }

    /* 浮动动画 */
    .float-group {
      animation: float 7s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    /* 底部装饰 */
    .footer-line {
      position: absolute; bottom: 40px; left: 80px; right: 80px;
      height: 1px; background: rgba(184,201,186,0.3);
      opacity: 0;
      animation: fadeUp 0.6s ease 3.5s forwards;
    }
    .footer-text {
      position: absolute; bottom: 48px; right: 80px;
      font-size: 13px; color: #B8C9BA; letter-spacing: 2px; font-weight: 400;
      opacity: 0;
      animation: fadeUp 0.6s ease 3.8s forwards;
    }
  </style>
</head>
<body>
  <div class="bg-wash"></div>

  <!-- 左侧卡片 -->
  <div class="glass-card">
    <div class="eyebrow">Artificial Intelligence</div>
    <div class="title">AI <span class="accent">大模型</span>时代</div>
    <div class="caption">
      从 GPT 到 Claude，从文心到通义——<br>
      <strong>人工智能大模型</strong>正在重塑我们的世界
    </div>
  </div>

  <!-- 右侧径向节点图 -->
  <div class="radial-container">
    <svg class="radial-svg" viewBox="0 0 680 680">
      <defs>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="2" stdDeviation="6" flood-opacity="0.08"/>
        </filter>
      </defs>

      <!-- 中心核心 -->
      <g class="float-group">
        <circle class="core-circle" cx="340" cy="340" r="42" filter="url(#shadow)"/>
        <text class="core-label" x="340" y="340">AI</text>

        <!-- 8条连接线 -->
        <!-- 右上0° -->
        <path class="link link-draw" d="M382,340 Q560,300 580,200" style="animation-delay:1.4s"/>
        <!-- 右上偏45° -->
        <path class="link link-draw" d="M382,310 Q530,220 560,130" style="animation-delay:1.5s"/>
        <!-- 上 -->
        <path class="link link-draw" d="M370,298 Q480,140 460,80" style="animation-delay:1.6s"/>
        <!-- 左上 -->
        <path class="link link-draw" d="M310,298 Q200,140 220,80" style="animation-delay:1.5s"/>
        <!-- 左 -->
        <path class="link link-draw" d="M298,340 Q120,300 100,200" style="animation-delay:1.4s"/>
        <!-- 左下 -->
        <path class="link link-draw" d="M298,370 Q150,460 120,550" style="animation-delay:1.55s"/>
        <!-- 下 -->
        <path class="link link-draw" d="M340,382 Q340,540 340,600" style="animation-delay:1.65s"/>
        <!-- 右下 -->
        <path class="link link-draw" d="M382,370 Q530,460 560,550" style="animation-delay:1.5s"/>

        <!-- 节点1：GPT - 右上 -->
        <g class="node-group node-pop" style="animation-delay:1.9s; transform-origin:580px 200px">
          <circle class="node-circle" cx="580" cy="200" r="30" filter="url(#shadow)"/>
          <text class="node-text" x="580" y="200">GPT</text>
        </g>
        <!-- 节点2：Claude - 右上偏 -->
        <g class="node-group node-pop" style="animation-delay:2.0s; transform-origin:560px 130px">
          <circle class="node-circle" cx="560" cy="130" r="30" filter="url(#shadow)"/>
          <text class="node-text" x="560" y="130">Claude</text>
        </g>
        <!-- 节点3：Gemini - 上 -->
        <g class="node-group node-pop" style="animation-delay:2.1s; transform-origin:460px 80px">
          <circle class="node-circle" cx="460" cy="80" r="30" filter="url(#shadow)"/>
          <text class="node-text" x="460" y="80">Gemini</text>
        </g>
        <!-- 节点4：文心 - 左上 -->
        <g class="node-group node-pop" style="animation-delay:2.0s; transform-origin:220px 80px">
          <circle class="node-circle" cx="220" cy="80" r="30" filter="url(#shadow)"/>
          <text class="node-text" x="220" y="80">文心</text>
        </g>
        <!-- 节点5：通义 - 左 -->
        <g class="node-group node-pop" style="animation-delay:1.9s; transform-origin:100px 200px">
          <circle class="node-circle" cx="100" cy="200" r="30" filter="url(#shadow)"/>
          <text class="node-text" x="100" y="200">通义</text>
        </g>
        <!-- 节点6：千问 - 左下 -->
        <g class="node-group node-pop" style="animation-delay:2.05s; transform-origin:120px 550px">
          <circle class="node-circle" cx="120" cy="550" r="30" filter="url(#shadow)"/>
          <text class="node-text" x="120" y="550">千问</text>
        </g>
        <!-- 节点7：Llama - 下 -->
        <g class="node-group node-pop" style="animation-delay:2.15s; transform-origin:340px 600px">
          <circle class="node-circle" cx="340" cy="600" r="30" filter="url(#shadow)"/>
          <text class="node-text" x="340" y="600">Llama</text>
        </g>
        <!-- 节点8：Mistral - 右下 -->
        <g class="node-group node-pop" style="animation-delay:2.05s; transform-origin:560px 550px">
          <circle class="node-circle" cx="560" cy="550" r="30" filter="url(#shadow)"/>
          <text class="node-text" x="560" y="550">Mistral</text>
        </g>
      </g>
    </svg>
  </div>

  <div class="footer-line"></div>
  <div class="footer-text">大模型 · 新纪元</div>
</body>
</html>
