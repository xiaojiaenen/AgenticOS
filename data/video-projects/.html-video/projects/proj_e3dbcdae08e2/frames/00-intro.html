<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI大模型 - 开场</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Noto+Sans+SC:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{width:1920px;height:1080px;overflow:hidden;background:#EFEAE0;font-family:'Noto Sans SC',sans-serif;position:relative;}
.bg-wash{position:absolute;top:0;right:0;width:800px;height:1080px;background:radial-gradient(ellipse at 70% 50%,rgba(122,158,127,0.12),transparent 70%);pointer-events:none;z-index:0;}
.bg-wash-2{position:absolute;bottom:-200px;left:-100px;width:600px;height:600px;background:radial-gradient(circle,rgba(201,138,94,0.08),transparent 70%);pointer-events:none;z-index:0;}

/* 装饰性漂浮圆 */
.floating-dots{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1;}
.dot{position:absolute;border-radius:50%;opacity:0;}
.dot-1{width:18px;height:18px;background:#C98A5E;top:15%;left:12%;}
.dot-2{width:12px;height:12px;background:#B8C9BA;top:25%;left:85%;}
.dot-3{width:24px;height:24px;background:rgba(201,138,94,0.2);top:70%;left:8%;}
.dot-4{width:10px;height:10px;background:#7A9E7F;top:60%;left:90%;}
.dot-5{width:16px;height:16px;background:rgba(122,158,127,0.3);top:40%;left:5%;}
.dot-6{width:8px;height:8px;background:#C98A5E;top:80%;left:78%;}
.dot-7{width:20px;height:20px;background:rgba(184,201,186,0.4);top:10%;left:55%;}
.dot-8{width:14px;height:14px;background:rgba(201,138,94,0.15);top:50%;left:95%;}

/* 右侧节点图 SVG */
.node-graph{position:absolute;top:50%;right:80px;transform:translateY(-50%);width:520px;height:520px;z-index:2;opacity:0;}
.node-graph svg{width:100%;height:100%;}
.center-node{cursor:pointer;}
.center-node circle{fill:#C98A5E;transition:r 0.3s;}
.link-line{stroke:#B8C9BA;stroke-width:2;fill:none;stroke-dasharray:300;stroke-dashoffset:300;}
.outer-node circle{fill:#7A9E7F;opacity:0;}

/* 主内容区 */
.content{position:absolute;top:0;left:0;width:100%;height:100%;z-index:10;display:flex;flex-direction:column;justify-content:center;padding:0 100px;}
.card-glass{position:absolute;top:50%;left:80px;transform:translateY(-50%);width:700px;padding:60px 70px;background:rgba(255,253,248,0.75);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:40px;box-shadow:0 8px 40px rgba(0,0,0,0.04);opacity:0;transform:translateY(30px) scale(0.985);}
.eyebrow{font-family:'Manrope',sans-serif;font-weight:600;font-size:16px;letter-spacing:6px;text-transform:uppercase;color:#7A9E7F;opacity:0;transform:translateY(12px);margin-bottom:8px;}
.main-title{font-size:96px;font-weight:900;color:#3D3A35;line-height:1.15;letter-spacing:2px;opacity:0;transform:translateY(20px);}
.main-title .accent{color:#C98A5E;}
.subtitle{font-size:22px;color:#8A867C;line-height:1.8;margin-top:20px;opacity:0;transform:translateY(15px);max-width:560px;}
.divider{width:60px;height:3px;background:#C98A5E;border-radius:2px;margin:16px 0;opacity:0;transform:scaleX(0);transform-origin:left;}
.tagline{position:absolute;bottom:60px;left:100px;font-family:'Manrope',sans-serif;font-size:14px;color:#B8C9BA;letter-spacing:4px;text-transform:uppercase;opacity:0;z-index:10;}

/* 装饰底纹 */
.grain{position:absolute;top:0;left:0;width:100%;height:100%;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");background-repeat:repeat;pointer-events:none;z-index:1;}

/* 动画 */
@keyframes floatSlow{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
@keyframes floatSlow2{0%,100%{transform:translateY(0);}50%{transform:translateY(6px);}}
@keyframes pulse{0%,100%{opacity:0.6;transform:scale(1);}50%{opacity:1;transform:scale(1.05);}}
@keyframes rotateSlow{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
.floating-loop{animation:floatSlow 4s ease-in-out infinite;}
.floating-loop-2{animation:floatSlow2 5s ease-in-out infinite;}
</style>
</head>
<body>
<div class="bg-wash"></div>
<div class="bg-wash-2"></div>
<div class="grain"></div>

<!-- 装饰点 -->
<div class="floating-dots">
  <div class="dot dot-1"></div>
  <div class="dot dot-2"></div>
  <div class="dot dot-3"></div>
  <div class="dot dot-4"></div>
  <div class="dot dot-5"></div>
  <div class="dot dot-6"></div>
  <div class="dot dot-7"></div>
  <div class="dot dot-8"></div>
</div>

<!-- 右侧节点图 -->
<div class="node-graph" id="nodeGraph">
  <svg viewBox="0 0 520 520">
    <!-- 连接线 -->
    <line class="link-line" x1="260" y1="260" x2="80" y2="120"/>
    <line class="link-line" x1="260" y1="260" x2="130" y2="50"/>
    <line class="link-line" x1="260" y1="260" x2="260" y2="30"/>
    <line class="link-line" x1="260" y1="260" x2="390" y2="50"/>
    <line class="link-line" x1="260" y1="260" x2="440" y2="120"/>
    <line class="link-line" x1="260" y1="260" x2="440" y2="350"/>
    <line class="link-line" x1="260" y1="260" x2="390" y2="450"/>
    <line class="link-line" x1="260" y1="260" x2="260" y2="470"/>
    <line class="link-line" x1="260" y1="260" x2="130" y2="450"/>
    <line class="link-line" x1="260" y1="260" x2="80" y2="350"/>
    
    <!-- 中心节点 -->
    <g class="center-node">
      <circle cx="260" cy="260" r="45" opacity="0"/>
      <circle cx="260" cy="260" r="38" fill="#C98A5E" opacity="0"/>
      <text x="260" y="267" text-anchor="middle" fill="white" font-size="18" font-weight="700" font-family="Manrope, sans-serif" opacity="0">AI</text>
    </g>
    
    <!-- 外围节点 -->
    <g class="outer-node"><circle cx="80" cy="120" r="22"/><text x="80" y="126" text-anchor="middle" fill="white" font-size="12" font-weight="600" font-family="Manrope">数据</text></g>
    <g class="outer-node"><circle cx="130" cy="50" r="22"/><text x="130" y="56" text-anchor="middle" fill="white" font-size="12" font-weight="600" font-family="Manrope">算力</text></g>
    <g class="outer-node"><circle cx="260" cy="30" r="22"/><text x="260" y="36" text-anchor="middle" fill="white" font-size="12" font-weight="600" font-family="Manrope">算法</text></g>
    <g class="outer-node"><circle cx="390" cy="50" r="22"/><text x="390" y="56" text-anchor="middle" fill="white" font-size="12" font-weight="600" font-family="Manrope">网络</text></g>
    <g class="outer-node"><circle cx="440" cy="120" r="22"/><text x="440" y="126" text-anchor="middle" fill="white" font-size="12" font-weight="600" font-family="Manrope">训练</text></g>
    <g class="outer-node"><circle cx="440" cy="350" r="22"/><text x="440" y="356" text-anchor="middle" fill="white" font-size="12" font-weight="600" font-family="Manrope">推理</text></g>
    <g class="outer-node"><circle cx="390" cy="450" r="22"/><text x="390" y="456" text-anchor="middle" fill="white" font-size="12" font-weight="600" font-family="Manrope">对齐</text></g>
    <g class="outer-node"><circle cx="260" cy="470" r="22"/><text x="260" y="476" text-anchor="middle" fill="white" font-size="12" font-weight="600" font-family="Manrope">涌现</text></g>
    <g class="outer-node"><circle cx="130" cy="450" r="22"/><text x="130" y="456" text-anchor="middle" fill="white" font-size="12" font-weight="600" font-family="Manrope">泛化</text></g>
    <g class="outer-node"><circle cx="80" cy="350" r="22"/><text x="80" y="356" text-anchor="middle" fill="white" font-size="12" font-weight="600" font-family="Manrope">应用</text></g>
  </svg>
</div>

<!-- 主内容 -->
<div class="content">
  <div class="card-glass" id="card">
    <div class="eyebrow" id="eyebrow">// DEEP LEARNING · 2025</div>
    <div class="divider" id="divider"></div>
    <div class="main-title" id="mainTitle">AI <span class="accent">大模型</span></div>
    <div class="subtitle" id="subtitle">从海量数据中涌现的通用智能，<br>正在重塑人机交互的每一个维度</div>
  </div>
  <div class="tagline" id="tagline">Foundation Model · 下一代人工智能基座</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
window.addEventListener('load', function(){
  const tl = gsap.timeline({defaults:{ease:'power3.out'}});
  
  // 装饰漂浮球 - 淡入并开始浮动
  tl.to('.dot-1',{opacity:0.7,duration:0.6},0.1);
  tl.to('.dot-2',{opacity:0.5,duration:0.6},0.2);
  tl.to('.dot-3',{opacity:0.3,duration:0.6},0.15);
  tl.to('.dot-4',{opacity:0.5,duration:0.6},0.25);
  tl.to('.dot-5',{opacity:0.4,duration:0.6},0.2);
  tl.to('.dot-6',{opacity:0.3,duration:0.6},0.3);
  tl.to('.dot-7',{opacity:0.4,duration:0.6},0.15);
  tl.to('.dot-8',{opacity:0.3,duration:0.6},0.25);
  
  // 毛玻璃卡 - 从下方升入
  tl.to('#card',{opacity:1,y:0,scale:1,duration:0.9,ease:'power2.out'},0.2);
  
  // Eyebrow
  tl.to('#eyebrow',{opacity:1,y:0,duration:0.5},0.7);
  
  // 分割线
  tl.to('#divider',{opacity:1,scaleX:1,duration:0.5,ease:'power2.out'},0.9);
  
  // 主标题
  tl.to('#mainTitle',{opacity:1,y:0,duration:0.8,ease:'power2.out'},1.1);
  
  // 副标题
  tl.to('#subtitle',{opacity:1,y:0,duration:0.7,ease:'power2.out'},1.4);
  
  // 底部标签
  tl.to('#tagline',{opacity:1,duration:0.6},1.8);
  
  // 节点图整体淡入
  tl.to('#nodeGraph',{opacity:1,duration:0.5},1.0);
  
  // 连接线动画 (stroke-dashoffset)
  tl.to('.link-line',{strokeDashoffset:0,duration:1.2,ease:'power2.inOut',stagger:0.06},1.3);
  
  // 中心节点
  tl.to('.center-node circle:first-child',{opacity:0.3,scale:1,r:58,duration:0.6},1.3);
  tl.to('.center-node circle:last-child',{opacity:1,scale:1,r:38,duration:0.5,ease:'back.out(2)'},1.4);
  tl.to('.center-node text',{opacity:1,duration:0.3},1.5);
  
  // 外围节点
  tl.to('.outer-node circle',{opacity:1,scale:1,duration:0.4,ease:'back.out(3)',stagger:0.05},1.6);
  tl.to('.outer-node text',{opacity:1,duration:0.2,stagger:0.05},1.7);
  
  // 持续浮动效果 (GSAP循环)
  gsap.to('.dot-1',{y:-8,duration:2.8,ease:'sine.inOut',yoyo:true,repeat:-1,delay:0.3});
  gsap.to('.dot-2',{y:6,duration:3.2,ease:'sine.inOut',yoyo:true,repeat:-1,delay:0.6});
  gsap.to('.dot-3',{y:-5,duration:2.6,ease:'sine.inOut',yoyo:true,repeat:-1,delay:0.1});
  gsap.to('.dot-4',{y:8,duration:3.5,ease:'sine.inOut',yoyo:true,repeat:-1,delay:0.8});
  gsap.to('.dot-5',{x:6,y:-4,duration:4,ease:'sine.inOut',yoyo:true,repeat:-1,delay:0.5});
  gsap.to('.dot-6',{x:-4,duration:3,ease:'sine.inOut',yoyo:true,repeat:-1,delay:0.2});
  gsap.to('.dot-7',{y:-10,duration:3.8,ease:'sine.inOut',yoyo:true,repeat:-1,delay:0.7});
  gsap.to('.dot-8',{x:5,y:5,duration:4.2,ease:'sine.inOut',yoyo:true,repeat:-1,delay:0.4});
  
  // 节点图整体缓慢浮动
  gsap.to('#nodeGraph',{y:-6,duration:4,ease:'sine.inOut',yoyo:true,repeat:-1,delay:1.5});
  
  // 中心节点脉冲
  gsap.to('.center-node circle:first-child',{opacity:0.2,r:62,duration:1.5,ease:'sine.inOut',yoyo:true,repeat:-1,delay:1.8});
  
  // 背景渐变微动
  gsap.to('.bg-wash',{x:10,duration:6,ease:'sine.inOut',yoyo:true,repeat:-1});
});
</script>
</body>
</html>
