<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>未来展望</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{width:1920px;height:1080px;overflow:hidden;background:#EFEAE0;font-family:'Noto Sans SC',sans-serif;position:relative;}

/* 背景层次 */
.bg-overlay{position:absolute;top:0;left:0;width:100%;height:100%;z-index:0;}
.bg-gradient{position:absolute;top:0;left:0;width:100%;height:100%;
  background:radial-gradient(ellipse at 30% 30%,rgba(122,158,127,0.12),transparent 50%),
             radial-gradient(ellipse at 70% 80%,rgba(201,138,94,0.08),transparent 50%);}
.grain{position:absolute;top:0;left:0;width:100%;height:100%;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");pointer-events:none;}

/* 装饰性大圆环 */
.hero-ring{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:800px;height:800px;border-radius:50%;border:1px solid rgba(184,201,186,0.15);z-index:1;opacity:0;transform:translate(-50%,-50%) scale(0.8);}
.hero-ring-2{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:600px;height:600px;border-radius:50%;border:1px solid rgba(201,138,94,0.12);z-index:1;opacity:0;transform:translate(-50%,-50%) scale(0.6);}
.hero-ring-3{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(122,158,127,0.06),transparent 70%);z-index:1;opacity:0;transform:translate(-50%,-50%) scale(0.4);}

/* 装饰性浮动圆点 */
.float-dots{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:2;}
.fdot{position:absolute;border-radius:50%;opacity:0;}
.fdot-1{width:16px;height:16px;background:rgba(201,138,94,0.3);top:18%;left:15%;}
.fdot-2{width:10px;height:10px;background:rgba(122,158,127,0.25);top:35%;left:85%;}
.fdot-3{width:22px;height:22px;background:rgba(184,201,186,0.2);top:72%;left:12%;}
.fdot-4{width:8px;height:8px;background:rgba(201,138,94,0.2);top:55%;left:88%;}
.fdot-5{width:14px;height:14px;background:rgba(122,158,127,0.2);top:80%;left:70%;}
.fdot-6{width:12px;height:12px;background:rgba(184,201,186,0.25);top:20%;left:50%;}
.fdot-7{width:18px;height:18px;background:rgba(201,138,94,0.15);top:65%;left:45%;}
.fdot-8{width:6px;height:6px;background:rgba(122,158,127,0.3);top:40%;left:30%;}

/* 中心内容 - 毛玻璃卡 */
.center-card{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:10;text-align:center;width:900px;padding:50px 60px;background:rgba(255,253,248,0.6);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:48px;box-shadow:0 12px 50px rgba(0,0,0,0.03);border:1px solid rgba(255,255,255,0.4);opacity:0;transform:translate(-50%,-50%) scale(0.92);}
.center-card .eyebrow{font-family:'Manrope',sans-serif;font-weight:600;font-size:14px;letter-spacing:8px;text-transform:uppercase;color:#7A9E7F;margin-bottom:16px;opacity:0;transform:translateY(10px);}
.center-card .main-title{font-size:82px;font-weight:900;color:#3D3A35;line-height:1.2;letter-spacing:4px;opacity:0;transform:translateY(20px);}
.center-card .main-title .accent{color:#C98A5E;}
.center-card .divider{width:80px;height:3px;background:linear-gradient(90deg,#7A9E7F,#C98A5E);border-radius:2px;margin:18px auto;opacity:0;transform:scaleX(0);}
.center-card .sub-message{font-size:22px;color:#8A867C;line-height:1.8;margin-top:6px;opacity:0;transform:translateY(12px);}

/* 底部CTA */
.cta-area{position:absolute;bottom:70px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:20px;z-index:10;opacity:0;}
.cta-line{width:80px;height:1px;background:rgba(184,201,186,0.4);}
.cta-text{font-family:'Manrope',sans-serif;font-size:14px;color:#B8C9BA;letter-spacing:4px;text-transform:uppercase;}

/* 底部装饰条 */
.bottom-strip{position:absolute;bottom:0;left:0;width:100%;height:4px;background:linear-gradient(90deg,#7A9E7F,#C98A5E,#7A9E7F);z-index:10;opacity:0;transform:scaleX(0);transform-origin:left;}

/* 右上角装饰文本 */
.corner-text{position:absolute;top:60px;right:80px;font-family:'Manrope',sans-serif;font-size:12px;color:rgba(184,201,186,0.4);letter-spacing:6px;writing-mode:vertical-rl;z-index:5;opacity:0;}
</style>
</head>
<body>
<div class="bg-overlay">
  <div class="bg-gradient"></div>
</div>
<div class="grain"></div>

<!-- 大圆环 -->
<div class="hero-ring" id="ringH1"></div>
<div class="hero-ring-2" id="ringH2"></div>
<div class="hero-ring-3" id="ringH3"></div>

<!-- 浮动点 -->
<div class="float-dots">
  <div class="fdot fdot-1"></div>
  <div class="fdot fdot-2"></div>
  <div class="fdot fdot-3"></div>
  <div class="fdot fdot-4"></div>
  <div class="fdot fdot-5"></div>
  <div class="fdot fdot-6"></div>
  <div class="fdot fdot-7"></div>
  <div class="fdot fdot-8"></div>
</div>

<div class="corner-text" id="cornerText">FOUNDATION MODEL · 2025</div>

<!-- 中心卡片 -->
<div class="center-card" id="centerCard">
  <div class="eyebrow" id="eyebrow4">// THE FUTURE IS NOW</div>
  <div class="main-title" id="outroTitle">
    未来 <span class="accent">已来</span>
  </div>
  <div class="divider" id="outroDivider"></div>
  <div class="sub-message" id="outroSub">
    AI 大模型不仅是一次技术革命，<br>
    更是一个全人类共同探索的无限可能
  </div>
</div>

<!-- CTA -->
<div class="cta-area" id="ctaArea">
  <div class="cta-line"></div>
  <div class="cta-text">拥抱智能时代 · 共创未来</div>
  <div class="cta-line"></div>
</div>

<!-- 底部渐变条 -->
<div class="bottom-strip" id="bottomStrip"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
window.addEventListener('load', function(){
  const tl = gsap.timeline({defaults:{ease:'power3.out'}});
  
  // 大圆环展开
  tl.to('#ringH1',{opacity:1,scale:1,duration:1.2,ease:'power2.out'},0);
  tl.to('#ringH2',{opacity:1,scale:1,duration:1.0,ease:'power2.out'},0.2);
  tl.to('#ringH3',{opacity:1,scale:1,duration:0.8,ease:'power2.out'},0.4);
  
  // 角落文字
  tl.to('#cornerText',{opacity:1,duration:0.6},0.3);
  
  // 浮动点阵弹入
  tl.to('.fdot-1',{opacity:0.5,scale:1,duration:0.5,ease:'back.out(2)'},0.4);
  tl.to('.fdot-2',{opacity:0.5,scale:1,duration:0.5,ease:'back.out(2)'},0.5);
  tl.to('.fdot-3',{opacity:0.3,scale:1,duration:0.5,ease:'back.out(2)'},0.45);
  tl.to('.fdot-4',{opacity:0.4,scale:1,duration:0.5,ease:'back.out(2)'},0.55);
  tl.to('.fdot-5',{opacity:0.3,scale:1,duration:0.5,ease:'back.out(2)'},0.5);
  tl.to('.fdot-6',{opacity:0.4,scale:1,duration:0.5,ease:'back.out(2)'},0.6);
  tl.to('.fdot-7',{opacity:0.2,scale:1,duration:0.5,ease:'back.out(2)'},0.55);
  tl.to('.fdot-8',{opacity:0.4,scale:1,duration:0.5,ease:'back.out(2)'},0.6);
  
  // 中心卡片
  tl.to('#centerCard',{opacity:1,scale:1,duration:0.9,ease:'power2.out'},0.6);
  tl.to('#eyebrow4',{opacity:1,y:0,duration:0.5},1.0);
  tl.to('#outroTitle',{opacity:1,y:0,duration:0.7,ease:'power2.out'},1.2);
  tl.to('#outroDivider',{opacity:1,scaleX:1,duration:0.5,ease:'power2.out'},1.4);
  tl.to('#outroSub',{opacity:1,y:0,duration:0.6},1.6);
  
  // CTA区域
  tl.to('#ctaArea',{opacity:1,duration:0.5},2.0);
  
  // 底部条 - 收缩到中心
  tl.to('#bottomStrip',{opacity:1,scaleX:1,duration:0.8,ease:'power3.inOut'},2.2);
  
  // 持续动画
  gsap.to('#ringH1',{rotate:180,duration:40,ease:'none',repeat:-1});
  gsap.to('#ringH2',{rotate:-120,duration:30,ease:'none',repeat:-1});
  gsap.to('#ringH3',{opacity:0.6,pulse:1.1,duration:3,ease:'sine.inOut',yoyo:true,repeat:-1,delay:1});
  gsap.to('.fdot-1',{y:-10,duration:3.5,ease:'sine.inOut',yoyo:true,repeat:-1,delay:0.5});
  gsap.to('.fdot-2',{y:8,duration:4,ease:'sine.inOut',yoyo:true,repeat:-1,delay:1});
  gsap.to('.fdot-3',{x:6,duration:3.2,ease:'sine.inOut',yoyo:true,repeat:-1,delay:0.8});
  gsap.to('.fdot-4',{y:-6,duration:3.8,ease:'sine.inOut',yoyo:true,repeat:-1,delay:0.3});
  gsap.to('.fdot-5',{x:-8,duration:4.2,ease:'sine.inOut',yoyo:true,repeat:-1,delay:1.2});
  gsap.to('.fdot-6',{y:12,duration:3,ease:'sine.inOut',yoyo:true,repeat:-1,delay:0.6});
  gsap.to('.fdot-7',{x:5,y:-5,duration:3.6,ease:'sine.inOut',yoyo:true,repeat:-1,delay:0.9});
  gsap.to('.fdot-8',{y:-8,duration:2.8,ease:'sine.inOut',yoyo:true,repeat:-1,delay:0.4});
  
  // 中心卡片微动
  gsap.to('#centerCard',{y:-5,duration:4,ease:'sine.inOut',yoyo:true,repeat:-1,delay:1.5});
});
</script>
</body>
</html>
