<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 大模型 - How</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700;900&family=Noto+Sans+SC:wght@300;500;700&family=Inter:wght@300;700;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1920px; height:1080px; overflow:hidden; background:#08081a; font-family:'Noto Sans SC',sans-serif; }

.fluid-bg {
  position:absolute; inset:0;
  overflow:hidden;
}
.fluid-bg .layer {
  position:absolute; width:200%; height:200%;
  top:-50%; left:-50%;
  border-radius:50%;
  mix-blend-mode:screen;
  will-change:transform;
}
.layer-1 { background:radial-gradient(ellipse 38% 32% at 30% 30%, #7c5cff 0%, transparent 70%); animation: float1 14s ease-in-out infinite; }
.layer-2 { background:radial-gradient(ellipse 32% 40% at 70% 70%, #0a84ff 0%, transparent 70%); animation: float2 12s ease-in-out infinite; }
.layer-3 { background:radial-gradient(ellipse 42% 28% at 50% 20%, #38bdf8 0%, transparent 70%); animation: float3 11s ease-in-out infinite; }
.layer-4 { background:radial-gradient(ellipse 28% 38% at 20% 80%, #1e1b4b 0%, transparent 70%); animation: float4 13s ease-in-out infinite; }
.layer-blur { position:absolute; inset:0; backdrop-filter:blur(85px); -webkit-backdrop-filter:blur(85px); }

.scanlines { position:absolute; inset:0; background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(255,255,255,0.01) 2px,rgba(255,255,255,0.01) 4px); pointer-events:none; z-index:2; }

@keyframes float1 { 0%,100%{transform:translate(0,0)scale(1);} 33%{transform:translate(-3%,2%)scale(1.05);} 66%{transform:translate(2%,-3%)scale(0.95);} }
@keyframes float2 { 0%,100%{transform:translate(0,0)scale(1);} 33%{transform:translate(4%,-2%)scale(0.93);} 66%{transform:translate(-2%,3%)scale(1.07);} }
@keyframes float3 { 0%,100%{transform:translate(0,0)scale(1);} 25%{transform:translate(3%,3%)scale(1.06);} 50%{transform:translate(-4%,-1%)scale(0.92);} 75%{transform:translate(1%,-4%)scale(1.05);} }
@keyframes float4 { 0%,100%{transform:translate(0,0)scale(1);} 33%{transform:translate(-2%,-3%)scale(1.08);} 66%{transform:translate(3%,2%)scale(0.94);} }

.content { position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center; align-items:center; z-index:3; color:#fafaf8; text-align:center; padding:80px; }

.section-tag {
  font-family:'Inter',sans-serif;
  font-size:13px;
  letter-spacing:5px;
  color:rgba(56,189,248,0.7);
  text-transform:uppercase;
  margin-bottom:30px;
  font-weight:300;
}

.main-title {
  font-family:'Noto Serif SC',serif;
  font-size:68px;
  font-weight:900;
  line-height:1.4;
  margin-bottom:50px;
}

.gradient-text {
  background:linear-gradient(135deg,#c4b5fd,#38bdf8,#a78bfa);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
}

/* Flow step cards */
.process-row {
  display:flex;
  gap:20px;
  margin-top:20px;
  align-items:center;
}

.step-card {
  width:220px;
  padding:30px 20px;
  border:1px solid rgba(167,139,250,0.15);
  border-radius:16px;
  background:rgba(255,255,255,0.03);
  backdrop-filter:blur(10px);
  text-align:center;
}

.step-icon {
  font-size:36px;
  margin-bottom:15px;
}

.step-title {
  font-size:18px;
  font-weight:700;
  margin-bottom:8px;
  color:#fafaf8;
}

.step-desc {
  font-size:13px;
  color:rgba(255,255,255,0.5);
  font-weight:300;
  line-height:1.6;
}

.arrow {
  font-size:28px;
  color:rgba(167,139,250,0.4);
  font-weight:300;
}

.corner-tl,.corner-br{position:absolute;width:60px;height:60px;border-color:rgba(167,139,250,0.15);z-index:4;}
.corner-tl{top:40px;left:40px;border-top:1px solid;border-left:1px solid;}
.corner-br{bottom:40px;right:40px;border-bottom:1px solid;border-right:1px solid;}
</style>
</head>
<body>
<div class="fluid-bg">
  <div class="layer layer-1"></div>
  <div class="layer layer-2"></div>
  <div class="layer layer-3"></div>
  <div class="layer layer-4"></div>
  <div class="layer-blur"></div>
</div>
<div class="scanlines"></div>

<div class="corner-tl"></div>
<div class="corner-br"></div>

<div class="content">
  <div class="section-tag" id="tag">✦ HOW IT WORKS</div>
  <h1 class="main-title" id="title">从<span class="gradient-text">海量数据</span>中学习</h1>
  
  <div class="process-row">
    <div class="step-card" id="step1">
      <div class="step-icon">📖</div>
      <div class="step-title">海量文本</div>
      <div class="step-desc">互联网、书籍、论文<br>多源异构数据</div>
    </div>
    <div class="arrow" id="arrow1">→</div>
    <div class="step-card" id="step2">
      <div class="step-icon">🧠</div>
      <div class="step-title">Transformer</div>
      <div class="step-desc">自注意力机制<br>并行处理序列</div>
    </div>
    <div class="arrow" id="arrow2">→</div>
    <div class="step-card" id="step3">
      <div class="step-icon">⚡</div>
      <div class="step-title">强化学习</div>
      <div class="step-desc">RLHF 人类反馈<br>对齐价值观</div>
    </div>
    <div class="arrow" id="arrow3">→</div>
    <div class="step-card" id="step4">
      <div class="step-icon">🌟</div>
      <div class="step-title">理解生成</div>
      <div class="step-desc">回答问题<br>创作内容</div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
const tl = gsap.timeline({defaults:{ease:'power3.out'}});

tl.fromTo('#tag', {y:-20,opacity:0}, {y:0,opacity:1,duration:0.6})
  .fromTo('#title', {y:40,opacity:0}, {y:0,opacity:1,duration:0.8}, '-=0.3')
  .fromTo('#step1', {y:40,opacity:0,scale:0.9}, {y:0,opacity:1,scale:1,duration:0.5}, '-=0.2')
  .fromTo('#arrow1', {opacity:0,scaleX:0}, {opacity:1,scaleX:1,duration:0.3}, '-=0.2')
  .fromTo('#step2', {y:40,opacity:0,scale:0.9}, {y:0,opacity:1,scale:1,duration:0.5}, '-=0.2')
  .fromTo('#arrow2', {opacity:0,scaleX:0}, {opacity:1,scaleX:1,duration:0.3}, '-=0.2')
  .fromTo('#step3', {y:40,opacity:0,scale:0.9}, {y:0,opacity:1,scale:1,duration:0.5}, '-=0.2')
  .fromTo('#arrow3', {opacity:0,scaleX:0}, {opacity:1,scaleX:1,duration:0.3}, '-=0.2')
  .fromTo('#step4', {y:40,opacity:0,scale:0.9}, {y:0,opacity:1,scale:1,duration:0.5}, '-=0.2');

// Step pulse animation
document.querySelectorAll('.step-card').forEach((el,i)=>{
  gsap.to(el, {
    borderColor:'rgba(167,139,250,0.4)',
    boxShadow:'0 0 30px rgba(124,92,255,0.1)',
    duration:1.5,
    yoyo:true,
    repeat:-1,
    delay:i*0.8,
    ease:'sine.inOut'
  });
});
</script>
</body>
</html>
