<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 大模型 - Outro</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700;900&family=Noto+Sans+SC:wght@300;500;700&family=Inter:wght@300;700;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1920px; height:1080px; overflow:hidden; background:#08081a; font-family:'Noto Sans SC',sans-serif; }

.fluid-bg {
  position:absolute; inset:0;
  overflow:hidden;
}
.fluid-bg .layer {
  position:absolute; width:200%; height:200%;
  top:-50%; left:-50%;
  border-radius:50%;
  mix-blend-mode:screen;
  will-change:transform;
}
.layer-1 { background:radial-gradient(ellipse 40% 35% at 30% 30%, #7c5cff 0%, transparent 70%); animation: float1 15s ease-in-out infinite; }
.layer-2 { background:radial-gradient(ellipse 30% 40% at 70% 70%, #1e1b4b 0%, transparent 70%); animation: float2 13s ease-in-out infinite; }
.layer-3 { background:radial-gradient(ellipse 35% 30% at 60% 20%, #a78bfa 0%, transparent 70%); animation: float3 11s ease-in-out infinite; }
.layer-4 { background:radial-gradient(ellipse 25% 35% at 30% 80%, #38bdf8 0%, transparent 70%); animation: float4 12s ease-in-out infinite; }
.layer-blur { position:absolute; inset:0; backdrop-filter:blur(90px); -webkit-backdrop-filter:blur(90px); }

.scanlines { position:absolute; inset:0; background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(255,255,255,0.015) 2px,rgba(255,255,255,0.015) 4px); pointer-events:none; z-index:2; }

@keyframes float1 { 0%,100%{transform:translate(0,0)scale(1);} 33%{transform:translate(-3%,2%)scale(1.05);} 66%{transform:translate(2%,-3%)scale(0.95);} }
@keyframes float2 { 0%,100%{transform:translate(0,0)scale(1);} 33%{transform:translate(4%,-2%)scale(0.93);} 66%{transform:translate(-2%,3%)scale(1.07);} }
@keyframes float3 { 0%,100%{transform:translate(0,0)scale(1);} 25%{transform:translate(3%,3%)scale(1.06);} 50%{transform:translate(-4%,-1%)scale(0.92);} 75%{transform:translate(1%,-4%)scale(1.05);} }
@keyframes float4 { 0%,100%{transform:translate(0,0)scale(1);} 33%{transform:translate(-2%,-3%)scale(1.08);} 66%{transform:translate(3%,2%)scale(0.92);} }

.content { position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center; align-items:center; z-index:3; color:#fafaf8; text-align:center; padding:80px; }

.main-title {
  font-family:'Noto Serif SC',serif;
  font-size:88px;
  font-weight:900;
  line-height:1.2;
  margin-bottom:24px;
  background:linear-gradient(135deg,#fafaf8 20%,#c4b5fd 50%,#38bdf8 80%);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
}

.subtitle {
  font-size:24px;
  font-weight:300;
  color:rgba(255,255,255,0.5);
  letter-spacing:6px;
  margin-bottom:60px;
  font-family:'Noto Sans SC',sans-serif;
}

/* CTA Button */
.cta-wrap {
  display:flex;
  gap:24px;
}

.cta-btn {
  padding:16px 48px;
  border-radius:50px;
  font-size:18px;
  font-weight:500;
  font-family:'Noto Sans SC',sans-serif;
  cursor:pointer;
  transition:all 0.3s;
  text-decoration:none;
}

.cta-primary {
  background:linear-gradient(135deg,#7c5cff,#38bdf8);
  color:#fff;
  border:none;
  box-shadow:0 8px 32px rgba(124,92,255,0.3);
}

.cta-outline {
  background:transparent;
  color:rgba(255,255,255,0.7);
  border:1px solid rgba(167,139,250,0.3);
}

/* Bottom text */
.bottom-text {
  position:absolute;
  bottom:50px;
  left:0;right:0;
  text-align:center;
  font-size:14px;
  color:rgba(255,255,255,0.2);
  letter-spacing:3px;
  font-weight:300;
}

.divider-lg {
  width:120px; height:1px;
  background:linear-gradient(90deg,transparent,rgba(167,139,250,0.4),transparent);
  margin:30px 0 50px;
}

/* Floating particles extra */
.glows {
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:1;
}
.glow-dot {
  position:absolute;
  width:4px; height:4px;
  border-radius:50%;
  background:#a78bfa;
  box-shadow:0 0 8px rgba(167,139,250,0.5);
}

.corner-tl,.corner-br{position:absolute;width:60px;height:60px;border-color:rgba(167,139,250,0.15);z-index:4;}
.corner-tl{top:40px;left:40px;border-top:1px solid;border-left:1px solid;}
.corner-br{bottom:40px;right:40px;border-bottom:1px solid;border-right:1px solid;}
</style>
</head>
<body>
<div class="fluid-bg">
  <div class="layer layer-1"></div>
  <div class="layer layer-2"></div>
  <div class="layer layer-3"></div>
  <div class="layer layer-4"></div>
  <div class="layer-blur"></div>
</div>
<div class="scanlines"></div>

<div class="glows" id="glows"></div>

<div class="corner-tl"></div>
<div class="corner-br"></div>

<div class="content">
  <h1 class="main-title" id="title">未来已来</h1>
  <div class="divider-lg" id="divider"></div>
  <p class="subtitle" id="subtitle">AI 大模型正在重塑世界</p>
  
  <div class="cta-wrap" id="ctas">
    <div class="cta-btn cta-primary">探索更多 →</div>
    <div class="cta-btn cta-outline">关于我们</div>
  </div>
</div>

<div class="bottom-text">— AI EXPLAINER · 2025 —</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
// Floating glow dots
const glows = document.getElementById('glows');
for(let i=0;i<30;i++){
  const dot = document.createElement('div');
  dot.className = 'glow-dot';
  dot.style.left = Math.random()*1920+'px';
  dot.style.top = Math.random()*1080+'px';
  dot.style.width = dot.style.height = (Math.random()*4+2)+'px';
  dot.style.opacity = Math.random()*0.5+0.1;
  glows.appendChild(dot);
  
  gsap.to(dot, {
    y: -30-Math.random()*60,
    x: (Math.random()-0.5)*40,
    opacity: 0,
    duration: 3+Math.random()*4,
    repeat: -1,
    delay: Math.random()*3,
    ease: 'power1.out'
  });
}

const tl = gsap.timeline({defaults:{ease:'power3.out'}});

tl.fromTo('#title', {y:50,opacity:0,scale:0.9}, {y:0,opacity:1,scale:1,duration:1})
  .fromTo('#divider', {scaleX:0}, {scaleX:1,duration:0.7,transformOrigin:'center'}, '-=0.3')
  .fromTo('#subtitle', {y:30,opacity:0}, {y:0,opacity:1,duration:0.8}, '-=0.3')
  .fromTo('#ctas', {y:40,opacity:0}, {y:0,opacity:1,duration:0.7}, '-=0.2');

// Pulse on CTA
gsap.to('.cta-primary', {
  boxShadow:'0 8px 48px rgba(124,92,255,0.5), 0 0 60px rgba(56,189,248,0.2)',
  duration:2,
  yoyo:true,
  repeat:-1,
  ease:'sine.inOut'
});
</script>
</body>
</html>
