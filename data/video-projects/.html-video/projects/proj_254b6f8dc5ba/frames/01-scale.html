<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 大模型 - Scale</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700;900&family=Noto+Sans+SC:wght@300;500;700&family=Inter:wght@300;700;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1920px; height:1080px; overflow:hidden; background:#08081a; font-family:'Noto Sans SC',sans-serif; }

.fluid-bg {
  position:absolute; inset:0;
  overflow:hidden;
}
.fluid-bg .layer {
  position:absolute; width:200%; height:200%;
  top:-50%; left:-50%;
  border-radius:50%;
  mix-blend-mode:screen;
  will-change:transform;
}
.layer-1 { background:radial-gradient(ellipse 35% 30% at 25% 35%, #7c5cff 0%, transparent 70%); animation: float1 13s ease-in-out infinite; }
.layer-2 { background:radial-gradient(ellipse 30% 35% at 75% 65%, #1e3a8a 0%, transparent 70%); animation: float2 11s ease-in-out infinite; }
.layer-3 { background:radial-gradient(ellipse 40% 25% at 60% 25%, #38bdf8 0%, transparent 70%); animation: float3 15s ease-in-out infinite; }
.layer-4 { background:radial-gradient(ellipse 25% 40% at 40% 75%, #4c1d95 0%, transparent 70%); animation: float4 10s ease-in-out infinite; }
.layer-blur { position:absolute; inset:0; backdrop-filter:blur(90px); -webkit-backdrop-filter:blur(90px); }

.scanlines { position:absolute; inset:0; background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,0.012) 2px, rgba(255,255,255,0.012) 4px); pointer-events:none; z-index:2; }

@keyframes float1 { 0%,100%{transform:translate(0,0)scale(1);} 33%{transform:translate(-3%,2%)scale(1.06);} 66%{transform:translate(2%,-3%)scale(0.94);} }
@keyframes float2 { 0%,100%{transform:translate(0,0)scale(1);} 33%{transform:translate(4%,-2%)scale(0.94);} 66%{transform:translate(-2%,3%)scale(1.07);} }
@keyframes float3 { 0%,100%{transform:translate(0,0)scale(1);} 25%{transform:translate(3%,3%)scale(1.05);} 50%{transform:translate(-4%,-1%)scale(0.93);} 75%{transform:translate(1%,-4%)scale(1.04);} }
@keyframes float4 { 0%,100%{transform:translate(0,0)scale(1);} 33%{transform:translate(-2%,-3%)scale(1.08);} 66%{transform:translate(3%,2%)scale(0.92);} }

.content { position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center; align-items:center; z-index:3; color:#fafaf8; text-align:center; padding:80px; }

.section-tag {
  font-family:'Inter',sans-serif;
  font-size:13px;
  letter-spacing:5px;
  color:rgba(56,189,248,0.7);
  text-transform:uppercase;
  margin-bottom:30px;
  font-weight:300;
}

.main-title {
  font-family:'Noto Serif SC',serif;
  font-size:76px;
  font-weight:900;
  line-height:1.3;
  margin-bottom:50px;
}

.gradient-text {
  background: linear-gradient(135deg, #c4b5fd, #38bdf8, #a78bfa);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
}

/* Stats row */
.stats-row {
  display:flex;
  gap:60px;
  margin-top:10px;
}

.stat-item {
  text-align:center;
}

.stat-number {
  font-family:'Inter',sans-serif;
  font-size:52px;
  font-weight:900;
  line-height:1;
  background: linear-gradient(180deg, #fafaf8 0%, rgba(167,139,250,0.8) 100%);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
}

.stat-label {
  font-size:16px;
  color:rgba(255,255,255,0.5);
  margin-top:12px;
  letter-spacing:3px;
  font-family:'Noto Sans SC',sans-serif;
  font-weight:300;
}

.stat-divider {
  width:1px;
  background: linear-gradient(180deg, transparent, rgba(167,139,250,0.3), transparent);
}

.corner-tl, .corner-br { position:absolute; width:60px; height:60px; border-color:rgba(167,139,250,0.15); z-index:4; }
.corner-tl { top:40px; left:40px; border-top:1px solid; border-left:1px solid; }
.corner-br { bottom:40px; right:40px; border-bottom:1px solid; border-right:1px solid; }
</style>
</head>
<body>
<div class="fluid-bg">
  <div class="layer layer-1"></div>
  <div class="layer layer-2"></div>
  <div class="layer layer-3"></div>
  <div class="layer layer-4"></div>
  <div class="layer-blur"></div>
</div>
<div class="scanlines"></div>

<div class="corner-tl"></div>
<div class="corner-br"></div>

<div class="content">
  <div class="section-tag" id="tag">✦ THE SCALE</div>
  <h1 class="main-title" id="title"><span class="gradient-text">千亿参数 · 万亿 Token</span></h1>
  
  <div class="stats-row">
    <div class="stat-item" id="stat1">
      <div class="stat-number"><span id="num1">0</span>亿+</div>
      <div class="stat-label">参数规模</div>
    </div>
    <div class="stat-divider" id="div1"></div>
    <div class="stat-item" id="stat2">
      <div class="stat-number"><span id="num2">0</span>万亿</div>
      <div class="stat-label">训练 Token</div>
    </div>
    <div class="stat-divider" id="div2"></div>
    <div class="stat-item" id="stat3">
      <div class="stat-number"><span id="num3">0</span>TB+</div>
      <div class="stat-label">训练数据</div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
const tl = gsap.timeline({defaults:{ease:'power3.out'}});

tl.fromTo('#tag', {y:-20,opacity:0}, {y:0,opacity:1,duration:0.6})
  .fromTo('#title', {y:40,opacity:0}, {y:0,opacity:1,duration:0.8}, '-=0.3')
  .fromTo('#stat1', {y:30,opacity:0,scale:0.8}, {y:0,opacity:1,scale:1,duration:0.6}, '-=0.2')
  .fromTo('#div1', {scaleY:0}, {scaleY:1,duration:0.3,transformOrigin:'top'}, '-=0.3')
  .fromTo('#stat2', {y:30,opacity:0,scale:0.8}, {y:0,opacity:1,scale:1,duration:0.6}, '-=0.2')
  .fromTo('#div2', {scaleY:0}, {scaleY:1,duration:0.3,transformOrigin:'top'}, '-=0.3')
  .fromTo('#stat3', {y:30,opacity:0,scale:0.8}, {y:0,opacity:1,scale:1,duration:0.6}, '-=0.2');

// Number counting animation
function animateNumber(el, target, suffix){
  const span = document.getElementById(el);
  let val = 0;
  const step = target / 40;
  const interval = setInterval(()=>{
    val += step;
    if(val >= target){
      val = target;
      clearInterval(interval);
    }
    span.textContent = Math.floor(val);
  }, 50);
}
setTimeout(()=>{ animateNumber('num1', 1800); }, 800);
setTimeout(()=>{ animateNumber('num2', 13); }, 1200);
setTimeout(()=>{ animateNumber('num3', 45); }, 1600);
</script>
</body>
</html>
