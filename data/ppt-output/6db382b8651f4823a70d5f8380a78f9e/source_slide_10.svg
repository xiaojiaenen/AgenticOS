<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1280 720' data-theme='apple'>
  <!-- notes: 品牌理念——董明珠的经典语录。用金句收束整个品牌叙事，从技术回到价值观。"掌握核心科技"不只是广告语，是格力34年来的行动纲领。语速放慢，让这句话沉淀下来。 -->
  <g id='bg-layer'>
    <rect width='1280' height='720' fill='#ffffff'/>
    <rect x='0' y='0' width='1280' height='6' fill='#0071e3'/>
  </g>
  <g id='quote-decor' text-anchor='middle'>
    <text x='640' y='220' font-size='160' font-weight='900' fill='#0071e3' fill-opacity='0.08' font-family='Playfair Display,Noto Serif SC,serif'>"</text>
  </g>
  <g id='quote-text' text-anchor='middle' font-family='Inter,Noto Sans SC,sans-serif'>
    <text x='640' y='340' font-size='34' fill='#1d1d1f' font-weight='600' font-family='Playfair Display,Noto Serif SC,serif'>
      <tspan x='640' dy='0'>掌握核心科技，</tspan>
      <tspan x='640' dy='52'>才能掌握未来。</tspan>
    </text>
  </g>
  <g id='quote-author' text-anchor='middle' font-family='Inter,Noto Sans SC,sans-serif'>
    <line x1='520' y1='440' x2='760' y2='440' stroke='#0071e3' stroke-width='2'/>
    <text x='640' y='490' font-size='20' fill='#0071e3' font-weight='600'>—— 董明珠</text>
    <text x='640' y='530' font-size='15' fill='#424245'>格力电器董事长兼总裁</text>
  </g>
  <g id='quote-footer'>
    <text x='1200' y='680' text-anchor='end' font-size='12' fill='#86868b' font-family='Inter,Noto Sans SC,sans-serif'>10 / 11</text>
  </g>
</svg>