<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1280 720' data-theme='apple'>
  <!-- notes: 封面页——强调格力品牌势能和核心价值主张。开场用一句话建立品牌认知：格力是中国空调行业的绝对领导者。注意语速放慢，让标题的冲击力充分释放。 -->
  <g id='bg-layer'>
    <rect width='1280' height='720' fill='#ffffff'/>
    <rect x='0' y='0' width='1280' height='6' fill='#0071e3'/>
  </g>
  <g id='cover-decor'>
    <circle cx='1050' cy='200' r='280' fill='#0071e3' fill-opacity='0.04'/>
    <circle cx='1050' cy='200' r='180' fill='#0071e3' fill-opacity='0.06'/>
    <circle cx='1050' cy='200' r='100' fill='#0071e3' fill-opacity='0.08'/>
  </g>
  <g id='cover-header' text-anchor='middle' font-family='Inter,Noto Sans SC,sans-serif'>
    <text x='640' y='160' font-size='18' fill='#0071e3' font-weight='600' letter-spacing='4'>GREE · 格力电器</text>
    <text x='640' y='280' font-size='64' font-weight='800' fill='#1d1d1f' font-family='Playfair Display,Noto Serif SC,serif'>
      <tspan x='640' dy='0'>让世界爱上</tspan>
      <tspan x='640' dy='80' fill='#0071e3'>中国造</tspan>
    </text>
    <text x='640' y='440' font-size='22' fill='#424245'>格力空调 · 核心科技引领品质生活</text>
  </g>
  <g id='cover-tags'>
    <rect x='480' y='500' width='140' height='38' rx='19' fill='#0071e3'/>
    <text x='550' y='525' font-size='14' fill='#ffffff' font-weight='600' text-anchor='middle' font-family='Inter,Noto Sans SC,sans-serif'>行业第一</text>
    <rect x='640' y='500' width='160' height='38' rx='19' fill='#fbfbfd' stroke='#d2d2d7' stroke-width='1'/>
    <text x='720' y='525' font-size='14' fill='#424245' font-weight='500' text-anchor='middle' font-family='Inter,Noto Sans SC,sans-serif'>核心科技</text>
  </g>
  <g id='cover-footer'>
    <text x='80' y='680' font-size='12' fill='#86868b' font-family='Inter,Noto Sans SC,sans-serif'>珠海格力电器股份有限公司</text>
    <text x='1200' y='680' text-anchor='end' font-size='12' fill='#86868b' font-family='Inter,Noto Sans SC,sans-serif'>品牌宣传 · 2025</text>
  </g>
</svg>