<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1280 720' data-theme='ghibli'>
  <defs>
    <linearGradient id='skyGrad4' x1='0' y1='0' x2='0' y2='1'>
      <stop offset='0%' stop-color='var(--bg)'/>
      <stop offset='100%' stop-color='var(--surface)'/>
    </linearGradient>
  </defs>
  <!-- notes: 核心数据页——最大的数字"120,000+"观众人次震撼呈现，下方三个子指标并排，展示漫展影响力。示意数据 -->
  <g id='bg-layer'>
    <rect width='1280' height='720' fill='url(#skyGrad4)'/>
  </g>
  <g id='decoration-clouds'>
    <g fill='var(--surface)' fill-opacity='0.35'>
      <ellipse cx='1100' cy='120' rx='90' ry='35'/>
      <ellipse cx='1170' cy='105' rx='60' ry='28'/>
    </g>
  </g>
  <g id='stat-header'>
    <text x='100' y='90' font-size='20' fill='var(--accent)' font-weight='600' font-family='Inter,Noto Sans SC,sans-serif'>📊 核心数据</text>
    <text x='100' y='130' font-size='42' font-weight='900' fill='var(--text-1)' font-family='Playfair Display,Noto Serif SC,serif'>数字见证热爱</text>
    <rect x='100' y='155' width='50' height='4' rx='2' fill='var(--accent)'/>
  </g>
  <g id='stat-main'>
    <rect x='100' y='220' width='1080' height='280' rx='24' fill='var(--surface)' stroke='var(--border)' stroke-width='1'/>
    <!-- 大数字 -->
    <text x='640' y='370' font-size='120' font-weight='900' fill='var(--accent)' text-anchor='middle' font-family='Playfair Display,Noto Serif SC,serif'>
      <tspan x='640' dy='0'>120,000</tspan>
    </text>
    <text x='640' y='425' font-size='56' font-weight='900' fill='var(--accent)' text-anchor='middle' font-family='Playfair Display,Noto Serif SC,serif'>
      <tspan x='640' dy='0'>+</tspan>
    </text>
    <text x='640' y='460' font-size='24' fill='var(--text-2)' text-anchor='middle' font-family='Inter,Noto Sans SC,sans-serif'>三日累计观众人次 ｜ 较上届增长 <tspan fill='var(--accent)' font-weight='bold'>35%</tspan></text>
  </g>
  <g id='stat-sub-items'>
    <!-- 子指标1 -->
    <rect x='125' y='530' width='310' height='130' rx='16' fill='var(--surface)' stroke='var(--border)' stroke-width='1'/>
    <text x='165' y='575' font-size='36' font-weight='bold' fill='var(--accent)' font-family='Inter,Noto Sans SC,sans-serif'>320+</text>
    <text x='165' y='610' font-size='17' fill='var(--text-2)' font-family='Inter,Noto Sans SC,sans-serif'>参展商 &amp; 同人社团</text>
    <!-- 子指标2 -->
    <rect x='485' y='530' width='310' height='130' rx='16' fill='var(--surface)' stroke='var(--border)' stroke-width='1'/>
    <text x='525' y='575' font-size='36' font-weight='bold' fill='var(--accent)' font-family='Inter,Noto Sans SC,sans-serif'>50+</text>
    <text x='525' y='610' font-size='17' fill='var(--text-2)' font-family='Inter,Noto Sans SC,sans-serif'>知名声优 &amp; 嘉宾</text>
    <!-- 子指标3 -->
    <rect x='845' y='530' width='310' height='130' rx='16' fill='var(--surface)' stroke='var(--border)' stroke-width='1'/>
    <text x='885' y='575' font-size='36' font-weight='bold' fill='var(--accent)' font-family='Inter,Noto Sans SC,sans-serif'>2,800</text>
    <text x='885' y='610' font-size='17' fill='var(--text-2)' font-family='Inter,Noto Sans SC,sans-serif'>平方米展区面积</text>
  </g>
  <g id='pagenumber'>
    <text x='1240' y='700' font-size='14' fill='var(--text-3)' text-anchor='end' font-family='Inter,Noto Sans SC,sans-serif'>04 / 10</text>
  </g>
</svg>