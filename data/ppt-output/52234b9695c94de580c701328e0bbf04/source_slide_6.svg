<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1280 720' data-theme='ghibli'>
  <defs>
    <linearGradient id='dividerGrad2' x1='0' y1='0' x2='1' y2='1'>
      <stop offset='0%' stop-color='var(--bg)'/>
      <stop offset='50%' stop-color='var(--surface)'/>
      <stop offset='100%' stop-color='var(--bg)'/>
    </linearGradient>
  </defs>
  <!-- notes: 章节分隔页——第二章"精彩活动"，巨型02数字与弧形装饰，营造从概览进入活动章节的过渡感 -->
  <g id='bg-layer'>
    <rect width='1280' height='720' fill='url(#dividerGrad2)'/>
  </g>
  <g id='decoration-clouds'>
    <g fill='var(--surface)' fill-opacity='0.45'>
      <ellipse cx='1160' cy='130' rx='100' ry='40'/>
      <ellipse cx='1230' cy='115' rx='65' ry='32'/>
    </g>
    <g fill='var(--surface)' fill-opacity='0.35'>
      <ellipse cx='80' cy='620' rx='110' ry='40'/>
      <ellipse cx='160' cy='600' rx='70' ry='30'/>
    </g>
  </g>
  <g id='decoration-arcs'>
    <path d='M80 330 Q340 260 640 330 Q940 400 1200 330' fill='none' stroke='var(--accent)' stroke-width='2' stroke-opacity='0.18'/>
    <path d='M160 400 Q400 340 640 400 Q880 460 1120 400' fill='none' stroke='var(--accent)' stroke-width='1.5' stroke-opacity='0.1'/>
  </g>
  <g id='decoration-stars'>
    <circle cx='200' cy='180' r='3' fill='var(--accent)' fill-opacity='0.3'/>
    <circle cx='1080' cy='520' r='2.5' fill='var(--accent)' fill-opacity='0.25'/>
    <circle cx='500' cy='160' r='2' fill='var(--accent)' fill-opacity='0.3'/>
  </g>
  <g id='section-number'>
    <text x='640' y='370' font-size='200' font-weight='900' fill='var(--accent)' fill-opacity='0.08' text-anchor='middle' font-family='Playfair Display,Noto Serif SC,serif'>02</text>
  </g>
  <g id='section-title'>
    <text x='640' y='350' font-size='24' fill='var(--accent)' font-weight='600' text-anchor='middle' font-family='Inter,Noto Sans SC,sans-serif' letter-spacing='6'>CHAPTER TWO</text>
    <text x='640' y='430' font-size='64' font-weight='900' fill='var(--text-1)' text-anchor='middle' font-family='Playfair Display,Noto Serif SC,serif'>精彩活动</text>
    <rect x='580' y='460' width='120' height='3' rx='1.5' fill='var(--accent)'/>
    <text x='640' y='510' font-size='20' fill='var(--text-2)' text-anchor='middle' font-family='Inter,Noto Sans SC,sans-serif'>舞台、互动与沉浸式体验的全方位盛宴</text>
  </g>
  <g id='pagenumber'>
    <text x='1240' y='700' font-size='14' fill='var(--text-3)' text-anchor='end' font-family='Inter,Noto Sans SC,sans-serif'>06 / 10</text>
  </g>
</svg>