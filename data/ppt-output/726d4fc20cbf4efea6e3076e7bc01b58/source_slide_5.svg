<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1280 720' data-theme='ghibli'>
  <defs>
    <linearGradient id='skyGrad5' x1='0' y1='0' x2='0' y2='1'>
      <stop offset='0%' stop-color='var(--bg)'/>
      <stop offset='100%' stop-color='var(--surface)'/>
    </linearGradient>
  </defs>
  <!-- notes: 四大亮点页——四宫格卡片展示漫展核心亮点：舞台阵容、同人市集、Cosplay大赛、IP联名。每张卡片有数字标签和简要描述 -->
  <g id='bg-layer'>
    <rect width='1280' height='720' fill='url(#skyGrad5)'/>
  </g>
  <g id='decoration-clouds'>
    <g fill='var(--surface)' fill-opacity='0.3'>
      <ellipse cx='180' cy='650' rx='100' ry='35'/>
      <ellipse cx='260' cy='635' rx='65' ry='28'/>
    </g>
  </g>
  <g id='kpi-header'>
    <text x='100' y='90' font-size='20' fill='var(--accent)' font-weight='600' font-family='Inter,Noto Sans SC,sans-serif'>✨ 四大亮点</text>
    <text x='100' y='130' font-size='42' font-weight='900' fill='var(--text-1)' font-family='Playfair Display,Noto Serif SC,serif'>本届不容错过</text>
    <rect x='100' y='155' width='50' height='4' rx='2' fill='var(--accent)'/>
  </g>
  <g id='kpi-grid'>
    <!-- 卡片1 -->
    <g>
      <rect x='100' y='220' width='510' height='200' rx='20' fill='var(--surface)' stroke='var(--border)' stroke-width='1'/>
      <circle cx='160' cy='290' r='32' fill='var(--accent)' fill-opacity='0.12'/>
      <text x='160' y='299' font-size='28' font-weight='bold' fill='var(--accent)' text-anchor='middle' font-family='Inter,Noto Sans SC,sans-serif'>🎤</text>
      <text x='215' y='280' font-size='26' font-weight='bold' fill='var(--text-1)' font-family='Inter,Noto Sans SC,sans-serif'>顶级声优阵容</text>
      <text x='215' y='315' font-size='16' fill='var(--text-2)' font-family='Inter,Noto Sans SC,sans-serif'>邀请中日知名声优登台献声</text>
      <text x='215' y='345' font-size='14' fill='var(--text-3)' font-family='Inter,Noto Sans SC,sans-serif'>现场配音演绎 · 粉丝互动环节</text>
      <text x='560' y='290' font-size='42' font-weight='900' fill='var(--accent)' text-anchor='end' font-family='Inter,Noto Sans SC,sans-serif'>12</text>
      <text x='560' y='320' font-size='14' fill='var(--text-3)' text-anchor='end' font-family='Inter,Noto Sans SC,sans-serif'>位嘉宾</text>
    </g>
    <!-- 卡片2 -->
    <g>
      <rect x='670' y='220' width='510' height='200' rx='20' fill='var(--surface)' stroke='var(--border)' stroke-width='1'/>
      <circle cx='730' cy='290' r='32' fill='var(--accent)' fill-opacity='0.12'/>
      <text x='730' y='299' font-size='28' font-weight='bold' fill='var(--accent)' text-anchor='middle' font-family='Inter,Noto Sans SC,sans-serif'>🎨</text>
      <text x='785' y='280' font-size='26' font-weight='bold' fill='var(--text-1)' font-family='Inter,Noto Sans SC,sans-serif'>同人创作市集</text>
      <text x='785' y='315' font-size='16' fill='var(--text-2)' font-family='Inter,Noto Sans SC,sans-serif'>汇聚全国优秀同人创作者</text>
      <text x='785' y='345' font-size='14' fill='var(--text-3)' font-family='Inter,Noto Sans SC,sans-serif'>原创画集 · 手作周边 · 限量贩售</text>
      <text x='1130' y='290' font-size='42' font-weight='900' fill='var(--accent)' text-anchor='end' font-family='Inter,Noto Sans SC,sans-serif'>200</text>
      <text x='1130' y='320' font-size='14' fill='var(--text-3)' text-anchor='end' font-family='Inter,Noto Sans SC,sans-serif'>个摊位</text>
    </g>
    <!-- 卡片3 -->
    <g>
      <rect x='100' y='460' width='510' height='200' rx='20' fill='var(--surface)' stroke='var(--border)' stroke-width='1'/>
      <circle cx='160' cy='530' r='32' fill='var(--accent)' fill-opacity='0.12'/>
      <text x='160' y='539' font-size='28' font-weight='bold' fill='var(--accent)' text-anchor='middle' font-family='Inter,Noto Sans SC,sans-serif'>👘</text>
      <text x='215' y='520' font-size='26' font-weight='bold' fill='var(--text-1)' font-family='Inter,Noto Sans SC,sans-serif'>Cosplay 盛典大赛</text>
      <text x='215' y='555' font-size='16' fill='var(--text-2)' font-family='Inter,Noto Sans SC,sans-serif'>全国 Coser 同台竞技，还原经典角色</text>
      <text x='215' y='585' font-size='14' fill='var(--text-3)' font-family='Inter,Noto Sans SC,sans-serif'>总奖金池 ¥100,000 · 冠亚季军评选</text>
      <text x='560' y='530' font-size='42' font-weight='900' fill='var(--accent)' text-anchor='end' font-family='Inter,Noto Sans SC,sans-serif'>500</text>
      <text x='560' y='560' font-size='14' fill='var(--text-3)' text-anchor='end' font-family='Inter,Noto Sans SC,sans-serif'>名参赛者</text>
    </g>
    <!-- 卡片4 -->
    <g>
      <rect x='670' y='460' width='510' height='200' rx='20' fill='var(--surface)' stroke='var(--border)' stroke-width='1'/>
      <circle cx='730' cy='530' r='32' fill='var(--accent)' fill-opacity='0.12'/>
      <text x='730' y='539' font-size='28' font-weight='bold' fill='var(--accent)' text-anchor='middle' font-family='Inter,Noto Sans SC,sans-serif'>🎬</text>
      <text x='785' y='520' font-size='26' font-weight='bold' fill='var(--text-1)' font-family='Inter,Noto Sans SC,sans-serif'>IP 联名限定展区</text>
      <text x='785' y='555' font-size='16' fill='var(--text-2)' font-family='Inter,Noto Sans SC,sans-serif'>多部热门动漫 IP 官方授权入驻</text>
      <text x='785' y='585' font-size='14' fill='var(--text-3)' font-family='Inter,Noto Sans SC,sans-serif'>限定周边首发 · 沉浸式打卡体验</text>
      <text x='1130' y='530' font-size='42' font-weight='900' fill='var(--accent)' text-anchor='end' font-family='Inter,Noto Sans SC,sans-serif'>8</text>
      <text x='1130' y='560' font-size='14' fill='var(--text-3)' text-anchor='end' font-family='Inter,Noto Sans SC,sans-serif'>大 IP 联名</text>
    </g>
  </g>
  <g id='pagenumber'>
    <text x='1240' y='700' font-size='14' fill='var(--text-3)' text-anchor='end' font-family='Inter,Noto Sans SC,sans-serif'>05 / 10</text>
  </g>
</svg>