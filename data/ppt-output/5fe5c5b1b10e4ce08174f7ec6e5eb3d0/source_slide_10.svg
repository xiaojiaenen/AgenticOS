<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1280 720' data-theme='cosmic'>
  <!-- notes: 数据对比——内行星用柱状图展示直径，外行星用数据卡片对比，让观众直观感受到体积的巨大差异 -->
  <g id='bg-layer'>
    <rect width='1280' height='720' fill='#ffffff'/>
  </g>
  <g id='stars-decor'>
    <circle cx='60' cy='60' r='1' fill='#abaeb3' fill-opacity='0.3'/>
    <circle cx='1220' cy='80' r='1.2' fill='#abaeb3' fill-opacity='0.4'/>
    <circle cx='80' cy='650' r='0.8' fill='#abaeb3' fill-opacity='0.3'/>
    <circle cx='1200' cy='600' r='1' fill='#abaeb3' fill-opacity='0.4'/>
  </g>
  <g id='page-header'>
    <text x='80' y='70' font-size='16' fill='#abaeb3' font-family='Inter,Noto Sans SC,sans-serif'>CHAPTER 03 · 行星大比拼</text>
    <text x='640' y='95' font-size='34' font-weight='800' fill='#111827' text-anchor='middle' font-family='Inter,Noto Sans SC,sans-serif'>行星数据大比拼</text>
    <text x='640' y='120' font-size='15' fill='#abaeb3' text-anchor='middle' font-family='Inter,Noto Sans SC,sans-serif'>PLANET COMPARISON — SIZE, DISTANCE &amp; SPEED</text>
    <rect x='550' y='130' width='180' height='2' fill='#3b82f6'/>
  </g>
  <!-- 内行星直径对比（柱状图） -->
  <g id='inner-chart-label'>
    <text x='120' y='175' font-size='15' font-weight='bold' fill='#111827' font-family='Inter,Noto Sans SC,sans-serif'>内行星直径对比 (km)</text>
  </g>
  <g id='inner-bars'>
    <!-- 水星: 4879 -->
    <text x='130' y='217' font-size='13' fill='#70747d' text-anchor='end' font-family='Inter,Noto Sans SC,sans-serif'>水星</text>
    <rect x='140' y='200' width='155' height='28' rx='4' fill='#BDBDBD'/>
    <text x='305' y='220' font-size='13' fill='#70747d' font-family='Inter,Noto Sans SC,sans-serif'>4,879 km</text>
    <!-- 金星: 12104 -->
    <text x='130' y='255' font-size='13' fill='#70747d' text-anchor='end' font-family='Inter,Noto Sans SC,sans-serif'>金星</text>
    <rect x='140' y='238' width='385' height='28' rx='4' fill='#E8C07A'/>
    <text x='535' y='258' font-size='13' fill='#70747d' font-family='Inter,Noto Sans SC,sans-serif'>12,104 km</text>
    <!-- 地球: 12756 -->
    <text x='130' y='293' font-size='13' fill='#70747d' text-anchor='end' font-family='Inter,Noto Sans SC,sans-serif'>地球</text>
    <rect x='140' y='276' width='405' height='28' rx='4' fill='#4A90D9'/>
    <text x='555' y='296' font-size='13' fill='#70747d' font-family='Inter,Noto Sans SC,sans-serif'>12,756 km</text>
    <!-- 火星: 6792 -->
    <text x='130' y='331' font-size='13' fill='#70747d' text-anchor='end' font-family='Inter,Noto Sans SC,sans-serif'>火星</text>
    <rect x='140' y='314' width='215' height='28' rx='4' fill='#D4735E'/>
    <text x='365' y='334' font-size='13' fill='#70747d' font-family='Inter,Noto Sans SC,sans-serif'>6,792 km</text>
  </g>
  <!-- 外行星数据卡片 -->
  <g id='outer-chart-label'>
    <text x='700' y='175' font-size='15' font-weight='bold' fill='#111827' font-family='Inter,Noto Sans SC,sans-serif'>外行星数据对比</text>
  </g>
  <g id='outer-comparison'>
    <!-- 木星 -->
    <rect x='660' y='195' width='270' height='150' rx='12' fill='#f9f9f9' stroke='#c3c5c9' stroke-width='0.5'/>
    <circle cx='690' cy='230' r='18' fill='#D4A574'/>
    <text x='720' y='225' font-size='17' font-weight='bold' fill='#111827' font-family='Inter,Noto Sans SC,sans-serif'>木星</text>
    <text x='720' y='245' font-size='12' fill='#abaeb3' font-family='Inter,Noto Sans SC,sans-serif'>142,984 km</text>
    <text x='680' y='280' font-size='13' fill='#70747d' font-family='Inter,Noto Sans SC,sans-serif'>🪐 直径是地球的<tspan font-weight='bold' fill='#3b82f6'>11.2倍</tspan></text>
    <text x='680' y='305' font-size='13' fill='#70747d' font-family='Inter,Noto Sans SC,sans-serif'>⚡ 质量是其他行星总和的2.5倍</text>
    <text x='680' y='330' font-size='12' fill='#abaeb3' font-family='Inter,Noto Sans SC,sans-serif'>🛎 1天 ≈ 9.93小时</text>
    <!-- 土星 -->
    <rect x='950' y='195' width='270' height='150' rx='12' fill='#f9f9f9' stroke='#c3c5c9' stroke-width='0.5'/>
    <circle cx='980' cy='230' r='16' fill='#E8D5A3'/>
    <ellipse cx='980' cy='230' rx='26' ry='5' fill='none' stroke='#C8B57A' stroke-width='1.5' transform='rotate(-18 980 230)'/>
    <text x='1010' y='225' font-size='17' font-weight='bold' fill='#111827' font-family='Inter,Noto Sans SC,sans-serif'>土星</text>
    <text x='1010' y='245' font-size='12' fill='#abaeb3' font-family='Inter,Noto Sans SC,sans-serif'>120,536 km</text>
    <text x='970' y='280' font-size='13' fill='#70747d' font-family='Inter,Noto Sans SC,sans-serif'>🪐 密度&lt;水 · 可以浮在水上</text>
    <text x='970' y='305' font-size='13' fill='#70747d' font-family='Inter,Noto Sans SC,sans-serif'>⭕ 环直径达 28万 km</text>
    <text x='970' y='330' font-size='12' fill='#abaeb3' font-family='Inter,Noto Sans SC,sans-serif'>🛎 146颗卫星 · 太阳系最多</text>
    <!-- 天王星 -->
    <rect x='660' y='365' width='270' height='150' rx='12' fill='#f9f9f9' stroke='#c3c5c9' stroke-width='0.5'/>
    <circle cx='690' cy='400' r='12' fill='#7EC8E3'/>
    <text x='720' y='395' font-size='17' font-weight='bold' fill='#111827' font-family='Inter,Noto Sans SC,sans-serif'>天王星</text>
    <text x='720' y='415' font-size='12' fill='#abaeb3' font-family='Inter,Noto Sans SC,sans-serif'>51,118 km</text>
    <text x='680' y='450' font-size='13' fill='#70747d' font-family='Inter,Noto Sans SC,sans-serif'>🔄 自转轴倾斜<tspan font-weight='bold' fill='#3b82f6'>98°</tspan> · 侧躺旋转</text>
    <text x='680' y='475' font-size='13' fill='#70747d' font-family='Inter,Noto Sans SC,sans-serif'>💨 大气含甲烷呈蓝绿色</text>
    <text x='680' y='500' font-size='12' fill='#abaeb3' font-family='Inter,Noto Sans SC,sans-serif'>🛎 公转一圈 = 84地球年</text>
    <!-- 海王星 -->
    <rect x='950' y='365' width='270' height='150' rx='12' fill='#f9f9f9' stroke='#c3c5c9' stroke-width='0.5'/>
    <circle cx='980' cy='400' r='11' fill='#4A6FE8'/>
    <text x='1010' y='395' font-size='17' font-weight='bold' fill='#111827' font-family='Inter,Noto Sans SC,sans-serif'>海王星</text>
    <text x='1010' y='415' font-size='12' fill='#abaeb3' font-family='Inter,Noto Sans SC,sans-serif'>49,528 km</text>
    <text x='970' y='450' font-size='13' fill='#70747d' font-family='Inter,Noto Sans SC,sans-serif'>🌪️ 太阳系风速最快</text>
    <text x='970' y='475' font-size='13' fill='#70747d' font-family='Inter,Noto Sans SC,sans-serif'><tspan font-weight='bold' fill='#d97706'>2,100 km/h</tspan> 飓风肆虐</text>
    <text x='970' y='500' font-size='12' fill='#abaeb3' font-family='Inter,Noto Sans SC,sans-serif'>🛎 被数学计算预言发现</text>
  </g>
  <!-- 一个大"比例尺"提示 -->
  <g id='scale-note'>
    <rect x='140' y='365' width='405' height='28' rx='4' fill='#f9f9f9' stroke='#c3c5c9' stroke-width='0.5'/>
    <text x='343' y='383' font-size='13' fill='#abaeb3' text-anchor='middle' font-family='Inter,Noto Sans SC,sans-serif'>⚠️ 如果木星是篮球大小，地球就是一颗豌豆</text>
  </g>
  <g id='footer' chrome='true'>
    <text x='640' y='690' font-size='14' fill='#abaeb3' text-anchor='middle' font-family='Inter,Noto Sans SC,sans-serif'>10 / 12</text>
  </g>
</svg>