<svg xmlns='http://www.w3.org/2000/svg' viewBox="0 0 1280 720" data-theme='openai'>
  <g id='bg-layer'>
    <rect width='1280' height='720' fill='#ffffff'/>
    <rect x='0' y='0' width='1280' height='4' fill='#10a37f'/>
  </g>
  <g id='page-header' font-family='Inter,Noto Sans SC,sans-serif'>
    <text x='80' y='80' font-size='14' fill='#10a37f' font-weight='600' letter-spacing='2'>CHAPTER 01 · 使命与愿景</text>
    <text x='80' y='130' font-size='42' font-weight='800' fill='#0d0d0d'>OpenAI 发展历程</text>
    <rect x='80' y='155' width='50' height='3' fill='#10a37f'/>
  </g>
  <g id='timeline-line'>
    <line x1='120' y1='230' x2='120' y2='650' stroke='#e5e5e5' stroke-width='2'/>
  </g>
  <g id='milestone-1' font-family='Inter,Noto Sans SC,sans-serif'>
    <circle cx='120' cy='250' r='10' fill='#10a37f'/>
    <text x='160' y='246' font-size='14' fill='#10a37f' font-weight='600'>2015</text>
    <text x='160' y='270' font-size='14' fill='#1a1a1a'>OpenAI 在旧金山创立，使命宣言：</text>
    <text x='160' y='290' font-size='14' fill='#1a1a1a'>"确保 AGI 惠及全人类"</text>
  </g>
  <g id='milestone-2' font-family='Inter,Noto Sans SC,sans-serif'>
    <circle cx='120' cy='335' r='10' fill='#10a37f'/>
    <text x='160' y='331' font-size='14' fill='#10a37f' font-weight='600'>2018</text>
    <text x='160' y='355' font-size='14' fill='#1a1a1a'>发布 GPT-1（1.17 亿参数），</text>
    <text x='160' y='375' font-size='14' fill='#1a1a1a'>开启生成式预训练模型时代</text>
  </g>
  <g id='milestone-3' font-family='Inter,Noto Sans SC,sans-serif'>
    <circle cx='120' cy='420' r='10' fill='#10a37f'/>
    <text x='160' y='416' font-size='14' fill='#10a37f' font-weight='600'>2020</text>
    <text x='160' y='440' font-size='14' fill='#1a1a1a'>GPT-3（1750 亿参数）震撼发布，</text>
    <text x='160' y='460' font-size='14' fill='#1a1a1a'>能力大幅度提升，引发行业震动</text>
  </g>
  <g id='milestone-4' font-family='Inter,Noto Sans SC,sans-serif'>
    <circle cx='120' cy='505' r='10' fill='#10a37f'/>
    <text x='160' y='501' font-size='14' fill='#10a37f' font-weight='600'>2022.11</text>
    <text x='160' y='525' font-size='14' fill='#1a1a1a'>ChatGPT 上线，5 天注册 100 万用户，</text>
    <text x='160' y='545' font-size='14' fill='#1a1a1a'>两个月突破 1 亿用户，史上最快</text>
  </g>
  <g id='milestone-5' font-family='Inter,Noto Sans SC,sans-serif'>
    <circle cx='120' cy='590' r='10' fill='#10a37f'/>
    <text x='160' y='586' font-size='14' fill='#10a37f' font-weight='600'>2023-2024</text>
    <text x='160' y='610' font-size='14' fill='#1a1a1a'>GPT-4 · GPT-4o · Sora · o1 推理模型</text>
    <text x='160' y='630' font-size='14' fill='#1a1a1a'>多模态能力全面爆发</text>
  </g>
  <g id='footer' text-anchor='end' font-family='Inter,Noto Sans SC,sans-serif'>
    <text x='1240' y='690' font-size='14' fill='#9b9b9b'>4 / 11</text>
  </g>
  <!-- notes: 时间线展示 OpenAI 从 2015 年创立到 2024 年的关键节点。重点强调节奏——前面 5 年只有 2 个节点，2020 年后加速爆发。演讲时可以引导注意力："注意看，从 GPT-3 到 ChatGPT 只用了两年，但用户增长曲线超过了历史上任何产品。" -->
</svg>