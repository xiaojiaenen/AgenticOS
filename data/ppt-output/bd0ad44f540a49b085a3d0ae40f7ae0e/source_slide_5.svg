<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1280 720' data-theme='neon'>
  <defs>
    <filter id='glowDot5' x='-50%' y='-50%' width='200%' height='200%'>
      <feGaussianBlur in='SourceGraphic' stdDeviation='4'/>
    </filter>
  </defs>
  <g id='bg-layer'>
    <rect width='1280' height='720' fill='#ffffff'/>
    <line x1='0' y1='360' x2='1280' y2='360' stroke='#bbf351' stroke-opacity='0.03' stroke-width='1'/>
    <circle cx='1280' cy='0' r='350' fill='#00bcff' fill-opacity='0.03'/>
  </g>
  <g id='decor-dots'>
    <circle cx='120' cy='130' r='2' fill='#bbf351' fill-opacity='0.25' filter='url(#glowDot5)'/>
    <circle cx='1160' cy='180' r='2.5' fill='#00bcff' fill-opacity='0.2' filter='url(#glowDot5)'/>
    <path d='M280,100 Q286,93 292,100 Q286,107 280,100 Z' fill='#bbf351' fill-opacity='0.25'/>
    <path d='M1050,120 Q1058,112 1066,120 Q1058,128 1050,120 Z' fill='#00bcff' fill-opacity='0.2'/>
  </g>
  <g id='page-header'>
    <text x='80' y='80' font-size='13' fill='#abaeb3' font-family='Inter,Noto Sans SC,sans-serif' letter-spacing='3'>展区规划</text>
    <rect x='80' y='95' width='40' height='2' rx='1' fill='#bbf351'/>
  </g>
  <g id='section-title'>
    <text x='80' y='165' font-size='38' font-weight='800' fill='#111827' font-family='Inter,Noto Sans SC,sans-serif'>
      三大主题展区
    </text>
    <text x='80' y='200' font-size='15' fill='#70747d' font-family='Inter,Noto Sans SC,sans-serif'>从经典到前沿，沉浸式体验二次元文化</text>
  </g>
  <!-- 三个展区卡片 -->
  <g id='zone-cards' font-family='Inter,Noto Sans SC,sans-serif'>
    <!-- 展区 1 -->
    <g transform='translate(80, 260)'>
      <rect width='360' height='400' rx='12' fill='#f9f9f9' stroke='#c3c5c9' stroke-width='1'/>
      <rect x='0' y='0' width='360' height='4' rx='2' fill='#bbf351'/>
      <rect x='20' y='40' width='320' height='1' fill='#c3c5c9'/>
      <circle cx='50' cy='65' r='20' fill='#bbf351' fill-opacity='0.1'/>
      <text x='50' y='72' text-anchor='middle' font-size='16' font-weight='900' fill='#bbf351'>01</text>
      <text x='90' y='72' font-size='20' font-weight='700' fill='#111827'>吉卜力经典</text>
      <text x='20' y='110' font-size='12' fill='#bbf351' font-weight='600' letter-spacing='2'>宫崎骏动画世界</text>
      <circle cx='30' cy='155' r='2.5' fill='#bbf351' fill-opacity='0.6'/>
      <text x='45' y='160' font-size='14' fill='#70747d'>《千与千寻》沉浸式场景</text>
      <circle cx='30' cy='195' r='2.5' fill='#bbf351' fill-opacity='0.6'/>
      <text x='45' y='200' font-size='14' fill='#70747d'>《龙猫》森林漫步体验</text>
      <circle cx='30' cy='235' r='2.5' fill='#bbf351' fill-opacity='0.6'/>
      <text x='45' y='240' font-size='14' fill='#70747d'>《天空之城》原画展</text>
      <circle cx='30' cy='275' r='2.5' fill='#bbf351' fill-opacity='0.6'/>
      <text x='45' y='280' font-size='14' fill='#70747d'>《哈尔的移动城堡》装置</text>
      <circle cx='30' cy='315' r='2.5' fill='#bbf351' fill-opacity='0.6'/>
      <text x='45' y='320' font-size='14' fill='#70747d'>吉卜力周边限定商店</text>
      <rect x='20' y='355' width='80' height='24' rx='12' fill='none' stroke='#bbf351' stroke-width='1'/>
      <text x='60' y='372' text-anchor='middle' font-size='11' fill='#bbf351' font-weight='600'>经典必看</text>
    </g>
    <!-- 展区 2 -->
    <g transform='translate(460, 260)'>
      <rect width='360' height='400' rx='12' fill='#f9f9f9' stroke='#c3c5c9' stroke-width='1'/>
      <rect x='0' y='0' width='360' height='4' rx='2' fill='#00bcff'/>
      <rect x='20' y='40' width='320' height='1' fill='#c3c5c9'/>
      <circle cx='50' cy='65' r='20' fill='#00bcff' fill-opacity='0.1'/>
      <text x='50' y='72' text-anchor='middle' font-size='16' font-weight='900' fill='#00bcff'>02</text>
      <text x='90' y='72' font-size='20' font-weight='700' fill='#111827'>二次元新浪潮</text>
      <text x='20' y='110' font-size='12' fill='#00bcff' font-weight='600' letter-spacing='2'>当代动漫文化</text>
      <circle cx='30' cy='155' r='2.5' fill='#00bcff' fill-opacity='0.6'/>
      <text x='45' y='160' font-size='14' fill='#70747d'>热门番剧主题展区</text>
      <circle cx='30' cy='195' r='2.5' fill='#00bcff' fill-opacity='0.6'/>
      <text x='45' y='200' font-size='14' fill='#70747d'>Cosplay 表演大舞台</text>
      <circle cx='30' cy='235' r='2.5' fill='#00bcff' fill-opacity='0.6'/>
      <text x='45' y='240' font-size='14' fill='#70747d'>同人创作市集</text>
      <circle cx='30' cy='275' r='2.5' fill='#00bcff' fill-opacity='0.6'/>
      <text x='45' y='280' font-size='14' fill='#70747d'>声优见面会专区</text>
      <circle cx='30' cy='315' r='2.5' fill='#00bcff' fill-opacity='0.6'/>
      <text x='45' y='320' font-size='14' fill='#70747d'>VR 互动体验区</text>
      <rect x='20' y='355' width='80' height='24' rx='12' fill='none' stroke='#00bcff' stroke-width='1'/>
      <text x='60' y='372' text-anchor='middle' font-size='11' fill='#00bcff' font-weight='600'>潮流打卡</text>
    </g>
    <!-- 展区 3 -->
    <g transform='translate(840, 260)'>
      <rect width='360' height='400' rx='12' fill='#f9f9f9' stroke='#c3c5c9' stroke-width='1'/>
      <rect x='0' y='0' width='360' height='4' rx='2' fill='#bbf351' fill-opacity='0.6'/>
      <rect x='20' y='40' width='320' height='1' fill='#c3c5c9'/>
      <circle cx='50' cy='65' r='20' fill='#bbf351' fill-opacity='0.1'/>
      <text x='50' y='72' text-anchor='middle' font-size='16' font-weight='900' fill='#bbf351' fill-opacity='0.7'>03</text>
      <text x='90' y='72' font-size='20' font-weight='700' fill='#111827'>创作与交流</text>
      <text x='20' y='110' font-size='12' fill='#bbf351' fill-opacity='0.7' font-weight='600' letter-spacing='2'>深度体验</text>
      <circle cx='30' cy='155' r='2.5' fill='#bbf351' fill-opacity='0.6'/>
      <text x='45' y='160' font-size='14' fill='#70747d'>动画制作工作坊</text>
      <circle cx='30' cy='195' r='2.5' fill='#bbf351' fill-opacity='0.6'/>
      <text x='45' y='200' font-size='14' fill='#70747d'>插画师现场签绘</text>
      <circle cx='30' cy='235' r='2.5' fill='#bbf351' fill-opacity='0.6'/>
      <text x='45' y='240' font-size='14' fill='#70747d'>行业大咖分享会</text>
      <circle cx='30' cy='275' r='2.5' fill='#bbf351' fill-opacity='0.6'/>
      <text x='45' y='280' font-size='14' fill='#70747d'>原创 IP 孵化路演</text>
      <circle cx='30' cy='315' r='2.5' fill='#bbf351' fill-opacity='0.6'/>
      <text x='45' y='320' font-size='14' fill='#70747d'>动漫音乐 Live 现场</text>
      <rect x='20' y='355' width='80' height='24' rx='12' fill='none' stroke='#bbf351' stroke-width='1'/>
      <text x='60' y='372' text-anchor='middle' font-size='11' fill='#bbf351' fill-opacity='0.7' font-weight='600'>深度体验</text>
    </g>
  </g>
  <g id='footer' font-family='Inter,Noto Sans SC,sans-serif'>
    <text x='1240' y='690' font-size='12' fill='#abaeb3' text-anchor='end'>05 / 11</text>
  </g>
  <!-- notes: 三大展区——"经典区、潮流区、创作区，三大板块各有各的玩法。" -->
</svg>