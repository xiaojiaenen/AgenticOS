<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1280 720' data-theme='stripe'>
  <!-- notes: 结尾页——行动号召。深蓝色CTA按钮突出 -->
  <g id="bg-layer">
    <rect width='1280' height='720' fill='#ffffff'/>
  </g>
  <g id="close-decor">
    <rect x='0' y='0' width='1280' height='6' fill='#533afd'/>
  </g>
  <g id="cta-title">
    <text x='640' y='240' font-size='20' fill='#533afd' font-weight='600' letter-spacing='4' text-anchor='middle'>开始你的 DeepSeek 之旅</text>
    <text x='640' y='340' font-size='56' font-weight='800' fill='#061b31' text-anchor='middle'>探索智能的</text>
    <text x='640' y='415' font-size='56' font-weight='800' fill='#533afd' text-anchor='middle'>无限可能</text>
  </g>
  <g id="cta-button">
    <rect x='490' y='480' width='300' height='60' rx='30' fill='#533afd'/>
    <text x='640' y='518' font-size='20' font-weight='700' fill='#ffffff' text-anchor='middle'>访问 chat.deepseek.com →</text>
  </g>
  <g id="cta-links">
    <text x='640' y='590' font-size='16' fill='#64748d' text-anchor='middle'>或扫描二维码 · 在 App Store / Google Play 搜索 "DeepSeek"</text>
  </g>
  <g id="cta-social">
    <text x='640' y='640' font-size='14' fill='#64748d' text-anchor='middle'>deepseek.com · @DeepSeek · 深度求索</text>
  </g>
  <g id="footer">
    <text x='640' y='690' font-size='14' fill='#64748d' text-anchor='middle'>11 / 11 · 感谢聆听</text>
  </g>
</svg>