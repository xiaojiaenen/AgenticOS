<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1280 720' data-theme='cosmic'>
  <g id='bg-layer'>
    <rect width='1280' height='720' fill='#ffffff'/>
    <!-- 星空 -->
    <circle cx='150' cy='150' r='1.5' fill='#abaeb3' fill-opacity='0.6'/>
    <circle cx='300' cy='80' r='1' fill='#abaeb3' fill-opacity='0.4'/>
    <circle cx='800' cy='120' r='2' fill='#abaeb3' fill-opacity='0.5'/>
    <circle cx='1150' cy='200' r='1' fill='#abaeb3' fill-opacity='0.4'/>
    <circle cx='100' cy='450' r='1.5' fill='#abaeb3' fill-opacity='0.3'/>
    <circle cx='500' cy='600' r='1' fill='#abaeb3' fill-opacity='0.4'/>
    <circle cx='1100' cy='550' r='2' fill='#abaeb3' fill-opacity='0.5'/>
    <circle cx='1200' cy='400' r='1' fill='#abaeb3' fill-opacity='0.3'/>
  </g>
  <g id='section-number'>
    <text x='120' y='320' font-family='Inter,Noto Sans SC,sans-serif' font-size='120' font-weight='200' fill='#3b82f6' fill-opacity='0.15'>01</text>
    <rect x='120' y='345' width='80' height='3' fill='#3b82f6'/>
  </g>
  <g id='section-title'>
    <text x='120' y='420' font-family='Inter,Noto Sans SC,sans-serif' font-size='56' font-weight='800' fill='#111827'>太阳系概况</text>
    <text x='120' y='480' font-family='Inter,Noto Sans SC,sans-serif' font-size='22' fill='#abaeb3'>The Solar System · 46亿年的宇宙奇迹</text>
  </g>
  <g id='section-sub'>
    <text x='120' y='550' font-family='Inter,Noto Sans SC,sans-serif' font-size='18' fill='#70747d'>从太阳出发，探索我们所在的这个恒星系统</text>
  </g>
  <!-- notes: 章节分隔页——01 太阳系概况，用大字号编号和柔和星空过渡，给观众一个"深吸一口气"的节奏缓冲。 -->
</svg>