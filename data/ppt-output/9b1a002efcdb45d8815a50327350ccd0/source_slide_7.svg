<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1280 720' data-theme='cosmic'>
  <g id='bg-layer'>
    <rect width='1280' height='720' fill='#ffffff'/>
    <circle cx='200' cy='120' r='1.5' fill='#abaeb3' fill-opacity='0.5'/>
    <circle cx='1100' cy='80' r='1' fill='#abaeb3' fill-opacity='0.4'/>
    <circle cx='50' cy='500' r='2' fill='#abaeb3' fill-opacity='0.5'/>
    <circle cx='1200' cy='550' r='1' fill='#abaeb3' fill-opacity='0.3'/>
  </g>
  <g id='section-number'>
    <text x='120' y='320' font-family='Inter,Noto Sans SC,sans-serif' font-size='120' font-weight='200' fill='#3b82f6' fill-opacity='0.15'>03</text>
    <rect x='120' y='345' width='80' height='3' fill='#3b82f6'/>
  </g>
  <g id='section-title'>
    <text x='120' y='420' font-family='Inter,Noto Sans SC,sans-serif' font-size='56' font-weight='800' fill='#111827'>气态巨行星</text>
    <text x='120' y='480' font-family='Inter,Noto Sans SC,sans-serif' font-size='22' fill='#abaeb3'>Gas Giants · 大气层深处的星际巨兽</text>
  </g>
  <g id='section-sub'>
    <text x='120' y='550' font-family='Inter,Noto Sans SC,sans-serif' font-size='18' fill='#70747d'>木星 · 土星 · 天王星 · 海王星——太阳系的外围巨无霸</text>
  </g>
  <g id='decor-rings'>
    <ellipse cx='1000' cy='380' rx='100' ry='25' fill='none' stroke='#3b82f6' stroke-width='0.8' stroke-opacity='0.2'/>
    <ellipse cx='1000' cy='380' rx='75' ry='18' fill='none' stroke='#3b82f6' stroke-width='0.5' stroke-opacity='0.15'/>
    <circle cx='1000' cy='380' r='12' fill='#3b82f6' fill-opacity='0.12'/>
  </g>
  <!-- notes: 章节分隔页——03 气态巨行星。轨道环装饰暗示土星特征，为介绍四颗巨型行星做铺垫。 -->
</svg>