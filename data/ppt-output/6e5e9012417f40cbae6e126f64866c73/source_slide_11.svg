<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1280 720' data-theme='cosmic'>
  <g id='bg-layer'>
    <rect width='1280' height='720' fill='#ffffff'/>
    <!-- 更多星星 -->
    <circle cx='180' cy='100' r='1.5' fill='#abaeb3' fill-opacity='0.6'/>
    <circle cx='360' cy='50' r='1' fill='#abaeb3' fill-opacity='0.4'/>
    <circle cx='900' cy='80' r='2' fill='#abaeb3' fill-opacity='0.5'/>
    <circle cx='1100' cy='180' r='1' fill='#abaeb3' fill-opacity='0.3'/>
    <circle cx='100' cy='400' r='1.5' fill='#abaeb3' fill-opacity='0.4'/>
    <circle cx='1200' cy='500' r='1' fill='#abaeb3' fill-opacity='0.5'/>
    <circle cx='300' cy='650' r='1' fill='#abaeb3' fill-opacity='0.3'/>
    <circle cx='1050' cy='600' r='2' fill='#abaeb3' fill-opacity='0.4'/>
    <circle cx='500' cy='150' r='1' fill='#abaeb3' fill-opacity='0.3'/>
    <circle cx='700' cy='650' r='1.5' fill='#abaeb3' fill-opacity='0.4'/>
  </g>
  <g id='page-decoration'>
    <rect x='0' y='0' width='1280' height='3' fill='#3b82f6'/>
    <!-- 银河装饰 -->
    <ellipse cx='640' cy='360' rx='500' ry='200' fill='none' stroke='#3b82f6' stroke-width='0.3' stroke-opacity='0.08'/>
    <ellipse cx='640' cy='360' rx='420' ry='160' fill='none' stroke='#3b82f6' stroke-width='0.3' stroke-opacity='0.05'/>
  </g>
  <g id='quote-mark'>
    <text x='120' y='260' font-family='Playfair Display,Noto Serif SC,serif' font-size='96' fill='#3b82f6' fill-opacity='0.2'>"</text>
  </g>
  <g id='quote-text'>
    <text x='160' y='340' font-family='Playfair Display,Noto Serif SC,serif' font-size='36' font-weight='500' fill='#111827'>
      在广袤的宇宙空间中，
      <tspan x='160' dy='55'>我们只是一个小小的舞台。</tspan>
      <tspan x='160' dy='65' font-family='Inter,Noto Sans SC,sans-serif' font-size='22' fill='#70747d' font-weight='400'>想想那些比我们的太阳还要明亮的恒星，</tspan>
      <tspan x='160' dy='42' font-family='Inter,Noto Sans SC,sans-serif' font-size='22' fill='#70747d' font-weight='400'>想想那些在黑暗中穿行的巨大行星……</tspan>
    </text>
  </g>
  <g id='quote-author'>
    <rect x='160' y='540' width='60' height='2' fill='#3b82f6'/>
    <text x='240' y='555' font-family='Inter,Noto Sans SC,sans-serif' font-size='20' font-weight='600' fill='#111827'>卡尔·萨根</text>
    <text x='240' y='580' font-family='Inter,Noto Sans SC,sans-serif' font-size='15' fill='#abaeb3'>Carl Sagan · 天文学家</text>
  </g>
  <g id='footer'>
    <rect x='80' y='698' width='40' height='2' fill='#3b82f6'/>
    <text x='135' y='708' font-family='Inter,Noto Sans SC,sans-serif' font-size='12' fill='#abaeb3'>11 / 12</text>
  </g>
  <!-- notes: 金句页——卡尔·萨根《暗淡蓝点》中的经典段落。用这句名言给观众一个情感升华的时刻，从数据回归到对宇宙的敬畏。慢读，留白。 -->
</svg>