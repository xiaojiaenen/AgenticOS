<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1280 720' data-theme='cosmic'>
  <defs>
    <radialGradient id='dividerGlow' cx='50%' cy='50%' r='55%'>
      <stop offset='0%' stop-color='#3b82f6' stop-opacity='0.15'/>
      <stop offset='100%' stop-color='#ffffff' stop-opacity='0'/>
    </radialGradient>
    <filter id='glowBig' x='-50%' y='-50%' width='200%' height='200%'>
      <feGaussianBlur in='SourceGraphic' stdDeviation='8'/>
    </filter>
  </defs>
  <!-- notes: 章节分隔页——深空背景+巨大数字，视觉上给观众"翻篇"的信号，宣告进入太阳系章节 -->
  <g id='bg-layer'>
    <rect width='1280' height='720' fill='#ffffff'/>
    <rect width='1280' height='720' fill='url(#dividerGlow)'/>
  </g>
  <g id='stars-decor'>
    <circle cx='80' cy='120' r='1.5' fill='#abaeb3' fill-opacity='0.5'/>
    <circle cx='250' cy='60' r='1' fill='#abaeb3' fill-opacity='0.3'/>
    <circle cx='1000' cy='80' r='2' fill='#abaeb3' fill-opacity='0.6'/>
    <circle cx='1180' cy='150' r='1' fill='#abaeb3' fill-opacity='0.4'/>
    <circle cx='150' cy='500' r='1.2' fill='#abaeb3' fill-opacity='0.3'/>
    <circle cx='1100' cy='580' r='1.5' fill='#abaeb3' fill-opacity='0.5'/>
    <circle cx='50' cy='650' r='0.8' fill='#abaeb3' fill-opacity='0.4'/>
    <circle cx='1230' cy='400' r='1.3' fill='#abaeb3' fill-opacity='0.3'/>
    <circle cx='700' cy='50' r='1' fill='#abaeb3' fill-opacity='0.5'/>
    <circle cx='500' cy='650' r='0.7' fill='#abaeb3' fill-opacity='0.3'/>
  </g>
  <g id='section-number'>
    <text x='640' y='420' font-size='240' font-weight='900' fill='#3b82f6' fill-opacity='0.08' text-anchor='middle' font-family='Inter,Noto Sans SC,sans-serif'>01</text>
  </g>
  <g id='section-content'>
    <text x='640' y='200' font-size='18' fill='#3b82f6' font-weight='600' text-anchor='middle' font-family='Inter,Noto Sans SC,sans-serif' letter-spacing='6'>CHAPTER 01</text>
    <rect x='540' y='230' width='200' height='2' fill='#3b82f6' fill-opacity='0.5'/>
    <text x='640' y='340' font-size='64' font-weight='800' fill='#111827' text-anchor='middle' font-family='Inter,Noto Sans SC,sans-serif'>
      <tspan x='640' dy='0'>太阳系</tspan>
      <tspan x='640' dy='75' fill='#3b82f6'>大家庭</tspan>
    </text>
    <text x='640' y='530' font-size='20' fill='#70747d' text-anchor='middle' font-family='Inter,Noto Sans SC,sans-serif'>太阳 · 行星 · 卫星 · 小行星 · 彗星 · 46亿年的宇宙之舞</text>
  </g>
  <g id='orbit-ring'>
    <ellipse cx='640' cy='550' rx='350' ry='30' fill='none' stroke='#3b82f6' stroke-opacity='0.06' stroke-width='1'/>
    <ellipse cx='640' cy='550' rx='250' ry='22' fill='none' stroke='#3b82f6' stroke-opacity='0.04' stroke-width='1'/>
    <circle cx='640' cy='550' r='4' fill='#3b82f6' fill-opacity='0.4' filter='url(#glowBig)'/>
  </g>
  <g id='footer' chrome='true'>
    <text x='640' y='690' font-size='14' fill='#abaeb3' text-anchor='middle' font-family='Inter,Noto Sans SC,sans-serif'>3 / 12</text>
  </g>
</svg>