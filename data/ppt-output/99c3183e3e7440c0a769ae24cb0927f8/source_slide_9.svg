<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1280 720' data-theme='cosmic'>
  <defs>
    <radialGradient id='plutoGlow' cx='50%' cy='50%' r='50%'>
      <stop offset='0%' stop-color='#3b82f6' stop-opacity='0.08'/>
      <stop offset='100%' stop-color='#ffffff' stop-opacity='0'/>
    </radialGradient>
    <filter id='glowPluto' x='-50%' y='-50%' width='200%' height='200%'>
      <feGaussianBlur in='SourceGraphic' stdDeviation='3'/>
    </filter>
  </defs>
  <!-- notes: 冥王星的故事——2006年国际天文学联合会重新定义"行星"，冥王星被降级为矮行星。用金句和爱心符号表达人们对冥王星的情感 -->
  <g id='bg-layer'>
    <rect width='1280' height='720' fill='#ffffff'/>
    <rect width='1280' height='720' fill='url(#plutoGlow)'/>
  </g>
  <g id='stars-decor'>
    <circle cx='60' cy='60' r='1' fill='#abaeb3' fill-opacity='0.3'/>
    <circle cx='1220' cy='80' r='1.5' fill='#abaeb3' fill-opacity='0.5'/>
    <circle cx='80' cy='600' r='1' fill='#abaeb3' fill-opacity='0.4'/>
    <circle cx='1200' cy='550' r='1.2' fill='#abaeb3' fill-opacity='0.3'/>
    <circle cx='350' cy='50' r='0.8' fill='#abaeb3' fill-opacity='0.3'/>
    <circle cx='900' cy='60' r='1' fill='#abaeb3' fill-opacity='0.4'/>
  </g>
  <g id='page-header'>
    <text x='80' y='70' font-size='16' fill='#abaeb3' font-family='Inter,Noto Sans SC,sans-serif'>CHAPTER 02 · 从九大到八大</text>
  </g>
  <g id='pluto-visual'>
    <circle cx='640' cy='300' r='45' fill='#D4B896' fill-opacity='0.8'/>
    <circle cx='640' cy='300' r='40' fill='#C8A878'/>
    <!-- 冥王星上的心形区域（汤博区） -->
    <circle cx='630' cy='295' r='10' fill='#E0C898' fill-opacity='0.6'/>
    <circle cx='648' cy='290' r='8' fill='#E0C898' fill-opacity='0.5'/>
    <!-- 卡戎（冥卫一） -->
    <circle cx='700' cy='280' r='15' fill='#A89878'/>
  </g>
  <g id='quote-content'>
    <!-- 大引号 -->
    <text x='200' y='280' font-size='120' font-weight='900' fill='#3b82f6' fill-opacity='0.15' font-family='Georgia,serif'>"</text>
    <text x='340' y='400' font-size='34' font-weight='bold' fill='#111827' text-anchor='middle' font-family='Inter,Noto Sans SC,sans-serif'>
      <tspan x='640' dy='0'>冥王星并没有变，</tspan>
      <tspan x='640' dy='55' fill='#3b82f6'>改变的是我们对"行星"的定义。</tspan>
    </text>
    <text x='640' y='520' font-size='16' fill='#70747d' text-anchor='middle' font-family='Inter,Noto Sans SC,sans-serif'>—— 2006 年国际天文学联合会（IAU）重新定义行星</text>
  </g>
  <g id='pluto-facts'>
    <text x='640' y='570' font-size='15' fill='#70747d' text-anchor='middle' font-family='Inter,Noto Sans SC,sans-serif'>
      <tspan>发现于 1930年 · 直径 2,377 km · 公转 247.94年</tspan>
    </text>
    <text x='640' y='600' font-size='15' fill='#70747d' text-anchor='middle' font-family='Inter,Noto Sans SC,sans-serif'>
      <tspan fill='#d97706'>2006年降级</tspan><tspan>为矮行星 · 编号 </tspan><tspan fill='#3b82f6' font-weight='bold'>134340</tspan>
    </text>
  </g>
  <g id='footer' chrome='true'>
    <text x='640' y='690' font-size='14' fill='#abaeb3' text-anchor='middle' font-family='Inter,Noto Sans SC,sans-serif'>9 / 12</text>
  </g>
</svg>