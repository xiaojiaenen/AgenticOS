<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1280 720' data-theme='cosmic'>
  <defs>
    <radialGradient id='bgGlow' cx='50%' cy='40%' r='60%'>
      <stop offset='0%' stop-color='#3b82f6' stop-opacity='0.12'/>
      <stop offset='100%' stop-color='#ffffff' stop-opacity='0'/>
    </radialGradient>
    <filter id='glow' x='-50%' y='-50%' width='200%' height='200%'>
      <feGaussianBlur in='SourceGraphic' stdDeviation='4'/>
    </filter>
    <filter id='starGlow' x='-100%' y='-100%' width='300%' height='300%'>
      <feGaussianBlur in='SourceGraphic' stdDeviation='2'/>
    </filter>
  </defs>
  <!-- notes: 封面——宇宙深邃感开场，用星点轨道和行星剪影制造星际旅行的开篇张力 -->
  <g id='bg-layer'>
    <rect width='1280' height='720' fill='#ffffff'/>
    <rect width='1280' height='720' fill='url(#bgGlow)'/>
  </g>
  <g id='stars-decor'>
    <!-- 星辰装饰 -->
    <circle cx='120' cy='80' r='1.5' fill='#abaeb3' fill-opacity='0.6'/>
    <circle cx='350' cy='50' r='1' fill='#abaeb3' fill-opacity='0.4'/>
    <circle cx='900' cy='100' r='2' fill='#abaeb3' fill-opacity='0.7'/>
    <circle cx='1100' cy='60' r='1.2' fill='#abaeb3' fill-opacity='0.5'/>
    <circle cx='200' cy='200' r='1' fill='#abaeb3' fill-opacity='0.3'/>
    <circle cx='1050' cy='200' r='1.5' fill='#abaeb3' fill-opacity='0.5'/>
    <circle cx='70' cy='400' r='1.2' fill='#abaeb3' fill-opacity='0.4'/>
    <circle cx='1180' cy='350' r='1' fill='#abaeb3' fill-opacity='0.3'/>
    <circle cx='500' cy='80' r='1.8' fill='#abaeb3' fill-opacity='0.5'/>
    <circle cx='750' cy='40' r='1' fill='#abaeb3' fill-opacity='0.6'/>
    <circle cx='30' cy='600' r='1.3' fill='#abaeb3' fill-opacity='0.4'/>
    <circle cx='1250' cy='500' r='1.5' fill='#abaeb3' fill-opacity='0.5'/>
    <circle cx='600' cy='650' r='1' fill='#abaeb3' fill-opacity='0.3'/>
    <circle cx='150' cy='550' r='0.8' fill='#abaeb3' fill-opacity='0.4'/>
    <circle cx='1000' cy='600' r='1.2' fill='#abaeb3' fill-opacity='0.5'/>
    <circle cx='800' cy='180' r='0.8' fill='#abaeb3' fill-opacity='0.3'/>
    <circle cx='300' cy='300' r='1' fill='#abaeb3' fill-opacity='0.4'/>
    <circle cx='1150' cy='450' r='1.8' fill='#abaeb3' fill-opacity='0.6'/>
    <circle cx='450' cy='550' r='0.7' fill='#abaeb3' fill-opacity='0.3'/>
    <circle cx='950' cy='300' r='1.3' fill='#abaeb3' fill-opacity='0.5'/>
  </g>
  <g id='orbit-decor'>
    <!-- 轨道装饰 -->
    <ellipse cx='640' cy='400' rx='520' ry='80' fill='none' stroke='#3b82f6' stroke-opacity='0.08' stroke-width='1'/>
    <ellipse cx='640' cy='400' rx='440' ry='68' fill='none' stroke='#3b82f6' stroke-opacity='0.06' stroke-width='1'/>
    <ellipse cx='640' cy='400' rx='360' ry='55' fill='none' stroke='#3b82f6' stroke-opacity='0.05' stroke-width='1'/>
    <!-- 太阳 -->
    <circle cx='640' cy='400' r='30' fill='#3b82f6' fill-opacity='0.9' filter='url(#glow)'/>
    <circle cx='640' cy='400' r='18' fill='#3b82f6'/>
    <!-- 行星小点 -->
    <circle cx='640' cy='320' r='3' fill='#8b5cf6' fill-opacity='0.7'/>
    <circle cx='640' cy='335' r='4' fill='#326ed1' fill-opacity='0.5'/>
    <circle cx='640' cy='348' r='5' fill='#70747d' fill-opacity='0.6'/>
    <circle cx='640' cy='365' r='3.5' fill='#dc2626' fill-opacity='0.5'/>
    <circle cx='640' cy='435' r='12' fill='#d97706' fill-opacity='0.5'/>
    <circle cx='640' cy='455' r='10' fill='#16a34a' fill-opacity='0.4'/>
    <circle cx='640' cy='468' r='8' fill='#8b5cf6' fill-opacity='0.3'/>
    <circle cx='640' cy='475' r='7' fill='#3b82f6' fill-opacity='0.2'/>
  </g>
  <g id='cover-title'>
    <text x='640' y='200' font-size='18' fill='#3b82f6' font-weight='600' text-anchor='middle' font-family='Inter,Noto Sans SC,sans-serif' letter-spacing='4'>太阳系探秘之旅</text>
    <text x='640' y='280' font-size='72' font-weight='800' fill='#111827' text-anchor='middle' font-family='Inter,Noto Sans SC,sans-serif'>
      <tspan x='640' dy='0'>八大行星与</tspan>
      <tspan x='640' dy='88' fill='#3b82f6'>九大行星</tspan>
      <tspan x='640' dy='88' font-size='52'>的星际传奇</tspan>
    </text>
    <text x='640' y='520' font-size='20' fill='#70747d' text-anchor='middle' font-family='Inter,Noto Sans SC,sans-serif' letter-spacing='2'>从水星到冥王星 · 四十六亿年的宇宙故事</text>
  </g>
  <g id='cover-footer' chrome='true'>
    <text x='640' y='680' font-size='14' fill='#abaeb3' text-anchor='middle' font-family='Inter,Noto Sans SC,sans-serif'>1 / 12</text>
  </g>
</svg>