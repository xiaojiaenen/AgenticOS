<!DOCTYPE html>
<html lang="zh-CN" data-theme="cosmic">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<style>
  /* Theme tokens for CSS custom property resolution */
  :root {
    --accent: #3b82f6;
    --accent-2: #8b5cf6;
    --accent-3: #326ed1;
    --bad: #dc2626;
    --bg: #ffffff;
    --bg-soft: #ffffff;
    --border: #c3c5c9;
    --border-strong: #93979d;
    --good: #16a34a;
    --grad: linear-gradient(135deg, #3b82f6, #8b5cf6);
    --grad-soft: linear-gradient(135deg, rgba(59,130,246,0.08), rgba(139,92,246,0.04));
    --surface: #f9f9f9;
    --surface-2: #efefef;
    --text-1: #111827;
    --text-2: #70747d;
    --text-3: #abaeb3;
    --warn: #d97706;
  }
  body { margin:0; padding:0; background:#111; font-family:Inter,Noto Sans SC,sans-serif; }
  body.single .deck { overflow:auto!important; height:auto!important; }
  .deck { display:flex; flex-direction:column; align-items:center; gap:16px; padding:16px; }
  .deck svg { width:100%; max-width:1280px; height:auto; display:block; border-radius:8px; box-shadow:0 4px 24px rgba(0,0,0,.4); }
</style>
</head>
