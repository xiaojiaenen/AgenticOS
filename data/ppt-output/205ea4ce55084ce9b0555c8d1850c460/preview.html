    --text-2: #777777;

  <!-- notes: 句型二——I like... 意思是"我喜欢..."。这个句型可以用来表达你对动物的喜爱。I like cats. 我喜欢猫。注意！like后面的动物单词要用复数形式，加s。大家来造句，说说你喜欢什么动物？ -->

  <rect x='0' y='0' width='1280' height='4' fill='#ff9600'/>

    <text x='80' y='100' font-size='34' font-weight='800' fill='#3c3c3c'>句型二 我喜欢… I like...</text>
  </g>
  <!-- 主卡片 -->
  <g id='sentence2-main'>
    <rect x='60' y='130' width='700' height='440' rx='16' fill='#e5e5e5'/>

    <text x='410' y='190' text-anchor='middle' font-size='22' font-weight='700' fill='#ff9600' font-family='Inter,Noto Sans SC,sans-serif'>💡 句型结构 Sentence Structure</text>
    <!-- 大句型公式 -->
    <rect x='100' y='215' width='620' height='80' rx='12' fill='#ff9600' fill-opacity='0.1'/>
    <text x='410' y='270' text-anchor='middle' font-size='34' font-weight='900' fill='#3c3c3c' font-family='Inter,Noto Sans SC,sans-serif'>I <tspan fill='#ff9600'>like</tspan> <tspan fill='#4a8d00'>animal</tspan><tspan fill='#777777'>s</tspan><tspan fill='#777777'>.</tspan></text>
    <text x='410' y='310' text-anchor='middle' font-size='16' fill='#777777' font-family='Inter,Noto Sans SC,sans-serif'>I + like + 动物名复数（加 s）</text>
    <!-- 例句 -->
    <text x='120' y='370' font-size='28' font-weight='700' fill='#3c3c3c' font-family='Inter,Noto Sans SC,sans-serif'>I like <tspan fill='#ff9600'>cats</tspan>. 🐱</text>
    <text x='120' y='405' font-size='18' fill='#777777' font-family='Inter,Noto Sans SC,sans-serif'>我喜欢猫。</text>
    <text x='120' y='455' font-size='28' font-weight='700' fill='#3c3c3c' font-family='Inter,Noto Sans SC,sans-serif'>I like <tspan fill='#ff9600'>monkeys</tspan>. 🐒</text>
    <text x='120' y='490' font-size='18' fill='#777777' font-family='Inter,Noto Sans SC,sans-serif'>我喜欢猴子。</text>
    <text x='120' y='540' font-size='28' font-weight='700' fill='#3c3c3c' font-family='Inter,Noto Sans SC,sans-serif'>I like <tspan fill='#ff9600'>rabbits</tspan>. 🐰</text>
    <text x='120' y='575' font-size='18' fill='#777777' font-family='Inter,Noto Sans SC,sans-serif'>我喜欢兔子。</text>
  </g>
  <!-- 右栏：注意事项 -->
  <g id='sentence2-tips'>

    <text x='840' y='220' font-size='16' fill='#777777' font-family='Inter,Noto Sans SC,sans-serif'>cat → cat<tspan font-weight='800' fill='#4a8d00'>s</tspan></text>
    <text x='840' y='250' font-size='16' fill='#777777' font-family='Inter,Noto Sans SC,sans-serif'>dog → dog<tspan font-weight='800' fill='#4a8d00'>s</tspan></text>
    <text x='840' y='280' font-size='16' fill='#777777' font-family='Inter,Noto Sans SC,sans-serif'>fish → fish <tspan font-size='14' fill='#777777'>(不变哦！)</tspan></text>
    <text x='840' y='310' font-size='16' fill='#777777' font-family='Inter,Noto Sans SC,sans-serif'>bird → bird<tspan font-weight='800' fill='#4a8d00'>s</tspan></text>
