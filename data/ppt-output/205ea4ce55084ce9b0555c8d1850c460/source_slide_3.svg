<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1280 720' data-theme='duolingo'>
  <!-- notes: 第一个环节——学一学！我们先来认识六种可爱的小动物。老师会展示图片，大家跟着一起读。准备好了吗？Let's learn together! -->
  <rect width='1280' height='720' fill='#ffffff'/>
  <rect x='0' y='0' width='400' height='720' fill='#58a700' fill-opacity='0.08'/>
  <circle cx='200' cy='360' r='150' fill='#58a700' fill-opacity='0.06'/>
  <circle cx='200' cy='360' r='80' fill='#58a700' fill-opacity='0.08'/>
  <g id='section1-badge'>
    <rect x='80' y='80' width='100' height='36' rx='18' fill='#58a700' fill-opacity='0.15'/>
    <text x='130' y='104' text-anchor='middle' font-size='14' font-weight='700' fill='#58a700' font-family='Inter,Noto Sans SC,sans-serif'>PART 01</text>
  </g>
  <g id='section1-title' font-family='Inter,Noto Sans SC,sans-serif'>
    <text x='200' y='330' text-anchor='middle' font-size='100' font-weight='900' fill='#3c3c3c'>A</text>
    <text x='640' y='280' font-size='56' font-weight='900' fill='#3c3c3c'>学一学</text>
    <text x='640' y='350' font-size='28' font-weight='600' fill='#58a700'>Let's Learn!</text>
    <text x='640' y='420' font-size='18' fill='#777777'>认识六种动物朋友的英文名字</text>
    <text x='640' y='455' font-size='18' fill='#777777'>Learn 6 animal names in English</text>
  </g>
  <g id='section1-decor'>
    <text x='900' y='520' font-size='48'>🐾</text>
    <text x='1000' y='560' font-size='36'>🌿</text>
    <text x='1100' y='500' font-size='42'>✨</text>
  </g>
  <g id='section1-footer' font-family='Inter,Noto Sans SC,sans-serif'>
    <text x='1200' y='690' text-anchor='end' font-size='13' fill='#777777'>3 / 10</text>
  </g>
</svg>