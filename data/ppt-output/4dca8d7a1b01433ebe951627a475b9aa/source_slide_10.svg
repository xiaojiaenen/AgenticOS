<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1280 720' data-theme='dramatic'>
  <!-- notes: 数据对比页——内行星直径柱状图+外行星对比卡片，用戏剧化的视觉呈现体积的悬殊差距 -->
  <g id='bg-layer'>
    <rect width='1280' height='720' fill='#09090b'/>
  </g>
  <g id='stars-decor'>
    <circle cx='60' cy='50' r='1.2' fill='#fdfdfd' fill-opacity='0.4'/>
    <circle cx='1220' cy='70' r='1.5' fill='#fdfdfd' fill-opacity='0.5'/>
    <circle cx='80' cy='650' r='1' fill='#fdfdfd' fill-opacity='0.3'/>
    <circle cx='1200' cy='600' r='1.2' fill='#fdfdfd' fill-opacity='0.4'/>
  </g>
  <g id='page-header'>
    <text x='80' y='60' font-size='14' fill='#fdfdfd' font-family='Inter,Noto Sans SC,sans-serif' letter-spacing='3'>CHAPTER 04 · 行星大比拼</text>
    <text x='640' y='90' font-size='36' font-weight='900' fill='#fafafa' text-anchor='middle' font-family='Inter,Noto Sans SC,sans-serif'>行星数据大比拼</text>
    <text x='640' y='115' font-size='14' fill='#fdfdfd' text-anchor='middle' font-family='Inter,Noto Sans SC,sans-serif' letter-spacing='3'>PLANET COMPARISON</text>
    <line x1='530' y1='130' x2='750' y2='130' stroke='#8b5cf6' stroke-width='2'/>
  </g>
  <!-- 内行星直径柱状图 -->
  <g id='inner-chart'>
    <text x='120' y='170' font-size='16' font-weight='bold' fill='#fafafa' font-family='Inter,Noto Sans SC,sans-serif'>内行星直径 (km)</text>
    <text x='130' y='210' font-size='13' fill='#fcfcfc' text-anchor='end' font-family='Inter,Noto Sans SC,sans-serif'>水星</text>
    <rect x='140' y='194' width='155' height='24' rx='4' fill='#BDBDBD'/>
    <text x='305' y='211' font-size='13' fill='#fcfcfc' font-family='Inter,Noto Sans SC,sans-serif'>4,879</text>
    <text x='130' y='248' font-size='13' fill='#fcfcfc' text-anchor='end' font-family='Inter,Noto Sans SC,sans-serif'>金星</text>
    <rect x='140' y='232' width='385' height='24' rx='4' fill='#E8C07A'/>
    <text x='535' y='249' font-size='13' fill='#fcfcfc' font-family='Inter,Noto Sans SC,sans-serif'>12,104</text>
    <text x='130' y='286' font-size='13' fill='#fcfcfc' text-anchor='end' font-family='Inter,Noto Sans SC,sans-serif'>地球</text>
    <rect x='140' y='270' width='405' height='24' rx='4' fill='#4A90D9'/>
    <text x='555' y='287' font-size='13' fill='#fcfcfc' font-family='Inter,Noto Sans SC,sans-serif'>12,756</text>
    <text x='130' y='324' font-size='13' fill='#fcfcfc' text-anchor='end' font-family='Inter,Noto Sans SC,sans-serif'>火星</text>
    <rect x='140' y='308' width='215' height='24' rx='4' fill='#D4735E'/>
    <text x='365' y='325' font-size='13' fill='#fcfcfc' font-family='Inter,Noto Sans SC,sans-serif'>6,792</text>
  </g>
  <!-- 外行星对比卡片 -->
  <g id='outer-chart'>
    <text x='660' y='170' font-size='16' font-weight='bold' fill='#fafafa' font-family='Inter,Noto Sans SC,sans-serif'>外行星 · 惊人对比</text>
    <rect x='660' y='185' width='270' height='135' rx='12' fill='#08080a' stroke='#fdfdfd' stroke-width='0.5'/>
    <circle cx='690' cy='220' r='18' fill='#D4A574'/>
    <text x='720' y='216' font-size='17' font-weight='bold' fill='#fafafa' font-family='Inter,Noto Sans SC,sans-serif'>木星</text>
    <text x='720' y='238' font-size='12' fill='#fdfdfd' font-family='Inter,Noto Sans SC,sans-serif'>142,984 km</text>
    <text x='680' y='268' font-size='13' fill='#fcfcfc' font-family='Inter,Noto Sans SC,sans-serif'>直径是地球的<tspan font-weight='bold' fill='#8b5cf6'>11.2倍</tspan></text>
    <text x='680' y='295' font-size='13' fill='#fcfcfc' font-family='Inter,Noto Sans SC,sans-serif'>质量 = 其他行星总和的2.5倍</text>
    <rect x='950' y='185' width='270' height='135' rx='12' fill='#08080a' stroke='#fdfdfd' stroke-width='0.5'/>
    <circle cx='980' cy='220' r='16' fill='#E8D5A3'/>
    <ellipse cx='980' cy='220' rx='26' ry='5' fill='none' stroke='#C8B57A' stroke-width='1.5' transform='rotate(-18 980 220)'/>
    <text x='1010' y='216' font-size='17' font-weight='bold' fill='#fafafa' font-family='Inter,Noto Sans SC,sans-serif'>土星</text>
    <text x='1010' y='238' font-size='12' fill='#fdfdfd' font-family='Inter,Noto Sans SC,sans-serif'>120,536 km</text>
    <text x='970' y='268' font-size='13' fill='#fcfcfc' font-family='Inter,Noto Sans SC,sans-serif'>密度 &lt; 水 · 可以浮在水上</text>
    <text x='970' y='295' font-size='13' fill='#fcfcfc' font-family='Inter,Noto Sans SC,sans-serif'>146颗卫星 · 太阳系最多</text>
    <rect x='660' y='340' width='270' height='135' rx='12' fill='#08080a' stroke='#fdfdfd' stroke-width='0.5'/>
    <circle cx='690' cy='375' r='12' fill='#7EC8E3'/>
    <text x='720' y='371' font-size='17' font-weight='bold' fill='#fafafa' font-family='Inter,Noto Sans SC,sans-serif'>天王星</text>
    <text x='720' y='393' font-size='12' fill='#fdfdfd' font-family='Inter,Noto Sans SC,sans-serif'>51,118 km</text>
    <text x='680' y='423' font-size='13' fill='#fcfcfc' font-family='Inter,Noto Sans SC,sans-serif'>自转轴倾斜<tspan font-weight='bold' fill='#8b5cf6'>98°</tspan> · 侧躺旋转</text>
    <text x='680' y='450' font-size='13' fill='#fcfcfc' font-family='Inter,Noto Sans SC,sans-serif'>甲烷大气呈蓝绿色</text>
    <rect x='950' y='340' width='270' height='135' rx='12' fill='#08080a' stroke='#fdfdfd' stroke-width='0.5'/>
    <circle cx='980' cy='375' r='11' fill='#4A6FE8'/>
    <text x='1010' y='371' font-size='17' font-weight='bold' fill='#fafafa' font-family='Inter,Noto Sans SC,sans-serif'>海王星</text>
    <text x='1010' y='393' font-size='12' fill='#fdfdfd' font-family='Inter,Noto Sans SC,sans-serif'>49,528 km</text>
    <text x='970' y='423' font-size='13' fill='#fcfcfc' font-family='Inter,Noto Sans SC,sans-serif'>风速 <tspan font-weight='bold' fill='#d97706'>2,100 km/h</tspan> 太阳系之最</text>
    <text x='970' y='450' font-size='13' fill='#fcfcfc' font-family='Inter,Noto Sans SC,sans-serif'>被数学计算预言发现</text>
  </g>
  <!-- 比例提示 -->
  <g id='scale-note'>
    <rect x='140' y='348' width='405' height='130' rx='12' fill='#08080a' stroke='#fdfdfd' stroke-width='0.5'/>
    <text x='343' y='382' font-size='15' font-weight='bold' fill='#8b5cf6' text-anchor='middle' font-family='Inter,Noto Sans SC,sans-serif'>⚡ 尺度震撼 ⚡</text>
    <text x='343' y='412' font-size='14' fill='#fcfcfc' text-anchor='middle' font-family='Inter,Noto Sans SC,sans-serif'>如果木星是篮球大小</text>
    <text x='343' y='440' font-size='14' fill='#fcfcfc' text-anchor='middle' font-family='Inter,Noto Sans SC,sans-serif'>地球就是一颗豌豆</text>
    <text x='343' y='465' font-size='12' fill='#fdfdfd' text-anchor='middle' font-family='Inter,Noto Sans SC,sans-serif'>水星只相当于一粒芝麻</text>
  </g>
  <g id='footer' chrome='true'>
    <text x='640' y='690' font-size='14' fill='#fdfdfd' text-anchor='middle' font-family='Inter,Noto Sans SC,sans-serif'>10 / 12</text>
  </g>
</svg>