<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1280 720' data-theme='dramatic'>
  <defs>
    <radialGradient id='endGlow' cx='50%' cy='42%' r='55%'>
      <stop offset='0%' stop-color='#8b5cf6' stop-opacity='0.15'/>
      <stop offset='60%' stop-color='#f43f5e' stop-opacity='0.05'/>
      <stop offset='100%' stop-color='#09090b' stop-opacity='0'/>
    </radialGradient>
    <filter id='endGlowBig' x='-50%' y='-50%' width='200%' height='200%'>
      <feGaussianBlur in='SourceGraphic' stdDeviation='5'/>
    </filter>
  </defs>
  <!-- notes: 结尾——用"我们的征途是星辰大海"作为收束，配合太阳系缩略图和卡尔·萨根的名言，给观众留下震撼和久久回味的宇宙视野 -->
  <g id='bg-layer'>
    <rect width='1280' height='720' fill='#09090b'/>
    <rect width='1280' height='720' fill='url(#endGlow)'/>
  </g>
  <g id='stars-decor'>
    <circle cx='80' cy='50' r='2' fill='#fdfdfd' fill-opacity='0.6'/>
    <circle cx='200' cy='100' r='1.2' fill='#fdfdfd' fill-opacity='0.4'/>
    <circle cx='400' cy='40' r='2.5' fill='#fdfdfd' fill-opacity='0.7'/>
    <circle cx='900' cy='60' r='1.5' fill='#fdfdfd' fill-opacity='0.5'/>
    <circle cx='1150' cy='80' r='2' fill='#fdfdfd' fill-opacity='0.6'/>
    <circle cx='1200' cy='300' r='1.2' fill='#fdfdfd' fill-opacity='0.4'/>
    <circle cx='80' cy='400' r='1.5' fill='#fdfdfd' fill-opacity='0.5'/>
    <circle cx='60' cy='550' r='1' fill='#fdfdfd' fill-opacity='0.4'/>
    <circle cx='1220' cy='550' r='1.8' fill='#fdfdfd' fill-opacity='0.6'/>
    <circle cx='350' cy='650' r='1.2' fill='#fdfdfd' fill-opacity='0.4'/>
    <circle cx='950' cy='650' r='1.5' fill='#fdfdfd' fill-opacity='0.5'/>
    <circle cx='600' cy='50' r='1' fill='#fdfdfd' fill-opacity='0.4'/>
    <circle cx='750' cy='40' r='1.2' fill='#fdfdfd' fill-opacity='0.5'/>
    <circle cx='150' cy='200' r='1' fill='#fdfdfd' fill-opacity='0.4'/>
    <circle cx='1100' cy='450' r='1.3' fill='#fdfdfd' fill-opacity='0.5'/>
  </g>
  <!-- 太阳系微缩 -->
  <g id='solar-system-mini'>
    <ellipse cx='640' cy='200' rx='420' ry='50' fill='none' stroke='#8b5cf6' stroke-opacity='0.06' stroke-width='0.8'/>
    <ellipse cx='640' cy='200' rx='340' ry='40' fill='none' stroke='#f43f5e' stroke-opacity='0.04' stroke-width='0.8'/>
    <ellipse cx='640' cy='200' rx='260' ry='30' fill='none' stroke='#8b5cf6' stroke-opacity='0.03' stroke-width='0.8'/>
    <ellipse cx='640' cy='200' rx='180' ry='20' fill='none' stroke='#f43f5e' stroke-opacity='0.02' stroke-width='0.8'/>
    <circle cx='640' cy='200' r='12' fill='#8b5cf6' fill-opacity='0.2' filter='url(#endGlowBig)'/>
    <circle cx='640' cy='200' r='7' fill='#FFD54F'/>
    <circle cx='640' cy='168' r='2.5' fill='#BDBDBD'/>
    <circle cx='640' cy='178' r='3.5' fill='#E8C07A'/>
    <circle cx='640' cy='188' r='4' fill='#4A90D9'/>
    <circle cx='640' cy='196' r='3' fill='#D4735E'/>
    <circle cx='640' cy='214' r='7' fill='#D4A574'/>
    <circle cx='640' cy='225' r='6' fill='#E8D5A3'/>
    <circle cx='640' cy='234' r='4.5' fill='#7EC8E3'/>
    <circle cx='640' cy='240' r='4' fill='#4A6FE8'/>
  </g>
  <g id='final-content'>
    <text x='640' y='340' font-size='64' font-weight='900' fill='#fafafa' text-anchor='middle' font-family='Inter,Noto Sans SC,sans-serif'>
      <tspan x='640' dy='0'>我们的征途是</tspan>
      <tspan x='640' dy='82' fill='#8b5cf6'>星辰大海</tspan>
    </text>
    <line x1='480' y1='435' x2='800' y2='435' stroke='#8b5cf6' stroke-opacity='0.3' stroke-width='1'/>
    <text x='640' y='480' font-size='18' fill='#fcfcfc' text-anchor='middle' font-family='Inter,Noto Sans SC,sans-serif'>"天文学让人谦卑、也让人得以成长。"</text>
    <text x='640' y='508' font-size='14' fill='#fdfdfd' text-anchor='middle' font-family='Inter,Noto Sans SC,sans-serif'>—— 卡尔·萨根</text>
  </g>
  <g id='ending-note'>
    <text x='640' y='575' font-size='16' fill='#fcfcfc' text-anchor='middle' font-family='Inter,Noto Sans SC,sans-serif'>感谢观看 · 对宇宙的好奇心，是人类最宝贵的本能</text>
    <text x='640' y='605' font-size='14' fill='#fdfdfd' text-anchor='middle' font-family='Inter,Noto Sans SC,sans-serif'>✦ THANK YOU · KEEP LOOKING UP ✦</text>
    <text x='640' y='645' font-size='16' fill='#8b5cf6' text-anchor='middle' font-family='Inter,Noto Sans SC,sans-serif' font-weight='600'>汇报人：小贾</text>
  </g>
  <g id='footer' chrome='true'>
    <text x='640' y='690' font-size='14' fill='#fdfdfd' text-anchor='middle' font-family='Inter,Noto Sans SC,sans-serif'>12 / 12</text>
  </g>
</svg>