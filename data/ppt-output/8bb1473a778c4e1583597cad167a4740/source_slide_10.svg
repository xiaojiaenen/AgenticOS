<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1280 720' data-theme='claude'>
  <!-- notes: 核心理念——大引述页作为节奏调节。引用Anthropic的使命宣言，强调AI安全与人类福祉。此处用serif字体增加庄重感 -->
  <g id="bg-layer">
    <rect width='1280' height='720' fill='#ffffff'/>
  </g>
  <g id="quote-bg">
    <text x='120' y='200' font-size='200' font-weight='700' fill='#dedc01' fill-opacity='0.08' font-family='Playfair Display,Noto Serif SC,serif'>&amp;ldquo;</text>
  </g>
  <g id="quote-content">
    <text x='180' y='340' font-size='38' font-weight='500' fill='#4d4c48' font-family='Playfair Display,Noto Serif SC,serif' line-height='1.6'>
      <tspan x='180' dy='0'>AI 的真正价值不在于它有多聪明，</tspan>
      <tspan x='180' dy='60'>而在于它有多 </tspan>
      <tspan fill='#dedc01' font-weight='700'>值得信赖</tspan>
      <tspan>。</tspan>
    </text>
  </g>
  <g id="quote-source">
    <rect x='180' y='480' width='60' height='3' rx='1.5' fill='#dedc01'/>
    <text x='260' y='493' font-size='18' font-weight='600' fill='#4d4c48'>Anthropic 使命宣言</text>
    <text x='260' y='520' font-size='16' fill='#87867f'>安全、诚实、对人类社会有益</text>
  </g>
  <g id="quote-values">
    <rect x='180' y='570' width='280' height='50' rx='25' fill='#f5f4ed' stroke='#dedc01' stroke-width='1.5'/>
    <text x='320' y='600' font-size='16' font-weight='600' fill='#dedc01' text-anchor='middle'>安全对齐 · 透明可靠</text>
    <rect x='500' y='570' width='280' height='50' rx='25' fill='#f5f4ed' stroke='#dedc01' stroke-width='1.5'/>
    <text x='640' y='600' font-size='16' font-weight='600' fill='#dedc01' text-anchor='middle'>以人为本 · 赋能创造</text>
    <rect x='820' y='570' width='280' height='50' rx='25' fill='#f5f4ed' stroke='#dedc01' stroke-width='1.5'/>
    <text x='960' y='600' font-size='16' font-weight='600' fill='#dedc01' text-anchor='middle'>长期主义 · 开放共赢</text>
  </g>
  <g id="footer">
    <text x='640' y='690' font-size='14' fill='#87867f' text-anchor='middle'>10 / 11 · 核心理念</text>
  </g>
</svg>