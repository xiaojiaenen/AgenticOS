<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1280 720' data-theme='claude'>
  <!-- notes: 发展历程——展示Claude从Anthropic成立到现在的里程碑。用时间轴降低阅读负担，每个节点一句话 -->
  <g id="bg-layer">
    <rect width='1280' height='720' fill='#ffffff'/>
  </g>
  <g id="page-header">
    <text x='100' y='100' font-size='14' fill='#dedc01' font-weight='600' letter-spacing='3'>JOURNEY</text>
    <text x='100' y='150' font-size='44' font-weight='700' fill='#4d4c48'>发展历程</text>
    <rect x='100' y='172' width='60' height='4' rx='2' fill='#dedc01'/>
    <text x='100' y='210' font-size='18' fill='#3d3d3a'>从理念到现实，Claude 的每一步进化</text>
  </g>
  <g id="timeline-axis">
    <line x1='160' y1='340' x2='1180' y2='340' stroke='#e8e6dc' stroke-width='2'/>
  </g>
  <g id="timeline-2021">
    <circle cx='200' cy='340' r='12' fill='#dedc01'/>
    <circle cx='200' cy='340' r='5' fill='#ffffff'/>
    <text x='200' y='300' font-size='16' font-weight='600' fill='#4d4c48' text-anchor='middle'>2021</text>
    <text x='200' y='408' font-size='15' fill='#3d3d3a' text-anchor='middle'>Anthropic 成立</text>
    <text x='200' y='432' font-size='13' fill='#87867f' text-anchor='middle'>安全 AI 研究起步</text>
  </g>
  <g id="timeline-2023">
    <circle cx='480' cy='340' r='12' fill='#dedc01'/>
    <circle cx='480' cy='340' r='5' fill='#ffffff'/>
    <text x='480' y='300' font-size='16' font-weight='600' fill='#4d4c48' text-anchor='middle'>2023</text>
    <text x='480' y='408' font-size='15' fill='#3d3d3a' text-anchor='middle'>Claude 2 发布</text>
    <text x='480' y='432' font-size='13' fill='#87867f' text-anchor='middle'>长文本·多语言能力</text>
  </g>
  <g id="timeline-2024">
    <circle cx='760' cy='340' r='12' fill='#dedc01'/>
    <circle cx='760' cy='340' r='5' fill='#ffffff'/>
    <text x='760' y='300' font-size='16' font-weight='600' fill='#4d4c48' text-anchor='middle'>2024</text>
    <text x='760' y='408' font-size='15' fill='#3d3d3a' text-anchor='middle'>Claude 3 家族</text>
    <text x='760' y='432' font-size='13' fill='#87867f' text-anchor='middle'>Haiku·Sonnet·Opus</text>
  </g>
  <g id="timeline-2025">
    <circle cx='1040' cy='340' r='14' fill='#dedc01'/>
    <circle cx='1040' cy='340' r='6' fill='#ffffff'/>
    <text x='1040' y='300' font-size='16' font-weight='600' fill='#4d4c48' text-anchor='middle'>2025+</text>
    <text x='1040' y='408' font-size='15' fill='#3d3d3a' text-anchor='middle'>持续进化</text>
    <text x='1040' y='432' font-size='13' fill='#87867f' text-anchor='middle'>更智能·更安全·更贴心</text>
  </g>
  <g id="highlights-row">
    <rect x='140' y='510' width='300' height='100' rx='12' fill='#f5f4ed'/>
    <text x='170' y='552' font-size='28' font-weight='700' fill='#dedc01' font-family='Inter,Noto Sans SC,sans-serif'>100+</text>
    <text x='170' y='586' font-size='15' fill='#3d3d3a'>国家和地区可用</text>
    <rect x='490' y='510' width='300' height='100' rx='12' fill='#f5f4ed'/>
    <text x='520' y='552' font-size='28' font-weight='700' fill='#dedc01' font-family='Inter,Noto Sans SC,sans-serif'>200K+</text>
    <text x='520' y='586' font-size='15' fill='#3d3d3a'>token 上下文窗口</text>
    <rect x='840' y='510' width='300' height='100' rx='12' fill='#f5f4ed'/>
    <text x='870' y='552' font-size='28' font-weight='700' fill='#dedc01' font-family='Inter,Noto Sans SC,sans-serif'>持续</text>
    <text x='870' y='586' font-size='15' fill='#3d3d3a'>安全评估与对齐训练</text>
  </g>
  <g id="footer">
    <rect x='100' y='660' width='1080' height='1' fill='#e8e6dc'/>
    <text x='100' y='690' font-size='14' fill='#87867f'>04 / 11 · 发展历程</text>
  </g>
</svg>