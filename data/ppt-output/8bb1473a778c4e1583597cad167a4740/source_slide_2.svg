<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1280 720' data-theme='claude'>
  <!-- notes: 目录页——用编号列出三个章节，让观众对整场演讲有清晰预期 -->
  <g id="bg-layer">
    <rect width='1280' height='720' fill='#ffffff'/>
  </g>
  <g id="page-header">
    <text x='100' y='100' font-size='14' fill='#dedc01' font-weight='600' letter-spacing='3'>AGENDA</text>
    <text x='100' y='150' font-size='44' font-weight='700' fill='#4d4c48'>目录</text>
    <rect x='100' y='172' width='60' height='4' rx='2' fill='#dedc01'/>
  </g>
  <g id="toc-list">
    <rect x='100' y='240' width='340' height='100' rx='12' fill='#f5f4ed'/>
    <text x='130' y='280' font-size='36' font-weight='700' fill='#dedc01' font-family='Inter,Noto Sans SC,sans-serif'>01</text>
    <text x='130' y='316' font-size='22' font-weight='600' fill='#4d4c48'>认识 Claude</text>
    <text x='280' y='316' font-size='16' fill='#87867f'>背景 · 发展历程</text>

    <rect x='470' y='240' width='340' height='100' rx='12' fill='#f5f4ed'/>
    <text x='500' y='280' font-size='36' font-weight='700' fill='#dedc01' font-family='Inter,Noto Sans SC,sans-serif'>02</text>
    <text x='500' y='316' font-size='22' font-weight='600' fill='#4d4c48'>核心能力</text>
    <text x='650' y='316' font-size='16' fill='#87867f'>数据 · 特色 · 使用</text>

    <rect x='840' y='240' width='340' height='100' rx='12' fill='#f5f4ed'/>
    <text x='870' y='280' font-size='36' font-weight='700' fill='#dedc01' font-family='Inter,Noto Sans SC,sans-serif'>03</text>
    <text x='870' y='316' font-size='22' font-weight='600' fill='#4d4c48'>未来方向</text>
    <text x='1020' y='316' font-size='16' fill='#87867f'>愿景 · 行动号召</text>
  </g>
  <g id="toc-detail-items">
    <circle cx='130' cy='420' r='5' fill='#dedc01'/>
    <text x='150' y='426' font-size='18' fill='#3d3d3a'>从 Anthropic 实验室到你的身边</text>
    <circle cx='130' cy='470' r='5' fill='#dedc01'/>
    <text x='150' y='476' font-size='18' fill='#3d3d3a'>安全为本的 AI 设计哲学</text>
    <circle cx='130' cy='520' r='5' fill='#dedc01'/>
    <text x='150' y='526' font-size='18' fill='#3d3d3a'>三大核心能力全景</text>
    <circle cx='130' cy='570' r='5' fill='#dedc01'/>
    <text x='150' y='576' font-size='18' fill='#3d3d3a'>让每个人受益的 AI</text>
  </g>
  <g id="footer">
    <rect x='100' y='660' width='1080' height='1' fill='#e8e6dc'/>
    <text x='100' y='690' font-size='14' fill='#87867f'>02 / 11 · 目录</text>
  </g>
</svg>