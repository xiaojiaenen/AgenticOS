<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1280 720' data-theme='dramatic'>
  <defs>
    <radialGradient id='plutoGlow' cx='50%' cy='50%' r='50%'>
      <stop offset='0%' stop-color='#8b5cf6' stop-opacity='0.1'/>
      <stop offset='100%' stop-color='#09090b' stop-opacity='0'/>
    </radialGradient>
    <filter id='plutoFilter' x='-50%' y='-50%' width='200%' height='200%'>
      <feGaussianBlur in='SourceGraphic' stdDeviation='3'/>
    </filter>
  </defs>
  <!-- notes: 冥王星——这颗曾经的行星九号，2006年被IAU降级为矮行星。用金句唤起情感共鸣，同时展示它的动人数据 -->
  <g id='bg-layer'>
    <rect width='1280' height='720' fill='#09090b'/>
    <rect width='1280' height='720' fill='url(#plutoGlow)'/>
  </g>
  <g id='stars-decor'>
    <circle cx='60' cy='50' r='1.5' fill='#fdfdfd' fill-opacity='0.5'/>
    <circle cx='1220' cy='70' r='2' fill='#fdfdfd' fill-opacity='0.6'/>
    <circle cx='80' cy='600' r='1.2' fill='#fdfdfd' fill-opacity='0.4'/>
    <circle cx='1200' cy='550' r='1.5' fill='#fdfdfd' fill-opacity='0.5'/>
    <circle cx='350' cy='40' r='1' fill='#fdfdfd' fill-opacity='0.4'/>
    <circle cx='900' cy='50' r='1.3' fill='#fdfdfd' fill-opacity='0.5'/>
  </g>
  <g id='page-header'>
    <text x='80' y='60' font-size='14' fill='#fdfdfd' font-family='Inter,Noto Sans SC,sans-serif' letter-spacing='3'>CHAPTER 02 · 从九大到八大</text>
  </g>
  <!-- 冥王星 + 卡戎 -->
  <g id='pluto-visual'>
    <circle cx='640' cy='250' r='48' fill='#C8A878' fill-opacity='0.9'/>
    <circle cx='640' cy='250' r='43' fill='#D4B896'/>
    <ellipse cx='630' cy='245' rx='14' ry='10' fill='#E0C898' fill-opacity='0.5'/>
    <ellipse cx='648' cy='238' rx='10' ry='7' fill='#E0C898' fill-opacity='0.4'/>
    <!-- 卡戎 -->
    <circle cx='700' cy='230' r='16' fill='#A89878'/>
  </g>
  <g id='quote-section'>
    <text x='120' y='320' font-size='100' font-weight='900' fill='#8b5cf6' fill-opacity='0.1' font-family='Georgia,serif'>"</text>
    <text x='640' y='400' font-size='34' font-weight='bold' fill='#fafafa' text-anchor='middle' font-family='Inter,Noto Sans SC,sans-serif'>
      <tspan x='640' dy='0'>冥王星并没有变，</tspan>
      <tspan x='640' dy='52' fill='#8b5cf6'>改变的是我们对 "行星" 的定义。</tspan>
    </text>
    <text x='640' y='510' font-size='15' fill='#fcfcfc' text-anchor='middle' font-family='Inter,Noto Sans SC,sans-serif'>2006 年国际天文学联合会（IAU）决议</text>
  </g>
  <g id='pluto-facts'>
    <line x1='400' y1='545' x2='880' y2='545' stroke='#8b5cf6' stroke-opacity='0.15' stroke-width='1'/>
    <text x='640' y='575' font-size='15' fill='#fcfcfc' text-anchor='middle' font-family='Inter,Noto Sans SC,sans-serif'>1930年发现 · 直径 2,377 km · 公转 247.94年</text>
    <text x='640' y='605' font-size='15' fill='#fcfcfc' text-anchor='middle' font-family='Inter,Noto Sans SC,sans-serif'>
      <tspan fill='#d97706' font-weight='bold'>2006年降级</tspan><tspan>为矮行星</tspan>
      <tspan fill='#8b5cf6' font-weight='bold'> · 编号 134340</tspan>
    </text>
  </g>
  <g id='footer' chrome='true'>
    <text x='640' y='690' font-size='14' fill='#fdfdfd' text-anchor='middle' font-family='Inter,Noto Sans SC,sans-serif'>9 / 12</text>
  </g>
</svg>