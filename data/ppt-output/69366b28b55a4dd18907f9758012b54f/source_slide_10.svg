<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1280 720' data-theme='deepseek'>
  <!-- notes: 核心理念——大引述页作为节奏调节。引用深度求索的使命宣言，强调开放与普惠。用serif字体增加庄重感 -->
  <g id="bg-layer">
    <rect width='1280' height='720' fill='var(--bg)'/>
  </g>
  <g id="quote-bg">
    <text x='120' y='200' font-size='200' font-weight='700' fill='var(--accent)' fill-opacity='0.08' font-family='Playfair Display,Noto Serif SC,serif'>&amp;ldquo;</text>
  </g>
  <g id="quote-content">
    <text x='180' y='340' font-size='38' font-weight='500' fill='var(--text-1)' font-family='Playfair Display,Noto Serif SC,serif' line-height='1.6'>
      <tspan x='180' dy='0'>AI 的终极意义不是取代人类，</tspan>
      <tspan x='180' dy='60'>而是让每个人都能 </tspan>
      <tspan fill='var(--accent)' font-weight='700'>站在智能的肩膀上</tspan>
      <tspan>。</tspan>
    </text>
  </g>
  <g id="quote-source">
    <rect x='180' y='480' width='60' height='3' rx='1.5' fill='var(--accent)'/>
    <text x='260' y='493' font-size='18' font-weight='600' fill='var(--text-1)'>深度求索 · 使命宣言</text>
    <text x='260' y='520' font-size='16' fill='var(--text-3)'>开源、高效、让 AI 普惠每个人</text>
  </g>
  <g id="quote-values">
    <rect x='180' y='570' width='280' height='50' rx='25' fill='var(--surface)' stroke='var(--accent)' stroke-width='1.5'/>
    <text x='320' y='600' font-size='16' font-weight='600' fill='var(--accent)' text-anchor='middle'>开源开放 · 技术透明</text>
    <rect x='500' y='570' width='280' height='50' rx='25' fill='var(--surface)' stroke='var(--accent)' stroke-width='1.5'/>
    <text x='640' y='600' font-size='16' font-weight='600' fill='var(--accent)' text-anchor='middle'>极致效率 · 成本可控</text>
    <rect x='820' y='570' width='280' height='50' rx='25' fill='var(--surface)' stroke='var(--accent)' stroke-width='1.5'/>
    <text x='960' y='600' font-size='16' font-weight='600' fill='var(--accent)' text-anchor='middle'>探求真理 · 赋能人类</text>
  </g>
  <g id="footer">
    <text x='640' y='690' font-size='14' fill='var(--text-3)' text-anchor='middle'>10 / 11 · 核心理念</text>
  </g>
</svg>