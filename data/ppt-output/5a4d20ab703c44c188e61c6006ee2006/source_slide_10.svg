<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1280 720' data-theme='fantasy'>
  <defs>
    <linearGradient id='bgGrad10' x1='0' y1='0' x2='0' y2='1'>
      <stop offset='0%' stop-color='#ffffff'/>
      <stop offset='100%' stop-color='#ffffff'/>
    </linearGradient>
    <linearGradient id='btnGrad' x1='0' y1='0' x2='1' y2='0'>
      <stop offset='0%' stop-color='#0250cc'/>
      <stop offset='100%' stop-color='#fdc800'/>
    </linearGradient>
    <filter id='btnShadow' x='-20%' y='-20%' width='140%' height='140%'>
      <feGaussianBlur in='SourceAlpha' stdDeviation='10'/>
      <feOffset dx='0' dy='6'/>
      <feFlood flood-color='#0250cc' flood-opacity='0.25'/>
      <feComposite in2='SourceGraphic' operator='in'/>
      <feMerge><feMergeNode/><feMergeNode in='SourceGraphic'/></feMerge>
    </filter>
    <filter id='cardShadow10' x='-10%' y='-10%' width='130%' height='130%'>
      <feGaussianBlur in='SourceAlpha' stdDeviation='6'/>
      <feOffset dx='0' dy='3'/>
      <feFlood flood-color='#000000' flood-opacity='0.06'/>
      <feComposite in2='SourceGraphic' operator='in'/>
      <feMerge><feMergeNode/><feMergeNode in='SourceGraphic'/></feMerge>
    </filter>
  </defs>
  <g id='bg-layer'>
    <rect width='1280' height='720' fill='url(#bgGrad10)'/>
    <ellipse cx='640' cy='0' rx='500' ry='200' fill='#0250cc' fill-opacity='0.03'/>
    <ellipse cx='640' cy='720' rx='500' ry='200' fill='#fdc800' fill-opacity='0.03'/>
  </g>
  <!-- 星尘 -->
  <g id='decor-dots'>
    <circle cx='200' cy='180' r='2' fill='#0250cc' fill-opacity='0.2'/>
    <circle cx='1100' cy='150' r='1.5' fill='#fdc800' fill-opacity='0.2'/>
    <circle cx='120' cy='500' r='2' fill='#0250cc' fill-opacity='0.2'/>
    <path d='M300,120 Q306,113 312,120 Q306,127 300,120 Z' fill='#0250cc' fill-opacity='0.3'/>
    <path d='M1050,100 Q1058,92 1066,100 Q1058,108 1050,100 Z' fill='#fdc800' fill-opacity='0.25'/>
  </g>
  <!-- 页眉 -->
  <g id='page-header'>
    <text x='80' y='80' font-size='13' fill='#abaeb3' font-family='Inter,Noto Sans SC,sans-serif' letter-spacing='3'>购票信息</text>
    <rect x='80' y='95' width='40' height='3' rx='1.5' fill='#0250cc'/>
  </g>
  <!-- 标题 -->
  <g id='section-title'>
    <text x='80' y='165' font-size='38' font-weight='800' fill='#111827' font-family='Inter,Noto Sans SC,sans-serif'>
      加入这场夏日狂想
    </text>
    <text x='80' y='200' font-size='15' fill='#70747d' font-family='Inter,Noto Sans SC,sans-serif'>早鸟优惠进行中 · 选一份属于你的入场券</text>
  </g>
  <!-- 三档票价 -->
  <g id='ticket-cards' font-family='Inter,Noto Sans SC,sans-serif'>
    <!-- 基础票 -->
    <g transform='translate(80, 260)'>
      <rect width='350' height='350' rx='20' fill='#f9f9f9' stroke='#c3c5c9' stroke-width='1' filter='url(#cardShadow10)'/>
      <text x='175' y='60' text-anchor='middle' font-size='18' font-weight='700' fill='#111827'>单日票</text>
      <text x='175' y='105' text-anchor='middle' font-size='42' font-weight='900' fill='#0250cc'>
        ¥<tspan font-size='56'>128</tspan>
      </text>
      <text x='175' y='130' text-anchor='middle' font-size='13' fill='#abaeb3'>早鸟价 ¥88（限前1000张）</text>
      <rect x='30' y='150' width='290' height='1' fill='#c3c5c9'/>
      <text x='40' y='180' font-size='14' fill='#70747d'>✔ 单日展区通行</text>
      <text x='40' y='210' font-size='14' fill='#70747d'>✔ 基础舞台表演</text>
      <text x='40' y='240' font-size='14' fill='#70747d'>✔ 展会周边手册</text>
      <text x='40' y='270' font-size='14' fill='#abaeb3'>✘ 声优见面会</text>
      <text x='40' y='300' font-size='14' fill='#abaeb3'>✘ 限定周边礼包</text>
    </g>
    <!-- 推荐票 -->
    <g transform='translate(465, 250)'>
      <rect width='350' height='370' rx='20' fill='#f9f9f9' stroke='#0250cc' stroke-width='2'/>
      <!-- 热门标签 -->
      <rect x='100' y='0' width='150' height='28' rx='14' fill='#0250cc'/>
      <text x='175' y='19' text-anchor='middle' font-size='12' fill='#ffffff' font-weight='700'>🔥 最受欢迎</text>
      <text x='175' y='75' text-anchor='middle' font-size='18' font-weight='700' fill='#111827'>三日通票</text>
      <text x='175' y='120' text-anchor='middle' font-size='42' font-weight='900' fill='#0250cc'>
        ¥<tspan font-size='56'>268</tspan>
      </text>
      <text x='175' y='145' text-anchor='middle' font-size='13' fill='#abaeb3'>早鸟价 ¥198（省<tspan font-weight='bold'>70</tspan>元）</text>
      <rect x='30' y='165' width='290' height='1' fill='#c3c5c9'/>
      <text x='40' y='195' font-size='14' fill='#70747d'>✔ 三日全域通行</text>
      <text x='40' y='225' font-size='14' fill='#70747d'>✔ 所有舞台 &amp; 见面会</text>
      <text x='40' y='255' font-size='14' fill='#70747d'>✔ 工作坊体验名额</text>
      <text x='40' y='285' font-size='14' fill='#70747d'>✔ 限定周边礼包</text>
      <text x='40' y='315' font-size='14' fill='#70747d'>✔ VIP 优先入场通道</text>
    </g>
    <!-- VIP票 -->
    <g transform='translate(850, 260)'>
      <rect width='350' height='350' rx='20' fill='#f9f9f9' stroke='#c3c5c9' stroke-width='1' filter='url(#cardShadow10)'/>
      <text x='175' y='60' text-anchor='middle' font-size='18' font-weight='700' fill='#111827'>VIP 尊享票</text>
      <text x='175' y='105' text-anchor='middle' font-size='42' font-weight='900' fill='#fdc800'>
        ¥<tspan font-size='56'>688</tspan>
      </text>
      <text x='175' y='130' text-anchor='middle' font-size='13' fill='#abaeb3'>限量 200 张 · 含签名会资格</text>
      <rect x='30' y='150' width='290' height='1' fill='#c3c5c9'/>
      <text x='40' y='180' font-size='14' fill='#70747d'>✔ 三日通票全部权益</text>
      <text x='40' y='210' font-size='14' fill='#70747d'>✔ 嘉宾签名会优先资格</text>
      <text x='40' y='240' font-size='14' fill='#70747d'>✔ VIP 专属休息区</text>
      <text x='40' y='270' font-size='14' fill='#70747d'>✔ 限定版纪念画册</text>
      <text x='40' y='300' font-size='14' fill='#70747d'>✔ 官方答谢晚宴</text>
    </g>
  </g>
  <!-- 购票按钮 -->
  <g id='cta-button' text-anchor='middle' font-family='Inter,Noto Sans SC,sans-serif'>
    <rect x='464' y='650' width='352' height='48' rx='24' fill='url(#btnGrad)' filter='url(#btnShadow)'/>
    <text x='640' y='680' font-size='16' font-weight='700' fill='#ffffff' letter-spacing='2'>立即购票 · 早鸟倒计时</text>
  </g>
  <g id='footer' font-family='Inter,Noto Sans SC,sans-serif'>
    <text x='1240' y='690' font-size='12' fill='#abaeb3' text-anchor='end'>10 / 11</text>
  </g>
  <!-- notes: CTA——"三档票给大家选。中间三日通票最划算，二八八三天全包。VIP限量200张，要抢趁早。二维码在官网和公众号都能扫。" -->
</svg>