<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1280 720' data-theme='fantasy'>
  <defs>
    <linearGradient id='bgGrad8' x1='0' y1='0' x2='0' y2='1'>
      <stop offset='0%' stop-color='#ffffff'/>
      <stop offset='100%' stop-color='#ffffff'/>
    </linearGradient>
    <filter id='cardShadow' x='-10%' y='-10%' width='130%' height='130%'>
      <feGaussianBlur in='SourceAlpha' stdDeviation='6'/>
      <feOffset dx='0' dy='3'/>
      <feFlood flood-color='#000000' flood-opacity='0.06'/>
      <feComposite in2='SourceGraphic' operator='in'/>
      <feMerge><feMergeNode/><feMergeNode in='SourceGraphic'/></feMerge>
    </filter>
  </defs>
  <g id='bg-layer'>
    <rect width='1280' height='720' fill='url(#bgGrad8)'/>
    <ellipse cx='0' cy='720' rx='350' ry='120' fill='#0250cc' fill-opacity='0.03'/>
    <ellipse cx='1280' cy='720' rx='350' ry='120' fill='#fdc800' fill-opacity='0.03'/>
  </g>
  <!-- 星尘 -->
  <g id='decor-dots'>
    <circle cx='200' cy='100' r='2' fill='#0250cc' fill-opacity='0.2'/>
    <circle cx='1100' cy='80' r='1.5' fill='#fdc800' fill-opacity='0.2'/>
    <path d='M150,150 Q156,143 162,150 Q156,157 150,150 Z' fill='#0250cc' fill-opacity='0.3'/>
    <path d='M1150,120 Q1158,112 1166,120 Q1158,128 1150,120 Z' fill='#fdc800' fill-opacity='0.25'/>
  </g>
  <!-- 页眉 -->
  <g id='page-header'>
    <text x='80' y='80' font-size='13' fill='#abaeb3' font-family='Inter,Noto Sans SC,sans-serif' letter-spacing='3'>重磅嘉宾</text>
    <rect x='80' y='95' width='40' height='3' rx='1.5' fill='#0250cc'/>
  </g>
  <!-- 标题 -->
  <g id='section-title'>
    <text x='80' y='165' font-size='38' font-weight='800' fill='#111827' font-family='Inter,Noto Sans SC,sans-serif'>
      重磅嘉宾阵容
    </text>
    <text x='80' y='200' font-size='15' fill='#70747d' font-family='Inter,Noto Sans SC,sans-serif'>跨越中日 · 声优·画师·导演齐聚一堂</text>
  </g>
  <!-- 嘉宾卡片 2x2 -->
  <g id='guest-cards' font-family='Inter,Noto Sans SC,sans-serif'>
    <!-- 嘉宾 1 -->
    <g filter='url(#cardShadow)'>
      <rect x='80' y='250' width='530' height='200' rx='20' fill='#f9f9f9'/>
      <rect x='80' y='250' width='530' height='5' rx='2.5' fill='#0250cc'/>
      <!-- 头像圆 -->
      <circle cx='140' cy='350' r='45' fill='#0250cc' fill-opacity='0.1'/>
      <text x='140' y='360' text-anchor='middle' font-size='28' fill='#0250cc'>🎙</text>
      <text x='205' y='310' font-size='22' font-weight='700' fill='#111827'>宫崎 骏</text>
      <rect x='205' y='324' width='60' height='20' rx='10' fill='#0250cc' fill-opacity='0.12'/>
      <text x='235' y='338' text-anchor='middle' font-size='11' fill='#0250cc' font-weight='600'>吉卜力创始人</text>
      <text x='205' y='370' font-size='14' fill='#70747d'>吉卜力工作室创始人之一</text>
      <text x='205' y='394' font-size='14' fill='#70747d'>动画电影大师 · 奥斯卡终身成就奖</text>
      <text x='205' y='420' font-size='13' fill='#0250cc' font-weight='600'>📅 8月15日 经典区</text>
    </g>
    <!-- 嘉宾 2 -->
    <g filter='url(#cardShadow)'>
      <rect x='670' y='250' width='530' height='200' rx='20' fill='#f9f9f9'/>
      <rect x='670' y='250' width='530' height='5' rx='2.5' fill='#fdc800'/>
      <circle cx='730' cy='350' r='45' fill='#fdc800' fill-opacity='0.1'/>
      <text x='730' y='360' text-anchor='middle' font-size='28' fill='#fdc800'>🎵</text>
      <text x='795' y='310' font-size='22' font-weight='700' fill='#111827'>久石 让</text>
      <rect x='795' y='324' width='70' height='20' rx='10' fill='#fdc800' fill-opacity='0.12'/>
      <text x='830' y='338' text-anchor='middle' font-size='11' fill='#fdc800' font-weight='600'>传奇作曲家</text>
      <text x='795' y='370' font-size='14' fill='#70747d'>吉卜力御用配乐大师</text>
      <text x='795' y='394' font-size='14' fill='#70747d'>《千与千寻》《龙猫》主题曲创作者</text>
      <text x='795' y='420' font-size='13' fill='#fdc800' font-weight='600'>📅 8月15日 交响音乐会</text>
    </g>
    <!-- 嘉宾 3 -->
    <g filter='url(#cardShadow)'>
      <rect x='80' y='480' width='530' height='200' rx='20' fill='#f9f9f9'/>
      <rect x='80' y='480' width='530' height='5' rx='2.5' fill='#0250cc' fill-opacity='0.7'/>
      <circle cx='140' cy='580' r='45' fill='#0250cc' fill-opacity='0.1'/>
      <text x='140' y='590' text-anchor='middle' font-size='28' fill='#0250cc'>🎨</text>
      <text x='205' y='540' font-size='22' font-weight='700' fill='#111827'>新海 诚</text>
      <rect x='205' y='554' width='70' height='20' rx='10' fill='#0250cc' fill-opacity='0.12'/>
      <text x='240' y='568' text-anchor='middle' font-size='11' fill='#0250cc' font-weight='600'>动画导演</text>
      <text x='205' y='600' font-size='14' fill='#70747d'>《你的名字。》《铃芽之旅》导演</text>
      <text x='205' y='624' font-size='14' fill='#70747d'>新世代动画美学代表人物</text>
      <text x='205' y='650' font-size='13' fill='#0250cc' fill-opacity='0.7' font-weight='600'>📅 8月16日 主舞台</text>
    </g>
    <!-- 嘉宾 4 -->
    <g filter='url(#cardShadow)'>
      <rect x='670' y='480' width='530' height='200' rx='20' fill='#f9f9f9'/>
      <rect x='670' y='480' width='530' height='5' rx='2.5' fill='#fdc800'/>
      <circle cx='730' cy='580' r='45' fill='#fdc800' fill-opacity='0.1'/>
      <text x='730' y='590' text-anchor='middle' font-size='28' fill='#fdc800'>🌸</text>
      <text x='795' y='540' font-size='22' font-weight='700' fill='#111827'>花江夏树</text>
      <rect x='795' y='554' width='70' height='20' rx='10' fill='#fdc800' fill-opacity='0.12'/>
      <text x='830' y='568' text-anchor='middle' font-size='11' fill='#fdc800' font-weight='600'>人气声优</text>
      <text x='795' y='600' font-size='14' fill='#70747d'>《鬼灭之刃》灶门炭治郎 CV</text>
      <text x='795' y='624' font-size='14' fill='#70747d'>代表作：《东京喰种》《四月是你的谎言》</text>
      <text x='795' y='650' font-size='13' fill='#fdc800' font-weight='600'>📅 8月16日 声优见面会</text>
    </g>
  </g>
  <g id='footer' font-family='Inter,Noto Sans SC,sans-serif'>
    <text x='1240' y='690' font-size='12' fill='#abaeb3' text-anchor='end'>08 / 11</text>
  </g>
  <!-- notes: 嘉宾阵容——"四位重量级嘉宾，横跨吉卜力元老、当代动画导演到一线声优。每个人都是单独见面会，机会难得。" -->
</svg>