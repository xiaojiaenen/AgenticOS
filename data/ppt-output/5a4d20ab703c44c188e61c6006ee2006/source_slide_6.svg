<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1280 720' data-theme='fantasy'>
  <defs>
    <linearGradient id='divGrad2' x1='0' y1='0' x2='0' y2='1'>
      <stop offset='0%' stop-color='#ffffff'/>
      <stop offset='50%' stop-color='#ffffff'/>
      <stop offset='100%' stop-color='#ffffff'/>
    </linearGradient>
    <linearGradient id='accentGrad6' x1='0' y1='0' x2='1' y2='0'>
      <stop offset='0%' stop-color='#fdc800'/>
      <stop offset='100%' stop-color='#0250cc'/>
    </linearGradient>
  </defs>
  <g id='bg-layer'>
    <rect width='1280' height='720' fill='url(#divGrad2)'/>
    <!-- 装饰圆环 -->
    <circle cx='640' cy='360' r='300' fill='none' stroke='#fdc800' stroke-width='1' stroke-opacity='0.04' stroke-dasharray='6,10'/>
    <circle cx='640' cy='360' r='220' fill='#fdc800' fill-opacity='0.02'/>
    <circle cx='640' cy='360' r='130' fill='none' stroke='#fdc800' stroke-width='0.5' stroke-opacity='0.05'/>
  </g>
  <!-- 星尘 -->
  <g id='decor-stars'>
    <path d='M250,150 Q256,143 262,150 Q256,157 250,150 Z' fill='#fdc800' fill-opacity='0.35'/>
    <path d='M1050,180 Q1058,172 1066,180 Q1058,188 1050,180 Z' fill='#0250cc' fill-opacity='0.3'/>
    <path d='M180,480 Q186,473 192,480 Q186,487 180,480 Z' fill='#fdc800' fill-opacity='0.25'/>
    <path d='M1150,500 Q1158,492 1166,500 Q1158,508 1150,500 Z' fill='#0250cc' fill-opacity='0.2'/>
    <circle cx='400' cy='100' r='2' fill='#fdc800' fill-opacity='0.2'/>
    <circle cx='900' cy='110' r='2.5' fill='#0250cc' fill-opacity='0.2'/>
    <circle cx='130' cy='320' r='1.5' fill='#fdc800' fill-opacity='0.2'/>
    <circle cx='1150' cy='300' r='2' fill='#0250cc' fill-opacity='0.2'/>
  </g>
  <g id='section-number' text-anchor='middle' font-family='Inter,Noto Sans SC,sans-serif'>
    <text x='640' y='340' font-size='200' font-weight='900' fill='#fdc800' fill-opacity='0.08'>02</text>
  </g>
  <g id='section-title' text-anchor='middle' font-family='Inter,Noto Sans SC,sans-serif'>
    <text x='640' y='320' font-size='14' fill='#fdc800' font-weight='600' letter-spacing='6'>CHAPTER 02</text>
    <text x='640' y='400' font-size='56' font-weight='800' fill='#111827' letter-spacing='4'>精彩活动</text>
    <rect x='590' y='430' width='100' height='3' rx='1.5' fill='url(#accentGrad6)'/>
    <text x='640' y='475' font-size='18' fill='#70747d' font-weight='400'>三日不间断 · 从早到晚的二次元狂欢</text>
    <rect x='520' y='520' width='240' height='1' fill='#c3c5c9'/>
    <circle cx='640' cy='520' r='3' fill='#fdc800' fill-opacity='0.5'/>
  </g>
  <g id='footer' font-family='Inter,Noto Sans SC,sans-serif'>
    <text x='1240' y='690' font-size='12' fill='#abaeb3' text-anchor='end'>06 / 11</text>
  </g>
  <!-- notes: 章节过渡——"看完展区，接下来说说这三天到底能玩什么。活动排得满满的，每一场都不想让你错过。" -->
</svg>