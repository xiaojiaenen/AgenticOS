<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1280 720' data-theme='fantasy'>
  <defs>
    <linearGradient id='divGrad1' x1='0' y1='0' x2='0' y2='1'>
      <stop offset='0%' stop-color='#ffffff'/>
      <stop offset='50%' stop-color='#ffffff'/>
      <stop offset='100%' stop-color='#ffffff'/>
    </linearGradient>
    <linearGradient id='accentGrad3' x1='0' y1='0' x2='1' y2='0'>
      <stop offset='0%' stop-color='#0250cc'/>
      <stop offset='100%' stop-color='#fdc800'/>
    </linearGradient>
  </defs>
  <g id='bg-layer'>
    <rect width='1280' height='720' fill='url(#divGrad1)'/>
    <!-- 大圆形装饰 -->
    <circle cx='640' cy='360' r='280' fill='none' stroke='#0250cc' stroke-width='1' stroke-opacity='0.04' stroke-dasharray='4,8'/>
    <circle cx='640' cy='360' r='200' fill='#0250cc' fill-opacity='0.02'/>
    <circle cx='640' cy='360' r='100' fill='none' stroke='#0250cc' stroke-width='0.5' stroke-opacity='0.06' stroke-dasharray='2,6'/>
  </g>
  <!-- 星尘 -->
  <g id='decor-stars'>
    <path d='M300,180 Q306,173 312,180 Q306,187 300,180 Z' fill='#0250cc' fill-opacity='0.4'/>
    <path d='M1000,200 Q1008,192 1016,200 Q1008,208 1000,200 Z' fill='#fdc800' fill-opacity='0.35'/>
    <path d='M200,500 Q206,493 212,500 Q206,507 200,500 Z' fill='#0250cc' fill-opacity='0.3'/>
    <path d='M1100,450 Q1108,442 1116,450 Q1108,458 1100,450 Z' fill='#fdc800' fill-opacity='0.25'/>
    <circle cx='450' cy='120' r='2' fill='#0250cc' fill-opacity='0.2'/>
    <circle cx='850' cy='100' r='2.5' fill='#fdc800' fill-opacity='0.2'/>
    <circle cx='120' cy='300' r='1.5' fill='#0250cc' fill-opacity='0.25'/>
    <circle cx='1180' cy='350' r='2' fill='#fdc800' fill-opacity='0.2'/>
  </g>
  <!-- 大数字 -->
  <g id='section-number' text-anchor='middle' font-family='Inter,Noto Sans SC,sans-serif'>
    <text x='640' y='340' font-size='200' font-weight='900' fill='#0250cc' fill-opacity='0.08'>01</text>
  </g>
  <!-- 主标题 -->
  <g id='section-title' text-anchor='middle' font-family='Inter,Noto Sans SC,sans-serif'>
    <text x='640' y='320' font-size='14' fill='#0250cc' font-weight='600' letter-spacing='6'>CHAPTER 01</text>
    <text x='640' y='400' font-size='56' font-weight='800' fill='#111827' letter-spacing='4'>展会概览</text>
    <rect x='590' y='430' width='100' height='3' rx='1.5' fill='url(#accentGrad3)'/>
    <text x='640' y='475' font-size='18' fill='#70747d' font-weight='400'>数据与规模 · 参展阵容 · 展区规划</text>
    <!-- 底部装饰条 -->
    <rect x='520' y='520' width='240' height='1' fill='#c3c5c9'/>
    <circle cx='640' cy='520' r='3' fill='#0250cc' fill-opacity='0.5'/>
  </g>
  <g id='footer' font-family='Inter,Noto Sans SC,sans-serif'>
    <text x='1240' y='690' font-size='12' fill='#abaeb3' text-anchor='end'>03 / 11</text>
  </g>
  <!-- notes: 章节过渡——"好了，接下来进入正题。先看看这届漫展的规模有多大，用数据说话。" -->
</svg>