<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1280 720' data-theme='fantasy'>
  <defs>
    <linearGradient id='bgGrad4' x1='0' y1='0' x2='0' y2='1'>
      <stop offset='0%' stop-color='#ffffff'/>
      <stop offset='100%' stop-color='#ffffff'/>
    </linearGradient>
  </defs>
  <g id='bg-layer'>
    <rect width='1280' height='720' fill='url(#bgGrad4)'/>
    <ellipse cx='200' cy='720' rx='300' ry='100' fill='#0250cc' fill-opacity='0.03'/>
    <ellipse cx='1080' cy='720' rx='350' ry='120' fill='#fdc800' fill-opacity='0.03'/>
  </g>
  <!-- 星尘 -->
  <g id='decor-dots'>
    <path d='M180,150 Q186,143 192,150 Q186,157 180,150 Z' fill='#0250cc' fill-opacity='0.3'/>
    <path d='M1100,180 Q1108,172 1116,180 Q1108,188 1100,180 Z' fill='#fdc800' fill-opacity='0.25'/>
    <circle cx='300' cy='80' r='2' fill='#0250cc' fill-opacity='0.2'/>
    <circle cx='1000' cy='100' r='1.5' fill='#fdc800' fill-opacity='0.25'/>
  </g>
  <!-- 页眉 -->
  <g id='page-header'>
    <text x='80' y='80' font-size='13' fill='#abaeb3' font-family='Inter,Noto Sans SC,sans-serif' letter-spacing='3'>展会数据</text>
    <rect x='80' y='95' width='40' height='3' rx='1.5' fill='#0250cc'/>
  </g>
  <!-- 标题 -->
  <g id='section-title'>
    <text x='80' y='165' font-size='38' font-weight='800' fill='#111827' font-family='Inter,Noto Sans SC,sans-serif'>
      以数据看规模
    </text>
    <text x='80' y='200' font-size='15' fill='#70747d' font-family='Inter,Noto Sans SC,sans-serif'>本届嘉年华创历届之最，四大核心指标全面突破</text>
  </g>
  <!-- KPI 网格 2x2 -->
  <g id='kpi-grid' font-family='Inter,Noto Sans SC,sans-serif'>
    <!-- KPI 1 -->
    <g transform='translate(80, 260)'>
      <rect width='540' height='190' rx='20' fill='#f9f9f9' stroke='#c3c5c9' stroke-width='1'/>
      <text x='40' y='55' font-size='14' fill='#abaeb3' letter-spacing='2'>参展品牌</text>
      <text x='40' y='120' font-size='56' font-weight='900' fill='#0250cc'>
        <tspan font-size='28' fill='#70747d'>+</tspan>200
      </text>
      <text x='40' y='155' font-size='14' fill='#16a34a' font-weight='600'>较上届增长<tspan font-weight='bold'>35%</tspan></text>
    </g>
    <!-- KPI 2 -->
    <g transform='translate(660, 260)'>
      <rect width='540' height='190' rx='20' fill='#f9f9f9' stroke='#c3c5c9' stroke-width='1'/>
      <text x='40' y='55' font-size='14' fill='#abaeb3' letter-spacing='2'>预计观众</text>
      <text x='40' y='120' font-size='56' font-weight='900' fill='#fdc800'>
        <tspan font-size='28' fill='#70747d'>~</tspan>5<tspan font-size='28'>万</tspan>
      </text>
      <text x='40' y='155' font-size='14' fill='#16a34a' font-weight='600'>覆盖全国<tspan font-weight='bold'>28</tspan>个省份</text>
    </g>
    <!-- KPI 3 -->
    <g transform='translate(80, 475)'>
      <rect width='540' height='190' rx='20' fill='#f9f9f9' stroke='#c3c5c9' stroke-width='1'/>
      <text x='40' y='55' font-size='14' fill='#abaeb3' letter-spacing='2'>特邀嘉宾</text>
      <text x='40' y='120' font-size='56' font-weight='900' fill='#0250cc'>
        <tspan font-size='28' fill='#70747d'>+</tspan>30<tspan font-size='28'>位</tspan>
      </text>
      <text x='40' y='155' font-size='14' fill='#70747d' font-weight='600'>日本·中国·欧美声优与创作者</text>
    </g>
    <!-- KPI 4 -->
    <g transform='translate(660, 475)'>
      <rect width='540' height='190' rx='20' fill='#f9f9f9' stroke='#c3c5c9' stroke-width='1'/>
      <text x='40' y='55' font-size='14' fill='#abaeb3' letter-spacing='2'>媒体曝光</text>
      <text x='40' y='120' font-size='56' font-weight='900' fill='#fdc800'>
        <tspan font-size='28' fill='#70747d'>+</tspan>100<tspan font-size='28'>家</tspan>
      </text>
      <text x='40' y='155' font-size='14' fill='#70747d' font-weight='600'>全媒体覆盖 · 预计触达<tspan font-weight='bold'>5000万+</tspan></text>
    </g>
  </g>
  <g id='footer' font-family='Inter,Noto Sans SC,sans-serif'>
    <text x='1240' y='690' font-size='12' fill='#abaeb3' text-anchor='end'>04 / 11</text>
  </g>
  <!-- notes: KPIs——"先看四个硬数字：200多家参展品牌、预计5万观众、30多位重磅嘉宾、100多家媒体到场。每一项都比去年有大幅增长。" -->
</svg>