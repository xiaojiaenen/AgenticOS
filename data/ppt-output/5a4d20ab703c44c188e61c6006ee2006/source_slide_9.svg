    <circle cx='500' cy='120' r='2' fill='#0250cc' fill-opacity='0.2'/>
    <circle cx='800' cy='100' r='2.5' fill='#fdc800' fill-opacity='0.2'/>
  </g>
  <g id='section-number' text-anchor='middle' font-family='Inter,Noto Sans SC,sans-serif'>
    <text x='640' y='340' font-size='200' font-weight='900' fill='#0250cc' fill-opacity='0.08'>03</text>
  </g>
  <g id='section-title' text-anchor='middle' font-family='Inter,Noto Sans SC,sans-serif'>
