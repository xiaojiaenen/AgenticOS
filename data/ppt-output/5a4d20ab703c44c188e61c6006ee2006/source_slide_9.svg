<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1280 720' data-theme='fantasy'>
  <defs>
    <linearGradient id='divGrad3' x1='0' y1='0' x2='0' y2='1'>
      <stop offset='0%' stop-color='#ffffff'/>
      <stop offset='50%' stop-color='#ffffff'/>
      <stop offset='100%' stop-color='#ffffff'/>
    </linearGradient>
    <linearGradient id='accentGrad9' x1='0' y1='0' x2='1' y2='0'>
      <stop offset='0%' stop-color='#0250cc'/>
      <stop offset='100%' stop-color='#fdc800'/>
    </linearGradient>
  </defs>
  <g id='bg-layer'>
    <rect width='1280' height='720' fill='url(#divGrad3)'/>
    <circle cx='640' cy='360' r='320' fill='none' stroke='#0250cc' stroke-width='1' stroke-opacity='0.04' stroke-dasharray='5,12'/>
    <circle cx='640' cy='360' r='240' fill='#0250cc' fill-opacity='0.015'/>
    <circle cx='640' cy='360' r='150' fill='none' stroke='#0250cc' stroke-width='0.5' stroke-opacity='0.05' stroke-dasharray='3,8'/>
  </g>
  <!-- 星尘 -->
  <g id='decor-stars'>
    <path d='M280,200 Q286,193 292,200 Q286,207 280,200 Z' fill='#0250cc' fill-opacity='0.35'/>
    <path d='M1020,220 Q1028,212 1036,220 Q1028,228 1020,220 Z' fill='#fdc800' fill-opacity='0.3'/>
    <path d='M200,500 Q206,493 212,500 Q206,507 200,500 Z' fill='#0250cc' fill-opacity='0.25'/>
