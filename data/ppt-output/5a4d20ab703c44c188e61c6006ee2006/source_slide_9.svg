  </g>
  <g id='footer' font-family='Inter,Noto Sans SC,sans-serif'>
    <text x='1240' y='690' font-size='12' fill='#abaeb3' text-anchor='end'>09 / 11</text>
  </g>
  <!-- notes: 章节过渡——"最后一章，聊聊怎么参与进来。票种、价格、交通，全给你们安排明白。" -->
