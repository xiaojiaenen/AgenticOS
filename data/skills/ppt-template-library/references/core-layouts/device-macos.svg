<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-theme="apple">
  <!-- 背景 -->
  <g id="background">
    <rect width="1280" height="720" fill="var(--bg)"/>
  </g>

  <!-- macOS 窗口 -->
  <g id="macos-window" transform="translate(140, 40)">
    <!-- 窗口阴影 -->
    <rect x="6" y="6" width="1000" height="600" rx="12" fill="var(--text-1)" opacity="0.08"/>
    <!-- 窗口主体 -->
    <rect x="0" y="0" width="1000" height="600" rx="12" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>

    <!-- 标题栏 -->
    <rect x="0" y="0" width="1000" height="36" rx="12" fill="var(--surface-2)"/>
    <rect x="0" y="18" width="1000" height="18" fill="var(--surface-2)"/>

    <!-- 红绿灯 -->
    <circle cx="20" cy="18" r="6" fill="#FF5F57"/>
    <circle cx="40" cy="18" r="6" fill="#FEBC2E"/>
    <circle cx="60" cy="18" r="6" fill="#28C840"/>

    <!-- 窗口标题 -->
    <text x="500" y="22" font-size="12" font-weight="500" fill="var(--text-2)" font-family="Inter,sans-serif" text-anchor="middle">应用名称</text>

    <!-- 工具栏 -->
    <rect x="0" y="36" width="1000" height="32" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>
    <text x="20" y="56" font-size="11" fill="var(--text-3)" font-family="Inter,sans-serif">文件</text>
    <text x="60" y="56" font-size="11" fill="var(--text-3)" font-family="Inter,sans-serif">编辑</text>
    <text x="100" y="56" font-size="11" fill="var(--text-3)" font-family="Inter,sans-serif">视图</text>
    <text x="140" y="56" font-size="11" fill="var(--text-3)" font-family="Inter,sans-serif">窗口</text>

    <!-- 侧边栏 -->
    <rect x="0" y="68" width="180" height="532" fill="var(--surface-2)"/>
    <text x="20" y="100" font-size="11" font-weight="600" fill="var(--text-3)" font-family="Inter,sans-serif">导航</text>
    <rect x="12" y="112" width="156" height="28" rx="6" fill="var(--accent)" opacity="0.1"/>
    <text x="24" y="130" font-size="12" font-weight="500" fill="var(--accent)" font-family="Inter,sans-serif">概览</text>
    <text x="24" y="162" font-size="12" fill="var(--text-2)" font-family="Inter,sans-serif">数据分析</text>
    <text x="24" y="192" font-size="12" fill="var(--text-2)" font-family="Inter,sans-serif">用户管理</text>
    <text x="24" y="222" font-size="12" fill="var(--text-2)" font-family="Inter,sans-serif">设置</text>

    <!-- 主内容区 -->
    <rect x="180" y="68" width="820" height="532" fill="var(--bg)"/>

    <!-- 内容：标题 -->
    <text x="210" y="110" font-size="20" font-weight="700" fill="var(--text-1)" font-family="Inter,Noto Sans SC,sans-serif">仪表盘概览</text>

    <!-- 内容：统计卡片 -->
    <rect x="210" y="130" width="240" height="100" rx="10" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
    <text x="230" y="160" font-size="12" fill="var(--text-3)" font-family="Inter,sans-serif">总用户</text>
    <text x="230" y="195" font-size="28" font-weight="700" fill="var(--text-1)" font-family="Inter,sans-serif">12,847</text>
    <text x="230" y="218" font-size="11" fill="var(--good)" font-family="Inter,sans-serif">↑ 12.5%</text>

    <rect x="470" y="130" width="240" height="100" rx="10" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
    <text x="490" y="160" font-size="12" fill="var(--text-3)" font-family="Inter,sans-serif">活跃用户</text>
    <text x="490" y="195" font-size="28" font-weight="700" fill="var(--text-1)" font-family="Inter,sans-serif">8,234</text>
    <text x="490" y="218" font-size="11" fill="var(--good)" font-family="Inter,sans-serif">↑ 8.3%</text>

    <rect x="730" y="130" width="240" height="100" rx="10" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
    <text x="750" y="160" font-size="12" fill="var(--text-3)" font-family="Inter,sans-serif">转化率</text>
    <text x="750" y="195" font-size="28" font-weight="700" fill="var(--accent)" font-family="Inter,sans-serif">3.2%</text>
    <text x="750" y="218" font-size="11" fill="var(--good)" font-family="Inter,sans-serif">↑ 0.8%</text>

    <!-- 内容：图表区域 -->
    <rect x="210" y="250" width="520" height="200" rx="10" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
    <text x="230" y="280" font-size="13" font-weight="600" fill="var(--text-1)" font-family="Inter,sans-serif">用户增长趋势</text>
    <!-- 模拟折线图 -->
    <polyline points="230,400 310,380 390,350 470,370 550,320 630,300 690,290" fill="none" stroke="var(--accent)" stroke-width="2"/>
    <polyline points="230,400 310,390 390,380 470,385 550,360 630,340 690,330" fill="none" stroke="var(--text-3)" stroke-width="1" stroke-dasharray="4,4"/>

    <!-- 内容：最近活动 -->
    <rect x="750" y="250" width="220" height="200" rx="10" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
    <text x="770" y="280" font-size="13" font-weight="600" fill="var(--text-1)" font-family="Inter,sans-serif">最近活动</text>
    <text x="770" y="310" font-size="11" fill="var(--text-2)" font-family="Inter,sans-serif">• 新用户注册 +23</text>
    <text x="770" y="335" font-size="11" fill="var(--text-2)" font-family="Inter,sans-serif">• 订单完成 +156</text>
    <text x="770" y="360" font-size="11" fill="var(--text-2)" font-family="Inter,sans-serif">• 反馈提交 +8</text>
    <text x="770" y="385" font-size="11" fill="var(--text-2)" font-family="Inter,sans-serif">• 系统更新 v2.1</text>
  </g>

  <!-- 页脚 -->
  <g id="footer">
    <text x="80" y="700" font-size="11" fill="var(--text-3)" font-family="Inter,sans-serif">Desktop App Preview</text>
    <text x="1200" y="700" font-size="11" fill="var(--text-3)" font-family="Inter,sans-serif" text-anchor="end">01</text>
  </g>

  <!-- notes: macOS 桌面应用展示页——完整的 macOS 窗口框架，含侧边栏导航和仪表盘内容 -->
</svg>
