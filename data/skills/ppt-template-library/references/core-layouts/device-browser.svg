<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-theme="apple">
  <!-- 背景 -->
  <g id="background">
    <rect width="1280" height="720" fill="var(--bg)"/>
  </g>

  <!-- 浏览器窗口 -->
  <g id="browser-window" transform="translate(40, 30)">
    <!-- 窗口阴影 -->
    <rect x="4" y="4" width="1200" height="620" rx="12" fill="var(--text-1)" opacity="0.1"/>
    <!-- 窗口主体 -->
    <rect x="0" y="0" width="1200" height="620" rx="12" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>

    <!-- 标题栏 -->
    <rect x="0" y="0" width="1200" height="40" rx="12" fill="var(--surface-2)"/>
    <rect x="0" y="20" width="1200" height="20" fill="var(--surface-2)"/>

    <!-- 红绿灯 -->
    <circle cx="20" cy="20" r="6" fill="#FF5F57"/>
    <circle cx="40" cy="20" r="6" fill="#FEBC2E"/>
    <circle cx="60" cy="20" r="6" fill="#28C840"/>

    <!-- 标签页 -->
    <rect x="90" y="8" width="160" height="24" rx="6" fill="var(--bg)"/>
    <text x="170" y="24" font-size="11" fill="var(--text-2)" font-family="Inter,sans-serif" text-anchor="middle">首页 - My App</text>

    <!-- 地址栏 -->
    <rect x="270" y="8" width="660" height="24" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>
    <text x="290" y="24" font-size="11" fill="var(--text-3)" font-family="Inter,sans-serif">🔒 myapp.com</text>

    <!-- 导航按钮 -->
    <text x="960" y="24" font-size="14" fill="var(--text-3)" font-family="Inter,sans-serif">←</text>
    <text x="980" y="24" font-size="14" fill="var(--text-3)" font-family="Inter=sans-serif">→</text>
    <text x="1010" y="24" font-size="14" fill="var(--text-3)" font-family="Inter,sans-serif">↻</text>

    <!-- 网页内容：Hero 区域 -->
    <rect x="0" y="40" width="1200" height="200" fill="var(--bg)"/>
    <text x="600" y="130" font-size="36" font-weight="800" fill="var(--text-1)" font-family="Inter,Noto Sans SC,sans-serif" text-anchor="middle">产品名称</text>
    <text x="600" y="170" font-size="16" fill="var(--text-2)" font-family="Inter,Noto Sans SC,sans-serif" text-anchor="middle">一句话描述这个产品的核心价值主张</text>
    <rect x="540" y="190" width="120" height="36" rx="8" fill="var(--accent)"/>
    <text x="600" y="213" font-size="13" font-weight="600" fill="white" font-family="Inter,sans-serif" text-anchor="middle">开始使用</text>

    <!-- 网页内容：特性卡片区 -->
    <g transform="translate(0, 260)">
      <!-- 卡片 1 -->
      <rect x="60" y="0" width="340" height="140" rx="10" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>
      <rect x="80" y="20" width="36" height="36" rx="8" fill="var(--accent)" opacity="0.15"/>
      <text x="130" y="44" font-size="14" font-weight="600" fill="var(--text-1)" font-family="Inter,sans-serif">特性一</text>
      <text x="80" y="80" font-size="12" fill="var(--text-2)" font-family="Inter,sans-serif">简短描述这个特性的价值</text>
      <text x="80" y="110" font-size="11" fill="var(--accent)" font-family="Inter,sans-serif">了解更多 →</text>

      <!-- 卡片 2 -->
      <rect x="430" y="0" width="340" height="140" rx="10" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>
      <rect x="450" y="20" width="36" height="36" rx="8" fill="var(--good)" opacity="0.15"/>
      <text x="500" y="44" font-size="14" font-weight="600" fill="var(--text-1)" font-family="Inter,sans-serif">特性二</text>
      <text x="450" y="80" font-size="12" fill="var(--text-2)" font-family="Inter,sans-serif">简短描述这个特性的价值</text>
      <text x="450" y="110" font-size="11" fill="var(--accent)" font-family="Inter,sans-serif">了解更多 →</text>

      <!-- 卡片 3 -->
      <rect x="800" y="0" width="340" height="140" rx="10" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>
      <rect x="820" y="20" width="36" height="36" rx="8" fill="var(--warn)" opacity="0.15"/>
      <text x="870" y="44" font-size="14" font-weight="600" fill="var(--text-1)" font-family="Inter,sans-serif">特性三</text>
      <text x="820" y="80" font-size="12" fill="var(--text-2)" font-family="Inter,sans-serif">简短描述这个特性的价值</text>
      <text x="820" y="110" font-size="11" fill="var(--accent)" font-family="Inter,sans-serif">了解更多 →</text>
    </g>

    <!-- 页脚区域 -->
    <rect x="0" y="560" width="1200" height="60" fill="var(--surface-2)"/>
    <text x="600" y="595" font-size="11" fill="var(--text-3)" font-family="Inter,sans-serif" text-anchor="middle">© 2026 My App. All rights reserved.</text>
  </g>

  <!-- 页脚 -->
  <g id="footer">
    <text x="80" y="700" font-size="11" fill="var(--text-3)" font-family="Inter,sans-serif">Website Design Preview</text>
    <text x="1200" y="700" font-size="11" fill="var(--text-3)" font-family="Inter,sans-serif" text-anchor="end">01</text>
  </g>

  <!-- notes: 浏览器窗口展示页——完整的 Chrome 浏览器框架内展示网站设计，含标题栏/地址栏/网页内容 -->
</svg>
