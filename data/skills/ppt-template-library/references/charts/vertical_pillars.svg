<svg data-theme="theme-name" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
    <!--
    Vertical Pillars Template
    Structure: 1×N vertical column layout (typically 1×3, 1×4, or 1×5) where each pillar = one independent category with title + bullets
    Use cases: PEST/PESTLE (Political/Economic/Social/Technological), four-pillar strategy overview, side-by-side independent categories without comparison axis
    Design Principles: Clean vertical pillars with distinctive accent colors and structured text hierarchy
    -->
    <defs>
        <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
            <feOffset dx="0" dy="4"/>
            <feFlood flood-color="var(--text-1)" flood-opacity="0.04"/>
            <feComposite in2="SourceAlpha" operator="in"/>
            <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
    </defs>
    <rect width="1280" height="720" fill="var(--bg-soft)"/>
    <!-- ==================== Header ==================== -->
    <text x="80" y="70" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="32" font-weight="800" fill="var(--text-1)">PEST Macro-Environment Analysis</text>
    <text x="80" y="100" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="var(--text-3)" letter-spacing="1">EXTERNAL STRATEGIC FACTORS IMPACTING MARKET ENTRY</text>
    <!-- ==================== PEST Columns ==================== -->
    <g transform="translate(80, 150)">
        <!-- 1. Political (P) -->
        <g transform="translate(0, 0)">
            <!-- Background Card -->
            <rect width="260" height="480" rx="12" fill="var(--bg)" stroke="var(--border)" stroke-width="1.5" filter="url(#cardShadow)"/>
            <!-- Top-rounded Header Block (圆顶角分区头) -->
            <path d="M 12 0 h 236 a 12 12 0 0 1 12 12 v 108 h -260 v -108 a 12 12 0 0 1 12 -12 Z" fill="#EFF6FF"/>
            <text x="130" y="55" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="48" font-weight="900" fill="var(--accent-2)" text-anchor="middle">P</text>
            <text x="130" y="90" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="800" fill="#1E3A8A" text-anchor="middle">POLITICAL</text>
            <line x1="20" y1="120" x2="240" y2="120" stroke="#BFDBFE" stroke-width="2"/>
            <!-- Bullet Points -->
            <circle cx="30" cy="160" r="4" fill="var(--accent)"/>
            <text x="45" y="165" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="var(--text-1)">Trade Tariffs</text>
            <text x="45" y="185" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="var(--text-2)">Pending cross-border trade</text>
            <text x="45" y="205" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="var(--text-2)">regulations affecting COGS.</text>
            <circle cx="30" cy="240" r="4" fill="var(--accent)"/>
            <text x="45" y="245" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="var(--text-1)">Data Privacy Laws</text>
            <text x="45" y="265" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="var(--text-2)">Strict GDPR compliance</text>
            <text x="45" y="285" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="var(--text-2)">required for EU expansion.</text>
            <circle cx="30" cy="320" r="4" fill="var(--accent)"/>
            <text x="45" y="325" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="var(--text-1)">Government Subsidies</text>
            <text x="45" y="345" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="var(--text-2)">New grants available for</text>
            <text x="45" y="365" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="var(--text-2)">green tech initiatives.</text>
        </g>
        <!-- 2. Economic (E) -->
        <g transform="translate(286, 0)">
            <rect width="260" height="480" rx="12" fill="var(--bg)" stroke="var(--border)" stroke-width="1.5" filter="url(#cardShadow)"/>
            <path d="M 12 0 h 236 a 12 12 0 0 1 12 12 v 108 h -260 v -108 a 12 12 0 0 1 12 -12 Z" fill="var(--surface)"/>
            <text x="130" y="55" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="48" font-weight="900" fill="var(--good)" text-anchor="middle">E</text>
            <text x="130" y="90" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="800" fill="#064E3B" text-anchor="middle">ECONOMIC</text>
            <line x1="20" y1="120" x2="240" y2="120" stroke="#A7F3D0" stroke-width="2"/>
            <!-- Bullet Points -->
            <circle cx="30" cy="160" r="4" fill="var(--good)"/>
            <text x="45" y="165" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="var(--text-1)">Inflation Rates</text>
            <text x="45" y="185" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="var(--text-2)">Rising inflation decreasing</text>
            <text x="45" y="205" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="var(--text-2)">consumer purchasing power.</text>
            <circle cx="30" cy="240" r="4" fill="var(--good)"/>
            <text x="45" y="245" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="var(--text-1)">Exchange Rates</text>
            <text x="45" y="265" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="var(--text-2)">Currency volatility impacting</text>
            <text x="45" y="285" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="var(--text-2)">export profit margins.</text>
            <circle cx="30" cy="320" r="4" fill="var(--good)"/>
            <text x="45" y="325" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="var(--text-1)">Interest Rates</text>
            <text x="45" y="345" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="var(--text-2)">Higher borrowing costs</text>
            <text x="45" y="365" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="var(--text-2)">for upcoming capital project.</text>
        </g>
        <!-- 3. Social (S) -->
        <g transform="translate(572, 0)">
            <rect width="260" height="480" rx="12" fill="var(--bg)" stroke="var(--border)" stroke-width="1.5" filter="url(#cardShadow)"/>
            <path d="M 12 0 h 236 a 12 12 0 0 1 12 12 v 108 h -260 v -108 a 12 12 0 0 1 12 -12 Z" fill="#FFFBEB"/>
            <text x="130" y="55" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="48" font-weight="900" fill="var(--warn)" text-anchor="middle">S</text>
            <text x="130" y="90" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="800" fill="#78350F" text-anchor="middle">SOCIAL</text>
            <line x1="20" y1="120" x2="240" y2="120" stroke="#FDE68A" stroke-width="2"/>
            <!-- Bullet Points -->
            <circle cx="30" cy="160" r="4" fill="var(--warn)"/>
            <text x="45" y="165" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="var(--text-1)">Demographic Shifts</text>
            <text x="45" y="185" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="var(--text-2)">Aging population creates</text>
            <text x="45" y="205" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="var(--text-2)">demand for healthcare tech.</text>
            <circle cx="30" cy="240" r="4" fill="var(--warn)"/>
            <text x="45" y="245" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="var(--text-1)">Workplace Trends</text>
            <text x="45" y="265" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="var(--text-2)">Permanent shift towards</text>
            <text x="45" y="285" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="var(--text-2)">hybrid and remote work.</text>
            <circle cx="30" cy="320" r="4" fill="var(--warn)"/>
            <text x="45" y="325" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="var(--text-1)">Consumer Attitudes</text>
            <text x="45" y="345" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="var(--text-2)">Increasing preference for</text>
            <text x="45" y="365" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="var(--text-2)">sustainable products.</text>
        </g>
        <!-- 4. Technological (T) -->
        <g transform="translate(858, 0)">
            <rect width="260" height="480" rx="12" fill="var(--bg)" stroke="var(--border)" stroke-width="1.5" filter="url(#cardShadow)"/>
            <path d="M 12 0 h 236 a 12 12 0 0 1 12 12 v 108 h -260 v -108 a 12 12 0 0 1 12 -12 Z" fill="#F3E8FF"/>
            <text x="130" y="55" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="48" font-weight="900" fill="#9333EA" text-anchor="middle">T</text>
            <text x="130" y="90" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="800" fill="#4C1D95" text-anchor="middle">TECHNOLOGICAL</text>
            <line x1="20" y1="120" x2="240" y2="120" stroke="#D8B4FE" stroke-width="2"/>
            <!-- Bullet Points -->
            <circle cx="30" cy="160" r="4" fill="#A855F7"/>
            <text x="45" y="165" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="var(--text-1)">AI Automation</text>
            <text x="45" y="185" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="var(--text-2)">Generative AI threatening</text>
            <text x="45" y="205" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="var(--text-2)">legacy software models.</text>
            <circle cx="30" cy="240" r="4" fill="#A855F7"/>
            <text x="45" y="245" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="var(--text-1)">Infrastructure</text>
            <text x="45" y="265" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="var(--text-2)">5G rollout enables new</text>
            <text x="45" y="285" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="var(--text-2)">IoT product capabilities.</text>
            <circle cx="30" cy="320" r="4" fill="#A855F7"/>
            <text x="45" y="325" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="var(--text-1)">Cybersecurity Risk</text>
            <text x="45" y="345" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="var(--text-2)">Escalating threat landscape</text>
            <text x="45" y="365" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="var(--text-2)">requires higher R&amp;D spend.</text>
        </g>
    </g>
</svg>
