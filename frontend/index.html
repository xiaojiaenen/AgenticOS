<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgenticOS 前端</title>
    <style>
      .skip-link {
        position: fixed;
        top: 16px;
        left: 50%;
        z-index: 9999;
        transform: translateX(-50%) translateY(-120%);
        clip: rect(0 0 0 0);
        clip-path: inset(50%);
        white-space: nowrap;
      }
      .skip-link:focus {
        clip: auto;
        clip-path: none;
        transform: translateX(-50%) translateY(0);
        border-radius: 16px;
        background: rgba(255,255,255,0.95);
        padding: 12px 20px;
        font-size: 14px;
        font-weight: 700;
        color: #1e293b;
        box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        outline: 2px solid rgba(56,189,248,0.5);
        backdrop-filter: blur(12px);
      }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#main-content">跳转到主要内容</a>
    <div id="root">
      <!-- JS 加载失败时的降级提示 -->
      <div id="fallback-msg" style="display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:system-ui,sans-serif;color:#475569;text-align:center;padding:2rem;">
        <div>
          <h1 style="font-size:1.25rem;font-weight:600;margin-bottom:0.5rem;">AgenticOS</h1>
          <p style="font-size:0.875rem;">页面加载中…如果长时间无响应，请尝试使用最新版 Chrome / Edge 浏览器。</p>
        </div>
      </div>
    </div>
    <noscript>
      <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:system-ui,sans-serif;color:#475569;text-align:center;padding:2rem;">
        <div>
          <h1 style="font-size:1.25rem;font-weight:600;margin-bottom:0.5rem;">AgenticOS</h1>
          <p style="font-size:0.875rem;">本应用需要启用 JavaScript。请在浏览器设置中开启 JavaScript 后刷新页面。</p>
          <p style="font-size:0.75rem;margin-top:1rem;color:#94a3b8;">推荐使用 Chrome 109+ 或 Edge 109+ 浏览器以获得最佳体验。</p>
        </div>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
