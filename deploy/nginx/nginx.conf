worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # 上游用变量 + resolver 表达，而不是 upstream 块里写死主机名。
    #
    # 为什么必须这样：nginx 只在**启动时**解析一次 proxy_pass 里的域名，
    # 之后一直用缓存的那个 IP。docker compose 重建 backend 后容器 IP 会变
    # （实测 172.18.0.4 → 172.18.0.3），nginx 仍连旧 IP →
    # `connect() failed (111: Connection refused)` → 前端全部 502。
    #
    # 用变量（$backend_upstream）时 nginx 在**每次请求**都走 resolver，
    # 配合 compose 内置 DNS（127.0.0.11）即可自动跟随 IP 变化。
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # 安全头
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # 部署的网站（管理员审批后上线）
        # 私密站点产物目录：nginx 直接拒绝 —— 私密访问必须走后端
        # /api/v1/website/site/{slug}/?t=<30天签名>（归属校验 + 可重置）。
        # 不挡的话「私密」站点会出现在公开路径上，形同虚设。
        # 短链入口：/s/<8位码> 由后端解析 302 到真实站点目录。
        # 不直接 alias 静态目录 —— 短码与目录名是多对一映射（重新部署会换码），
        # 由后端维护映射表并负责「已下架」的语义化 404。
        # 与 /api/ 同理：主机名必须写成变量（容器换 IP 后仍可用），
        # 且必须显式带 $request_uri（否则 URI 被替换成 /s/）。
        location /s/ {
            set $shortlink_upstream backend:8000;
            proxy_pass http://$shortlink_upstream$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }

        location /sites/_private/ {
            deny all;
            return 404;
        }

        location /sites/ {
            alias /usr/share/nginx/sites/;
            try_files $uri $uri/ =404;
            autoindex off;

            # 静态资源缓存
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 7d;
                add_header Cache-Control "public";
            }
        }

        # API 反向代理
        #
        # 两个必须同时满足的约束：
        # 1) 上游主机名要写成**变量**，nginx 才会每次请求都重新解析 ——
        #    写死 `proxy_pass http://backend:8000/api/` 只在启动时解析一次，
        #    backend 容器重建换 IP 后全部 502（实测 172.18.0.4 → 172.18.0.3）。
        # 2) 一旦用了变量，nginx 就不再按 location 前缀改写 URI：它会拿
        #    指令里写的 URI 段**替换**整个原始路径。所以必须显式带上
        #    $request_uri，否则 /api/v1/health/ 会被改写成 /api/ → 404。
        location /api/ {
            set $backend_upstream backend:8000;
            proxy_pass http://$backend_upstream$request_uri;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE 支持
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;

            # 上游还没起来时短暂重试，避免容器刚重启的几秒里直接 502
            proxy_next_upstream error timeout http_502 http_503;
            proxy_connect_timeout 5s;
        }

        # OpenAI 兼容网关（/v1/models、/v1/chat/completions 等）转发到后端
        location /v1/ {
            set $backend_upstream backend:8000;
            proxy_pass http://$backend_upstream$request_uri;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            proxy_next_upstream error timeout http_502 http_503;
            proxy_connect_timeout 5s;
        }

        # 前端 SPA 路由
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
