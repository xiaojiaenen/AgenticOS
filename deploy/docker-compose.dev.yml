# 开发环境配置 — 代码卷挂载，无需每次重建镜像
# 用法: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# 优势：
#   - 修改 Python/JS 代码后自动生效（uvicorn --reload / vite HMR）
#   - 无需 rebuild 镜像
#   - 数据卷共享（和生产环境一致）
#
# 劣势：
#   - 首次需要本地安装依赖（uv sync / npm install）
#   - 依赖版本可能和镜像内不一致

name: agenticos-dev

services:
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
      target: base  # 只构建基础层，不 COPY 代码
    volumes:
      - ../backend/app:/app/app          # 代码热加载
      - ../backend/main.py:/app/main.py  # 启动脚本
      - ../backend/pyproject.toml:/app/pyproject.toml
      - ../data:/app/data
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - ENVIRONMENT=development
      - CORS_ALLOW_ORIGINS=http://localhost:3001,http://localhost:5173

  frontend:
    # 开发模式用 Vite dev server，不用 nginx
    image: node:20-slim
    working_dir: /app
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 3001
    ports:
      - "3001:3001"
    environment:
      - VITE_API_PROXY_TARGET=http://backend:8000
    depends_on:
      - backend

volumes:
  frontend_node_modules:
