services:
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    restart: unless-stopped
    environment:
      # 数据库配置
      DATABASE_URL: ${DATABASE_URL:-sqlite:///./data/agenticos.db}

      # OpenAI 配置
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4}

      # 认证配置
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-change-this-to-a-long-random-secret}
      AUTH_TOKEN_EXPIRE_MINUTES: ${AUTH_TOKEN_EXPIRE_MINUTES:-10080}

      # Skill 配置
      SKILL_STORAGE_DIR: ${SKILL_STORAGE_DIR:-./data/skills}

      # 其他配置
      ENVIRONMENT: ${ENVIRONMENT:-production}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:3001}
    volumes:
      # 数据持久化
      - ../data:/app/data
    ports:
      - "${BACKEND_PORT:-8001}:8001"

  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3001}:80"
    depends_on:
      - backend
