name: agenticos

services:
  backend:
    image: ${IMAGE_REGISTRY:-172.73.0.156:85}/agenticos-backend:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
      network: host
      args:
        BASE_REGISTRY: ${BASE_REGISTRY:-172.73.0.156:85}
        PYPI_MIRROR: ${PYPI_MIRROR:-https://pypi.org/simple}
    restart: always
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          cpus: "0.5"
          memory: 1G
    read_only: true
    tmpfs:
      - /tmp:size=512M
      - /var/tmp:size=256M
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8000/api/v1/health/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    environment:
      # 数据库
      DATABASE_URL: ${DATABASE_URL:-mysql+pymysql://user:password@host:3306/agenticos}

      # OpenAI
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4}

      # 认证
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY}
      AUTH_TOKEN_EXPIRE_MINUTES: ${AUTH_TOKEN_EXPIRE_MINUTES:-10080}

      # 环境
      ENVIRONMENT: ${ENVIRONMENT:-production}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:3001}

      # Redis（留空则使用内存 fallback）
      REDIS_URL: ${REDIS_URL:-}
      REDIS_CLUSTER: ${REDIS_CLUSTER:-false}

      # 系统通知邮箱
      NOTIFY_EMAIL_ADDRESS: ${NOTIFY_EMAIL_ADDRESS:-}
      NOTIFY_EMAIL_PASSWORD: ${NOTIFY_EMAIL_PASSWORD:-}
      NOTIFY_SMTP_HOST: ${NOTIFY_SMTP_HOST:-}
      NOTIFY_SMTP_PORT: ${NOTIFY_SMTP_PORT:-465}
      NOTIFY_SMTP_SSL: ${NOTIFY_SMTP_SSL:-true}
      NOTIFY_TASK_MIN_SECONDS: ${NOTIFY_TASK_MIN_SECONDS:-120}

      # OpenBLAS
      OPENBLAS_NUM_THREADS: 1

      # Skill
      SKILL_STORAGE_DIR: ${SKILL_STORAGE_DIR:-./data/skills}
    volumes:
      - ../data:/app/data
    ports:
      - "${BACKEND_PORT:-10007}:8000"

  frontend:
    image: ${IMAGE_REGISTRY:-172.73.0.156:85}/agenticos-frontend:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
      args:
        BASE_REGISTRY: ${BASE_REGISTRY:-172.73.0.156:85}
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    ports:
      - "${FRONTEND_PORT:-10008}:80"
    volumes:
      - ../data/nginx-serve:/usr/share/nginx/sites
    depends_on:
      backend:
        condition: service_healthy
