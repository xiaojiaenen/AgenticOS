name: agenticos

# 内网离线部署编排：外部 MySQL + 外部 Redis（既有基础设施）
# 与 docker-compose.runtime.yml 的差别：
#   - 强制 HF 离线开关（内网无外网出口，嵌入模型已随包带）
#   - 不带 BASE_REGISTRY/IMAGE_REGISTRY 构建（镜像直接用导入的 agenticos-runtime）
# 两者都使用外部 MySQL / Redis，compose 内无数据库与缓存容器
#
# 用法：
#   cp .env.offline.example .env
#   docker compose -f docker-compose.offline.yml up -d

x-backend-env: &backend-env
  # Redis 配置（留空则使用内存 fallback）
  DATABASE_URL: ${DATABASE_URL}
  REDIS_URL: ${REDIS_URL}
  REDIS_CLUSTER: ${REDIS_CLUSTER:-false}
  # 任务队列(arq)专用 Redis：arq 不支持 Redis Cluster，业务缓存用 cluster
  # 时必须单独给一个 standalone 端点（详见 deploy/OFFLINE-DEPS.md）。
  # 单机部署（REDIS_CLUSTER=false）留空即可，自动复用 REDIS_URL。
  ARQ_REDIS_URL: ${ARQ_REDIS_URL:-}
  # 认证与加密
  AUTH_SECRET_KEY: ${AUTH_SECRET_KEY}
  EXTERNAL_SYSTEM_ENCRYPTION_KEY: ${EXTERNAL_SYSTEM_ENCRYPTION_KEY:-}
  AUTH_TOKEN_EXPIRE_MINUTES: ${AUTH_TOKEN_EXPIRE_MINUTES:-10080}
  # LLM（配了「AI 提供商」后仅作兜底）
  OPENAI_API_KEY: ${OPENAI_API_KEY:-placeholder}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4}
  # 运行环境
  ENVIRONMENT: ${ENVIRONMENT:-production}
  CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-}
  # 依赖热更新：新增依赖装在 /app/data/pylibs（可写卷），
  # PYTHONPATH 前置让它优先于 site-packages 加载（根文件系统只读装不进）。
  # PATH 里也加上 pylibs/bin：pip --target 会把命令行脚本（taskiq / wuwei-debug
  # 等）放到这个目录，但它不在默认 PATH 里 —— 不加就会
  # `exec: "taskiq": executable file not found in $PATH`。
  PYTHONPATH: /app/data/pylibs:/app/backend
  PATH: /app/data/pylibs/bin:/usr/local/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin
  OPENBLAS_NUM_THREADS: 1
  SKILL_STORAGE_DIR: ${SKILL_STORAGE_DIR:-./data/skills}
  # LDAP（也可在管理后台配置，这里作引导）
  LDAP_ENABLED: ${LDAP_ENABLED:-false}
  LDAP_AUTO_CREATE_USERS: ${LDAP_AUTO_CREATE_USERS:-false}
  LDAP_EMAIL_DOMAIN: ${LDAP_EMAIL_DOMAIN:-}
  # 通知邮件
  NOTIFY_EMAIL_ADDRESS: ${NOTIFY_EMAIL_ADDRESS:-}
  NOTIFY_EMAIL_PASSWORD: ${NOTIFY_EMAIL_PASSWORD:-}
  NOTIFY_SMTP_HOST: ${NOTIFY_SMTP_HOST:-}
  NOTIFY_SMTP_PORT: ${NOTIFY_SMTP_PORT:-465}
  NOTIFY_SMTP_SSL: ${NOTIFY_SMTP_SSL:-true}
  # 本地嵌入模型（内网必配，留空会让记忆/知识库语义检索失效）
  KNOWLEDGE_EMBEDDING_LOCAL_MODEL: ${KNOWLEDGE_EMBEDDING_LOCAL_MODEL:-BAAI/bge-m3}
  KNOWLEDGE_EMBEDDING_LOCAL_DIMENSIONS: ${KNOWLEDGE_EMBEDDING_LOCAL_DIMENSIONS:-1024}
  # 离线：模型随包带，关掉 HF 联网探测
  HF_HOME: /app/data/hf-cache
  HF_ENDPOINT: ""
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"

services:
  backend:
    image: agenticos-runtime:latest
    pull_policy: never
    restart: always
    working_dir: /app
    shm_size: 512m
    read_only: true
    tmpfs:
      - /tmp:size=512M
      - /var/tmp:size=256M
    # 关掉 seccomp 过滤：Docker 默认 profile 在某些内核/版本组合下会拦截
    # pthread_create 内部的 clone()，报 `can't start new thread`（EAGAIN），
    # 表现是 Python 侧一路打「线程池不可用」然后重启。这是宿主环境问题，
    # 不是应用 bug —— 内网实测加这一行即恢复正常。
    security_opt:
      - seccomp:unconfined
    healthcheck:
      # 不用 `python -c ...`：那要 fork 一个新进程，容器线程/进程上限打满时
      # 探针本身就会失败，容器永远 unhealthy（前端跟着卡在 created）。
      # 这里用 bash 的 /dev/tcp 做纯 socket 连通性探测，不创建新进程。
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/8000' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      # 首次启动要加载嵌入模型（bge-m3 约 20-40 秒）
      start_period: 90s
    environment: *backend-env
    volumes:
      - ../backend:/app/backend
      - ../data:/app/data
    ports:
      - "${BACKEND_PORT:-10007}:8000"

  worker:
    image: agenticos-runtime:latest
    pull_policy: never
    restart: always
    working_dir: /app
    environment:
      <<: *backend-env
      PYTHONPATH: /app/data/pylibs:/app/backend
    command: ["python", "-m", "taskiq", "worker", "app.services.task_queue:taskiq_broker", "--workers", "2"]
    shm_size: 512m
    # 同 backend：seccomp 默认 profile 可能拦 clone()，导致线程创建失败
    security_opt:
      - seccomp:unconfined
    volumes:
      - ../backend:/app/backend
      - ../data:/app/data

  # 定时任务调度器：arq 把 cron 写在 WorkerSettings 里由 worker 自己跑；
  # taskiq 需要独立进程（taskiq scheduler）来读 schedule source 并投递。
  # cron 定义由 `python -m app.services.task_queue_seed` 写入（部署脚本调用一次）。
  scheduler:
    image: agenticos-runtime:latest
    pull_policy: never
    restart: always
    working_dir: /app
    environment:
      <<: *backend-env
      PYTHONPATH: /app/data/pylibs:/app/backend
    command: ["python", "-m", "taskiq", "scheduler", "app.services.task_queue:taskiq_scheduler"]
    shm_size: 256m
    security_opt:
      - seccomp:unconfined
    volumes:
      - ../backend:/app/backend
      - ../data:/app/data

  frontend:
    image: nginx:1.27-alpine
    # 内网既没有外网出口也没有镜像仓库。不加 never 时 Docker 仍会尝试访问
    # registry-1.docker.io 校验 tag，DNS 解析失败就整条 up -d 失败：
    #   dial tcp: lookup registry-1.docker.io ... server misbehaving
    # 即使本地已 docker load 过镜像也照样起不来。
    pull_policy: never
    restart: always
    command: ["nginx", "-g", "daemon off;"]
    volumes:
      - ../frontend/dist:/usr/share/nginx/html:ro
      - ../data/nginx-serve:/usr/share/nginx/sites
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${FRONTEND_PORT:-10008}:80"
    depends_on:
      backend:
        # 前端只是静态 nginx，不关心后端是否 healthy。用 service_healthy 时，
        # 后端一旦探针不通过（比如线程上限打满），前端就永远停在 created，
        # 用户连登录页都看不到。改成 started 即可 —— 后端晚几秒可用时，
        # nginx 代理会先返回 502，恢复后自动正常。
        condition: service_started
